# ---------------------------------------------------------------------------
# Mill River Trail — Sign 1: The Stolen Submarine
#
# This file is the single source of truth. The print artwork (36x24" PDF) and
# the English + Spanish web pages are both generated from it. Edit here, run
# `npm run all`, and both outputs update together so they can never drift.
# ---------------------------------------------------------------------------

id: sign-01-submarine
number: 1
status: proof            # draft | proof | approved | printed
tier: primary
# When a plate goes up, set status: printed and add the date, so a future
# reader can tell which text is on the metal and which is only online.
# printed: 2026-09-14


location:
  name: Fenian Ram
  place: Along the District, off Humphrey Street (visible from the Stack)
  lat: 41.3152393
  lon: -72.9065479

# Printed on the sign under the QR codes. See docs/DECISIONS.md — these must be
# live before the sign goes to the fabricator.
