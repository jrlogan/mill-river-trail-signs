# ---------------------------------------------------------------------------
# PRINT SIGN COPY
# Kept tight to fit the designer's layout. Word counts are checked at build
# time; the renderer warns if a block will overflow its box.
# ---------------------------------------------------------------------------
sign:

  # Opening paragraph, top of each language column.
  #
  # CORRECTION vs. the 9/4/22 comp, which read:
  #   "In 1875 Irishman John Philip Holland designed submarines for the US
  #    Navy, launching Fenian Ram in 1875."
  # Three problems: the Fenian Ram launched in 1881, not 1875 (1875 is when
  # Holland began designing); it was funded by the Fenian Brotherhood, not the
  # US Navy; and "was intended it to be" was ungrammatical.
  lede:
    en: >-
      In 1875 Irishman John Philip Holland began designing submarines in New
      Jersey. In 1881 he launched the Fenian Ram, built by Delamater Iron Works
      in New York City and paid for by the Fenian Skirmishing Fund, an
      organization working to free Ireland from British rule. Its 11-foot gun
      fired torpedoes at underwater targets, and its backers meant it to be the
      first of a fleet to fight the British navy.
    es: >-
      En 1875 el irlandés John Philip Holland comenzó a diseñar submarinos en
      Nueva Jersey. En 1881 botó el Fenian Ram, construido por la Delamater Iron
      Works de Nueva York y financiado por el Fenian Skirmishing Fund, una
      organización que buscaba liberar a Irlanda del dominio británico. Su cañón
      de 11 pies disparaba torpedos a objetivos submarinos, y sus financiadores
      querían que fuera el primero de una flota para combatir a la armada
      británica.

  section:
    # CORRECTION: the comp's Spanish heading read "Submarino del John Holland".
    # "del" before a personal name is ungrammatical in Spanish.
    heading:
      en: John Holland's Submarine
      es: El submarino de John Holland
    body:
      en: >-
        The Fenian Ram was seized in November 1883 by its Fenian backers and
        brought to New Haven, where they could not get it to run. It was towed
        up the Mill River and hidden in a wood shed at James Reynolds' brass
        mill, where it sat collecting dust for 33 years. In 1916 it was hauled
        onto a wagon and driven through New Haven on its way to Madison Square
        Garden in New York City. It is on display today at the Paterson Museum
        in New Jersey.
      # CORRECTIONS vs. the draft translation in Trail Sign #1 - Submarine.docx:
      #   "el viejo carnero feniano"  -> the proper noun Fenian Ram had been
      #      machine-translated into "carnero" (a male sheep). Kept as-is now.
      #   "el fondo financiero de Holanda" -> Holland the surname had been
      #      translated into Holanda, the country.
      es: >-
        El Fenian Ram fue confiscado en noviembre de 1883 por sus financiadores
        fenianos y llevado a New Haven, donde no lograron hacerlo funcionar. Fue
        remolcado río Mill arriba y escondido en un cobertizo de madera de la
        fábrica de latón de James Reynolds, donde quedó acumulando polvo durante
        33 años. En 1916 lo subieron a un vagón y lo trasladaron a través de New
        Haven rumbo al Madison Square Garden de Nueva York. Hoy se exhibe en el
        Museo Paterson, en Nueva Jersey.

  # ---------------------------------------------------------------------------
  # IMAGES. `file` is relative to assets/images/sign-01/.
  # ---------------------------------------------------------------------------
  images:
    - key: holland_portrait
      file: JohnPhilipHolland-AI-enhanced.jpg
      slot: center_top
      focus: 50% 18%          # keep his head in frame when the slot crops
      caption:
        en: >-
          John Philip Holland (b. 1841) emigrated from Ireland to the United
          States at 32 and eventually designed the first Navy submarine.
        es: >-
          John Philip Holland (n. 1841) emigró de Irlanda a Estados Unidos a los
          32 años y con el tiempo diseñó el primer submarino de la Marina.

    - key: paterson_museum
      # RESOLVED: the comp's interior shot of the sub on its teal cradle turned
      # up in the walk-images folder.
      file: FenianRam-Paterson-Museum-cradle.png
      slot: left_bottom
      focus: 50% 50%
      # RESTORED: this caption box read "Spanish version to come." on the comp.
      caption:
        en: >-
          The submarine is on permanent display at the Paterson Museum in
          Paterson, New Jersey.
        es: >-
          El submarino está en exhibición permanente en el Museo Paterson, en
          Paterson, Nueva Jersey.

    # The single most relevant photograph on this sign: the Fenian Ram inside
    # the shed on the Mill River, photographed by Simon Lake.
    - key: in_the_shed
      file: FenianRam-in-the-shed-NewHaven.png
      slot: center_bottom
      # RESTORED: this caption box also read "Spanish version to come."
      # CORRECTION: the draft translation rendered "Madison Square Garden" as
      # "el jardín de Madison Square" — a literal translation of a proper noun.
      caption:
        en: >-
          The Fenian Ram in the shed on the Mill River, photographed by the
          submarine designer Simon Lake.
        es: >-
          El Fenian Ram en el cobertizo del río Mill, fotografiado por el
          diseñador de submarinos Simon Lake.

    - key: diagram
      file: FenianRam-HollandJohn(1880)SubmarineForceMuseum.jpg
      slot: right_bottom
      caption:
        en: Diagram showing internals of the submarine
        es: Diagrama del interior del submarino

