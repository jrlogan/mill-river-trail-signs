# ---------------------------------------------------------------------------
# WEB PAGE — the "learn more" destination behind the QR codes.
# Body is Markdown. Headings become anchors.
# ---------------------------------------------------------------------------
web:
  subtitle:
    en: How a stolen Irish-American submarine spent 33 years in a shed on the Mill River
    es: Cómo un submarino irlandés-estadounidense robado pasó 33 años en un cobertizo del río Mill

  body:
    en: |
      In the late 19th century New Haven became an unlikely home for a
      revolutionary submarine prototype — a story that ties the city's
      industrial capacity to Irish-American political activism.

      ## An Irish schoolteacher turned inventor

      John Philip Holland was born in County Clare, Ireland, in 1841 and began
      his working life as a schoolteacher. He emigrated to Boston in 1872, moved
      to Paterson, New Jersey, and by 1875 was designing submarines. The US Navy
      had already dismissed his plans as impractical — "a fantastic scheme of a
      civilian landsman."

      The Fenian Brotherhood, the American counterpart to the Irish Republican
      Brotherhood, saw the possibilities the Navy did not. After Holland
      successfully tested a 33-inch model at Coney Island, the Brotherhood's
      Skirmishing Fund put up $4,000 for a full-sized boat, then $20,000 for a
      second and much larger one.

      ## The Fenian Ram

      Launched in 1881 from the Delamater Iron Company in New York, Holland Boat
      No. II was christened the "Fenian Ram" by a reporter at the New York Sun.
      She was 31 feet long, six feet across, and weighed 19 tons. A three-man
      crew ran her: a pilot working two upright levers like joysticks, an
      engineer minding the valves and ballast, and a gunner operating an
      eleven-foot pneumatic gun that ran through the center of the forward air
      reservoir.

      With the single exception of the periscope, which had not yet been
      invented, the Fenian Ram contained all the principal engineering ideas of
      the modern submarine. She dove in excess of 45 feet and successfully
      test-fired dummy projectiles supplied by the designer of the Monitor.
      Navigating blind, however, was perilous — in June 1882 she struck a
      Weehawken ferryboat and sank. Nobody was hurt, and she was raised within
      the week.

      ## Stolen

      In November 1883 a dispute over money erupted between Holland and the
      Brotherhood. Fearing that pending lawsuits would tie up Fenian property, a
      group of Fenians used a forged pass carrying Holland's own signature to
      enter the dock, and towed the Ram and a 16-foot model out of New York
      Harbor. The smaller boat sank in choppy water on the way. The Ram made it
      to New Haven.

      There the thieves discovered they had no idea how to operate her. Holland
      refused to help. Attempts to run her in New Haven Harbor went so badly
      that the harbor master declared the boat a menace to navigation and
      forbade further trials.

      ## Thirty-three years in a shed

      Unable to use or sell the submarine, the Brotherhood had her hauled ashore
      and put in a lumber shed on the Mill River, said to have been at 99 Mill
      River Street — across the water from where you are standing. Her 15
      horsepower Brayton oil engine was pulled out and set to work driving a
      forge in James Reynolds' brass foundry. The empty steel shell sat there
      gathering dust, the curiosity of the whole neighborhood, from 1883 until
      1916.

      ## What the New Haven papers said at the time

      The submarine was not a secret. It was a local curiosity, and the New
      Haven Morning Journal and Courier mentioned it more than once while it sat
      there.

      In May 1885, amid rumours that it had been sold to a foreign navy, the
      paper was dry about it: the Fenian ram "housed up near the Tin bridge, Mill
      river, has not been bought for the Russian navy, nor for the Turkish or
      English governments, but it is barely possible that it may have been
      purchased by the Esquimaux. The old thing is all rusted up and is worth a
      few dollars for old iron."

      In February 1887 it turns up again, at the end of a story about a man who
      built an oyster boat on top of East Rock and dragged it down on an ox-sled.
      "Also only a short distance from Neck bridge," the paper adds, "lies the
      mysterious Fenian ram, which excited much wonderment three or four years
      ago, and so much awe among the small boys. The ram is of iron, about thirty
      feet long, and lies high and dry in a shed in the back yard of a house
      built by Captain L. O'Brien next to the city bath house."

      Two things follow from that. The submarine's neighbour was the city bath
      house — the subject of another sign on this trail. And the boy who stood
      and stared at it in 1884 was doing roughly what you are doing now.

      ## Where exactly?

      The account usually given is that the Ram was stored at 99 Mill River
      Street, across from the ground the District now occupies. The 1885 and 1887
      newspaper items instead put it near the Tin bridge and a short distance
      from Neck Bridge, which is the old State Street crossing further north.

      These may not conflict — it sat there for thirty-three years and could have
      been moved — but the contemporary reports are the better evidence for where
      it was in the mid-1880s, and the project has not settled the question.

      ## Out of the shed

      In 1916 the Fenian Ram was hauled onto a wagon and driven through the
      streets of New Haven — photographs survive of her passing down Olive
      Street — on her way to Madison Square Garden, where she was exhibited to
      raise money for victims of the Easter Rising. She went next to the New
      York State Marine School. In 1927 Edward Browne bought her and moved her
      to Paterson, Holland's adopted home, where she remains on display at the
      Paterson Museum.

      Holland went on to win US Navy design competitions in 1888 and 1893. He
      died in 1914. Within forty days of his death a single submarine off the
      Dutch coast sank three British cruisers and killed more than 1,400 men.
      The New York Times noted that "although he was interested in submarines,
      Mr. Holland was opposed to war, and his idea of submarines was to
      incapacitate warships and not to destroy them and kill the men on them."
      In his 1907 sketches he had drawn a 40-passenger submarine with large
      circular viewing ports, meant "for amusement at seaside resorts."

    es: |
      A finales del siglo XIX, New Haven se convirtió en el hogar improbable de
      un prototipo de submarino revolucionario, una historia que une la
      capacidad industrial de la ciudad con el activismo político
      irlandés-estadounidense.

      ## Un maestro irlandés convertido en inventor

      John Philip Holland nació en el condado de Clare, Irlanda, en 1841 y
      comenzó su vida laboral como maestro de escuela. Emigró a Boston en 1872,
      se mudó a Paterson, Nueva Jersey, y para 1875 ya diseñaba submarinos. La
      Marina de Estados Unidos ya había descartado sus planes por poco
      prácticos: "el proyecto fantasioso de un civil de tierra firme".

      La Hermandad Feniana, la contraparte estadounidense de la Hermandad
      Republicana Irlandesa, vio las posibilidades que la Marina no vio. Después
      de que Holland probara con éxito un modelo de 33 pulgadas en Coney Island,
      el Skirmishing Fund de la Hermandad aportó 4.000 dólares para una
      embarcación de tamaño completo y luego 20.000 para una segunda mucho más
      grande.

      ## El Fenian Ram

      Botado en 1881 desde la Delamater Iron Company de Nueva York, el Holland
      Boat No. II fue bautizado "Fenian Ram" por un periodista del New York Sun.
      Medía 31 pies de largo y seis de ancho, y pesaba 19 toneladas. Lo operaba
      una tripulación de tres: un piloto que manejaba dos palancas verticales
      como si fueran mandos, un ingeniero que vigilaba las válvulas y el lastre,
      y un artillero a cargo de un cañón neumático de once pies que atravesaba
      el centro del depósito de aire delantero.

      Con la única excepción del periscopio, que aún no se había inventado, el
      Fenian Ram contenía todas las ideas de ingeniería principales del
      submarino moderno. Se sumergió a más de 45 pies y disparó con éxito
      proyectiles de prueba suministrados por el diseñador del Monitor. Navegar
      a ciegas, sin embargo, era peligroso: en junio de 1882 chocó contra un
      transbordador de Weehawken y se hundió. Nadie resultó herido y fue
      reflotado en menos de una semana.

      ## Robado

      En noviembre de 1883 estalló una disputa por dinero entre Holland y la
      Hermandad. Temiendo que los litigios pendientes inmovilizaran los bienes
      fenianos, un grupo de fenianos usó un pase falsificado con la firma del
      propio Holland para entrar al muelle y remolcó el Ram y un modelo de 16
      pies fuera del puerto de Nueva York. La embarcación más pequeña se hundió
      en el oleaje durante el trayecto. El Ram llegó a New Haven.

      Allí los ladrones descubrieron que no tenían idea de cómo operarlo.
      Holland se negó a ayudar. Los intentos de hacerlo funcionar en el puerto
      de New Haven salieron tan mal que el capitán del puerto declaró la
      embarcación un peligro para la navegación y prohibió más pruebas.

      ## Treinta y tres años en un cobertizo

      Incapaz de usar o vender el submarino, la Hermandad lo hizo sacar del agua
      y lo guardó en un cobertizo de madera junto al río Mill, según se dice en
      el número 99 de la calle Mill River, al otro lado del agua desde donde
      usted está parado. Le quitaron el motor de petróleo Brayton de 15 caballos
      de fuerza y lo pusieron a mover una fragua en la fundición de latón de
      James Reynolds. El casco de acero vacío quedó allí juntando polvo, la
      curiosidad de todo el vecindario, desde 1883 hasta 1916.

      ## Lo que decían los periódicos de New Haven

      El submarino no era ningún secreto. Era una curiosidad local, y el Morning
      Journal and Courier de New Haven lo mencionó más de una vez mientras estuvo
      allí.

      En mayo de 1885, entre rumores de que había sido vendido a una armada
      extranjera, el periódico fue seco: el Fenian ram "guardado cerca del Tin
      bridge, en el río Mill, no ha sido comprado por la armada rusa, ni por los
      gobiernos turco o inglés, aunque es apenas posible que lo hayan adquirido
      los esquimales. El viejo trasto está todo oxidado y vale unos pocos dólares
      como chatarra".

      En febrero de 1887 reaparece, al final de un reportaje sobre un hombre que
      construyó una barca ostrera en lo alto de East Rock y la bajó en un trineo
      de bueyes. "También, a poca distancia de Neck bridge", añade el periódico,
      "yace el misterioso Fenian ram, que despertó mucho asombro hace tres o
      cuatro años, y tanto sobrecogimiento entre los muchachos. El ram es de
      hierro, mide unos treinta pies y está en seco en un cobertizo, en el patio
      trasero de una casa construida por el capitán L. O'Brien, junto a la caseta
      de baños municipal".

      De ahí se siguen dos cosas. El vecino del submarino era la caseta de baños
      municipal, que es el tema de otro letrero de este sendero. Y el muchacho
      que se quedaba mirándolo en 1884 hacía más o menos lo mismo que usted ahora.

      ## ¿Dónde exactamente?

      La versión habitual dice que el Ram se guardó en el número 99 de la calle
      Mill River, enfrente del terreno que hoy ocupa el District. Las noticias de
      1885 y 1887 lo sitúan en cambio cerca del Tin bridge y a poca distancia de
      Neck Bridge, el viejo cruce de State Street, más al norte.

      Puede que no se contradigan — estuvo allí treinta y tres años y pudo
      moverse — pero los relatos de la época son la mejor prueba de dónde estaba
      a mediados de la década de 1880, y el proyecto no ha resuelto la cuestión.

      ## Fuera del cobertizo

      En 1916 subieron el Fenian Ram a un vagón y lo pasearon por las calles de
      New Haven — se conservan fotografías de su paso por Olive Street — rumbo
      al Madison Square Garden, donde se exhibió para recaudar fondos para las
      víctimas del Alzamiento de Pascua. De allí pasó a la New York State Marine
      School. En 1927 Edward Browne lo compró y lo trasladó a Paterson, la
      ciudad adoptiva de Holland, donde sigue expuesto en el Museo Paterson.

      Holland ganó después concursos de diseño de la Marina estadounidense en
      1888 y 1893. Murió en 1914. A los cuarenta días de su muerte, un solo
      submarino frente a la costa holandesa hundió tres cruceros británicos y
      mató a más de 1.400 hombres. El New York Times señaló que "aunque le
      interesaban los submarinos, el señor Holland se oponía a la guerra, y su
      idea de los submarinos era incapacitar los buques de guerra, no
      destruirlos ni matar a los hombres a bordo". En sus bocetos de 1907 había
      dibujado un submarino para 40 pasajeros con grandes portillas circulares
      redondas, pensado "para el entretenimiento en balnearios".

