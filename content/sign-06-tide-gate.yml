web:
  subtitle:
    en: Why the water changes here, and what it costs the fish that have to get past
    es: Por qué cambia el agua aquí, y qué les cuesta a los peces que tienen que pasar

  body:
    en: |
      Stand at the gate and you are standing on a boundary. Downstream the Mill
      River is an arm of the sea: salt water on the flood tide, mud flats on the
      ebb, twice a day, every day. Upstream it is a fresh water stream. The
      change is abrupt because it is engineered.

      ## Why the gate is here

      A tidal river floods. Push a high tide up against heavy rain coming down
      and the water has nowhere to go but sideways, over whatever has been built
      on the old marsh — which, on the Mill River, is most of it.

      New Haven had been told this. The 1910 city plan by Cass Gilbert and
      Frederick Law Olmsted recommended a tide gate, along with a protective
      buffer of open land along the river rather than the vertical walls the city
      would eventually build.

      Flooding was not the only argument. Salt marsh breeds salt-marsh
      mosquitoes, and in the 1910s New Haven ran a serious campaign against them
      — ditching the meadows, spreading oil on standing water, and, as a
      newspaper account of the 1912 season put it, "looking after the tide
      gates." The city put gates across the West River in 1919 for exactly that
      reason. Gates went across the Mill River in the same era, at what is now
      the Interstate 91 crossing.

      ## Who designed it, and when

      For years this project could not say when the gates were built. It can now
      say when they were **drawn**, because the correspondence survives.

      The designer was **Frederick L. Ford, New Haven's city engineer**, working
      from Room 18 of City Hall. He sent his plans to the Olmsted Brothers, the
      landscape firm advising the city on East Rock Park, and on **3 January
      1917** they wrote back:

      > We acknowledge the receipt of your plans for the proposed **Mill River
      > Dam**, and they seem to us to be satisfactory. We have the following
      > suggestions for minor changes.
      >
      > 1. **The platform leading over the gates**, from one side of the river to
      > the other, we would suggest should be kept closed to the public… a
      > lighter protecting railing on either side would be quite sufficient… This
      > will make the railing much lighter and less obtrusive in the landscape.
      >
      > 2. The fence on **the spillway** we believe would be adequate if made
      > three feet instead of six feet high. A similar fence… should also be
      > built on top of **the river walls**.

      That is the structure you are looking at, being argued over at the level of
      railing heights, in January 1917. A blueprint of the Mill River section had
      gone to the Olmsted office as early as **November 1915**.

      The letter is on this sign. It sits in the Olmsted Associates Records at
      the Library of Congress, job file 5313 — East Rock Park, New Haven — along
      with three hundred and fifty other pages nobody on this project had read.

      **What we still cannot say is when the concrete was poured.** One recent
      research summary gives **1935**, built with New Deal relief labour under
      the state's mosquito programme, and the 1930s were certainly when federal
      crews ditched and diked salt marshes the length of this shore. But the
      design was finished eighteen years earlier, and the city put gates across
      the West River in 1919. Whether the Mill River gates went in with them, or
      waited for the Depression, or were built twice, is the question. If you
      know where the contract is, the trail would like to hear from you.

      It does the job it was built for. It also changed the river permanently.

      ## Where the sea legally ends

      One thing about the gates is fixed beyond argument, because it is written
      into Connecticut regulation. The state divides its waters into a **marine
      district** and an **inland district**, and it draws the line stream by
      stream. For this river the rule reads:

      > **Mill River, New Haven** — marine district: up to and including below
      > tide gates at State Street Bridge. Inland district: all waters above.

      Which fish you may take, in what season, under which licence, changes at
      this structure. A hundred years ago somebody built a barrier to keep salt
      water off the marsh; the state has since accepted it as the place where the
      sea ends. An engineering decision became a boundary on a map.

      ## The spring run

      River herring — alewives and blueback herring — are anadromous: they live
      at sea and spawn in fresh water, returning each spring to the river where
      they hatched. Historically they ran the Mill River in enormous numbers, and
      they fed everything, from osprey and eagles to striped bass waiting at the
      mouth to the people who netted them off the banks.

      A run needs a clear path. The Whitney dam closed the upper river in 1860.
      Structures downstream narrow what is left. Fish that can find no way past a
      barrier simply do not spawn that year.

      ## Undoing some of it

      Connecticut has spent the last few decades reopening rivers: fish ladders
      and bypass channels built around dams, tide gates replaced with
      self-regulating designs that let fish through while still holding back
      storm surge, and in a growing number of cases dams removed altogether. Each
      project adds back miles of spawning habitat, and the herring find it
      quickly.

      ## What to look for

      In April and May, look for movement in the shallows and for the birds that
      follow it — osprey overhead, cormorants and herons working the edges. The
      tall feathery reed along the banks is Phragmites, an aggressive invader
      that crowds out the native marsh grasses fish and crabs shelter in, and it
      spreads fastest on disturbed ground.

    es: |
      Párese en la compuerta y estará sobre una frontera. Aguas abajo, el río
      Mill es un brazo de mar: agua salada con la pleamar, llanuras de lodo con
      la bajamar, dos veces al día, todos los días. Aguas arriba es un arroyo de
      agua dulce. El cambio es brusco porque está construido.

      ## Por qué está la compuerta

      Un río de marea se desborda. Junte una marea alta empujando hacia dentro
      con una lluvia fuerte bajando y el agua no tiene a dónde ir salvo a los
      lados, sobre lo que se haya construido en la antigua marisma, que en el río
      Mill es casi todo.

      A New Haven ya se lo habían advertido. El plan urbano de 1910 de Cass
      Gilbert y Frederick Law Olmsted recomendaba una compuerta de marea, junto
      con una franja protectora de terreno abierto a lo largo del río en lugar de
      los muros verticales que la ciudad acabaría levantando.

      Las inundaciones no eran el único argumento. La marisma salada cría
      mosquitos de marisma, y en la década de 1910 New Haven emprendió una
      campaña seria contra ellos: zanjar los prados, esparcir aceite sobre el agua
      estancada y, como decía la crónica de la temporada de 1912, "ocuparse de las
      compuertas de marea". La ciudad instaló compuertas en el West River en 1919
      exactamente por ese motivo. En el Mill River se colocaron en la misma época,
      en lo que hoy es el cruce de la interestatal 91.

      **Cuándo exactamente sigue siendo una pregunta abierta.** Las fuentes dicen
      "los años treinta"; el proyecto aún no ha encontrado la orden, el contrato o
      el informe del ingeniero que fijaría el año. Si sabe dónde está ese papel,
      al sendero le gustaría saberlo.

      ## Quién la diseñó, y cuándo

      Durante años este proyecto no pudo decir cuándo se construyeron las
      compuertas. Ahora puede decir cuándo se **dibujaron**, porque se conserva
      la correspondencia.

      El autor fue **Frederick L. Ford, ingeniero municipal de New Haven**, desde
      el despacho 18 del Ayuntamiento. Envió sus planos a los Olmsted Brothers,
      la firma paisajista que asesoraba a la ciudad sobre East Rock Park, y el
      **3 de enero de 1917** le contestaron:

      > Acusamos recibo de sus planos para la **presa propuesta del río Mill**, y
      > nos parecen satisfactorios. Tenemos las siguientes sugerencias de cambios
      > menores.
      >
      > 1. **La pasarela que cruza por encima de las compuertas**, de una orilla a
      > otra, sugerimos que se mantenga cerrada al público… una barandilla de
      > protección más ligera a cada lado sería suficiente… Así la barandilla
      > resultará mucho más ligera y menos intrusiva en el paisaje.
      >
      > 2. La valla del **aliviadero** creemos que bastaría con tres pies en lugar
      > de seis. Una valla similar… debería colocarse también sobre **los muros
      > del río**.

      Esa es la estructura que usted está mirando, discutida a la altura de las
      barandillas, en enero de 1917. Un plano heliográfico de la sección del río
      Mill había llegado a la oficina de Olmsted ya en **noviembre de 1915**.

      La carta está en este letrero. Se conserva en los Olmsted Associates
      Records de la Biblioteca del Congreso, expediente 5313 — East Rock Park,
      New Haven — junto a otras trescientas cincuenta páginas que nadie en este
      proyecto había leído.

      **Lo que seguimos sin poder decir es cuándo se echó el hormigón.** Un
      resumen reciente de investigación da **1935**, con mano de obra de ayuda del
      New Deal dentro del programa estatal contra los mosquitos, y los años
      treinta fueron desde luego cuando las cuadrillas federales zanjaron y
      diquearon las marismas de toda esta costa. Pero el diseño estaba terminado
      dieciocho años antes, y la ciudad puso compuertas en el West River en 1919.
      Si las del Mill se instalaron con aquellas, o esperaron a la Depresión, o se
      construyeron dos veces, es la pregunta. Si sabe dónde está el contrato, al
      sendero le gustaría saberlo.

      Cumple la función para la que se construyó. También cambió el río para
      siempre.

      ## Donde termina legalmente el mar

      Hay algo de las compuertas que está fijado sin discusión, porque está
      escrito en la normativa de Connecticut. El estado divide sus aguas en un
      **distrito marino** y un **distrito interior**, y traza la línea río por
      río. Para este la norma dice:

      > **Mill River, New Haven** — distrito marino: hasta e incluyendo por
      > debajo de las compuertas de marea del puente de State Street. Distrito
      > interior: todas las aguas por encima.

      Qué peces puede usted sacar, en qué temporada y con qué licencia cambia en
      esta estructura. Hace cien años alguien levantó una barrera para apartar el
      agua salada de la marisma; desde entonces el estado la ha aceptado como el
      punto donde termina el mar. Una decisión de ingeniería se convirtió en una
      frontera en el mapa.

      ## La subida de primavera

      Los arenques de río — alosas y arenques de lomo azul — son anádromos: viven
      en el mar y desovan en agua dulce, y vuelven cada primavera al río donde
      nacieron. Históricamente remontaban el Mill en cantidades enormes, y
      alimentaban a todo: desde águilas pescadoras y águilas hasta lubinas
      esperando en la desembocadura, pasando por la gente que los pescaba con red
      desde la orilla.

      Una subida necesita camino libre. La presa de Whitney cerró el río alto en
      1860. Las estructuras de aguas abajo estrechan lo que queda. Un pez que no
      encuentra paso simplemente no desova ese año.

      ## Deshacer una parte

      Connecticut lleva décadas reabriendo ríos: escalas y canales de paso
      alrededor de las presas, compuertas sustituidas por diseños autorregulables
      que dejan pasar a los peces sin dejar de contener la marejada y, cada vez
      más, presas retiradas del todo. Cada proyecto devuelve millas de hábitat de
      desove, y los arenques lo encuentran rápido.

      ## Qué mirar

      En abril y mayo, busque movimiento en las aguas someras y las aves que lo
      siguen: águilas pescadoras arriba, cormoranes y garzas trabajando los
      bordes. El carrizo alto y plumoso de las orillas es Phragmites, un invasor
      agresivo que desplaza a las hierbas nativas de marisma donde se refugian
      peces y cangrejos, y que se extiende más rápido en terreno alterado.

