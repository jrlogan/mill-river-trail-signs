title:
  en: The Gate in the River
  es: La Compuerta del Río

sign:
  lede:
    en: >-
      Everything below this point is tidal. Salt water pushes up from the harbour
      twice a day and slides back out, and the plants and animals that live down
      there are built for the swing. Above it the water is fresh. The line
      between the two is not natural — it is a gate, put across the river around
      1930 to stop the tide going any further inland.
    es: >-
      Todo lo que hay por debajo de este punto es de marea. El agua salada sube
      desde el puerto dos veces al día y vuelve a salir, y las plantas y animales
      que viven ahí abajo están hechos para ese vaivén. Por encima, el agua es
      dulce. La línea que separa a las dos no es natural: es una compuerta,
      atravesada en el río hacia 1930 para impedir que la marea siguiera
      entrando tierra adentro.

  section:
    heading:
      en: What a Gate Does to a Fish
      es: Lo que una compuerta le hace a un pez
    body:
      en: >-
        River herring spend their lives at sea and come back to fresh water every
        spring to spawn, returning to the river they hatched in. For that to
        work they have to be able to get upstream. A tide gate protects the land
        behind it from flooding, but it also narrows the river to whatever the
        gate will pass, and dams do the rest — Whitney's wall has closed the
        upper Mill River to migrating fish since 1860. Across Connecticut,
        fishways, gate replacements and dam removals have been reopening rivers
        to the spring run. Each one adds back a few miles of spawning ground.
      es: >-
        Los arenques de río pasan la vida en el mar y vuelven al agua dulce cada
        primavera para desovar, regresando al río donde nacieron. Para que eso
        funcione tienen que poder remontar. Una compuerta protege de las
        inundaciones al terreno que queda detrás, pero también estrecha el río a
        lo que la compuerta deje pasar, y las presas hacen el resto: el muro de
        Whitney cerró el alto Mill River a los peces migratorios desde 1860. Por
        todo Connecticut, escalas para peces, cambios de compuertas y demoliciones
        de presas han ido reabriendo ríos a la subida de primavera. Cada uno
        devuelve unas millas de zona de desove.

