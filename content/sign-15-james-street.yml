sign:
  lede:
    en: >-
      The long brick building across the water spent seventy years making the
      boxes that famous things came in — the Almond Joy wrapper, the Budweiser
      carton, the Hershey's box — and then it spent twenty more making something
      famous itself. If you owned a satin baseball jacket in 1990, it was
      designed and shipped from here.
    es: >-
      El largo edificio de ladrillo al otro lado del agua pasó setenta años
      fabricando las cajas en las que venían las cosas famosas — el envoltorio
      del Almond Joy, la caja de Budweiser, la de Hershey's — y luego pasó veinte
      más fabricando algo famoso él mismo. Si en 1990 tenía usted una chaqueta
      satinada de béisbol, se diseñó y se envió desde aquí.

  section:
    heading:
      en: Why Here
      es: Por qué aquí
    body:
      en: >-
        The National Folding Box Company came out of a merger of smaller carton
        makers in New York, and in 1905 it chose New Haven as its production
        centre and bought this entire block. The reason was the water and the
        rails: barges below, spurs alongside, and a neighbourhood of people to
        work the lines. The four-storey plant went up in 1914, and by 1927 this
        was the largest and most prestigious folding box company in the world.
        The river you are standing beside is the reason a global industry chose
        this corner of Barnesville.
      es: >-
        La National Folding Box Company nació de la fusión de varios fabricantes
        de cartón en Nueva York y en 1905 eligió New Haven como centro de
        producción y compró esta manzana entera. La razón era el agua y el
        ferrocarril: barcazas abajo, ramales al lado y un barrio entero de gente
        para atender las líneas. La planta de cuatro pisos se levantó en 1914 y
        en 1927 esta era la fábrica de cajas plegables más grande y prestigiosa
        del mundo. El río junto al que está usted es la razón por la que una
        industria mundial eligió este rincón de Barnesville.

