web:
  subtitle:
    en: A quarry, a tourist attraction and a 427-acre park, in that order
    es: Una cantera, una atracción turística y un parque de 427 acres, en ese orden

  body:
    en: |
      East Rock is the most obvious thing in New Haven and the easiest to take
      for granted. It is a 365-foot cliff of basalt — trap rock — formed when a
      sheet of lava cooled underground roughly 200 million years ago, as the
      continent was pulling away from Africa. Glaciers later stripped the softer
      material off its face.

      What is less obvious is that it was very nearly not a park.

      ## Private ground

      Through the middle of the 1800s the land that is now East Rock Park was
      divided among several private owners, and they used it the way you would
      expect people to use a large exposed mass of good building stone: they
      quarried it. A guide to the park printed in 1884 still routes visitors past
      "the old Stewart road" near the quarry sites.

      ## The man who built boats on top of a cliff

      The top of the rock belonged to Milton J. Stewart. He had followed the sea
      once, and he lived up there in the stone house he had built, with dogs,
      cats, cows and a bad-tempered black horse, three hundred feet above New
      Haven.

      And he built boats. Not model boats — eight-to-ten-ton oyster craft, the
      kind that went out on the Sound under a small steam boiler. He built them
      on the summit, in full view of a city that assumed he had lost his mind.

      > Out of the many hundreds of people who saw Milton Stewart's boat lying on
      > top of East Rock, where it was built by him, probably nine-tenths
      > concluded that the boat would never be worth anything except for kindling
      > wood.

      They were wrong twice over. His method was to wait for a heavy snow, load
      the hull onto an ox-sled with bolsters under it to take the jolting, and
      walk a pair of horses down the old Rock road — "which is as bad as the
      rocky road to Dublin" — to tide water near Neck Bridge. He did it at least
      twice, roughly twenty years apart. One of the two boats was sold to a
      Bridgeport firm and was still working the oyster beds there when the
      *Journal and Courier* wrote the story up in February 1887.

      Not everything he started came down. He also began a 35-foot schooner and
      told the neighbours that eighteen or twenty yoke of oxen would fetch it to
      the water. That one had to be pulled apart on the summit and burned as
      firewood.

      He did not go quietly, either. The city wanted the rock; Stewart said he
      owned it and meant to die on top of it, and it took condemnation
      proceedings to move him.

      There is one more story, and it should be labelled as a story: a Brooklyn
      paper claimed in 1899 that Stewart had once walked into New Haven
      prophesying that Long Island Sound would rise and drown Connecticut, that
      hundreds believed him, and that the boat on the summit was his ark. It is a
      good tale, told twelve years after the fact by a newspaper a long way away,
      and nobody has yet found it in a New Haven paper. Treat it as folklore
      until somebody does.

      ## Making a park

      The city started buying parcels, and in 1880 created a parks commission to
      manage what it had assembled. Ultimately the park reached about 427 acres
      across New Haven and Hamden.

      Its principal designer was Donald Grant Mitchell, a New Haven writer and
      landscape designer who also laid out Edgewood Park. The Olmsted Brothers
      firm — the successor practice to Frederick Law Olmsted — designed the
      portion of the park along the Mill River, including Rice Field.

      In 1887 the Soldiers and Sailors Monument was built on the summit, and the
      rock acquired the silhouette it has now.

      ## And nearly lost again

      In the 1960s the state proposed running a highway connector along the Mill
      River and through the park. Residents organised against it and stopped it —
      a 1965 state law let the city's aldermen refuse the taking — though
      Interstate 91 still took about ten acres.

      A park is not a natural feature. It is a decision that has to keep being
      made.

      ## What is here now

      Peregrine falcons nest on the trap rock cliffs of the Connecticut ridges,
      and the updraughts off the face make this good raptor country. In the
      woods, watch for garlic mustard and Japanese barberry — both introduced,
      both aggressive, and both changing what can grow underneath.

    es: |
      East Rock es lo más evidente de New Haven y lo más fácil de dar por
      sentado. Es un acantilado de basalto de 365 pies — roca trapeana — formado
      cuando una capa de lava se enfrió bajo tierra hace unos 200 millones de
      años, mientras el continente se separaba de África. Los glaciares
      arrancaron después el material más blando de su cara.

      Lo que resulta menos evidente es que estuvo a punto de no ser un parque.

      ## Terreno privado

      A mediados del siglo XIX el terreno que hoy es el parque de East Rock
      estaba repartido entre varios propietarios privados, que lo usaban como
      cabía esperar que se usara una gran masa expuesta de buena piedra de
      construcción: como cantera. Una guía del parque impresa en 1884 todavía
      lleva al visitante junto al "viejo camino de Stewart", cerca de las
      canteras.

      ## El hombre que construía barcos en lo alto de un acantilado

      La cima de la roca era de Milton J. Stewart. Había sido marino, y vivía
      allí arriba en la casa de piedra que se había levantado, con perros, gatos,
      vacas y un caballo negro de mal genio, a trescientos pies sobre New Haven.

      Y construía barcos. No maquetas: barcos ostreros de ocho a diez toneladas,
      de los que salían al Sound con una pequeña caldera de vapor. Los construía
      en la cima, a la vista de una ciudad convencida de que había perdido el
      juicio.

      > De los muchos centenares de personas que vieron el barco de Milton
      > Stewart en lo alto de East Rock, donde él mismo lo construyó, unas nueve
      > décimas partes concluyeron que aquel barco no serviría más que para leña.

      Se equivocaban por partida doble. Su método era esperar una buena nevada,
      cargar el casco en un trineo de bueyes con travesaños debajo para amortiguar
      los tumbos y bajar con un par de caballos por el viejo camino de la Roca
      — "tan malo como el pedregoso camino de Dublín" — hasta el agua de marea,
      cerca de Neck Bridge. Lo hizo al menos dos veces, con unos veinte años de
      diferencia. Uno de los dos barcos se vendió a una empresa de Bridgeport y
      seguía trabajando allí los bancos de ostras cuando el *Journal and Courier*
      contó la historia en febrero de 1887.

      No todo lo que empezó llegó abajo. También comenzó una goleta de 35 pies y
      aseguró a los vecinos que dieciocho o veinte yuntas de bueyes la llevarían
      al agua. Aquella hubo que desmontarla en la cima y quemarla como leña.

      Tampoco se marchó sin más. La ciudad quería la roca; Stewart decía que era
      suya y que pensaba morir en lo alto, y hubo que expropiarla para moverlo.

      Queda una historia más, y conviene etiquetarla como tal: un periódico de
      Brooklyn afirmó en 1899 que Stewart había bajado una vez a New Haven
      profetizando que Long Island Sound se alzaría y anegaría Connecticut, que
      cientos le creyeron y que el barco de la cima era su arca. Es un buen
      relato, contado doce años después por un diario muy lejano, y nadie lo ha
      encontrado todavía en la prensa de New Haven. Trátese como folclore hasta
      que alguien lo haga.

      ## Hacer un parque

      La ciudad empezó a comprar parcelas y en 1880 creó una comisión de parques
      para gestionar lo reunido. El parque llegó a unos 427 acres entre New Haven
      y Hamden.

      Su diseñador principal fue Donald Grant Mitchell, escritor y paisajista de
      New Haven que también trazó Edgewood Park. La firma Olmsted Brothers — la
      sucesora del despacho de Frederick Law Olmsted — diseñó la parte del parque
      junto al río Mill, incluido Rice Field.

      En 1887 se levantó en la cima el Monumento a los Soldados y Marineros, y la
      roca adquirió la silueta que tiene hoy.

      ## Y casi se pierde otra vez

      En los años sesenta el estado propuso llevar una conexión de autopista
      junto al río Mill y a través del parque. Los vecinos se organizaron
      contra él y lo detuvieron: una ley estatal de 1965 permitió a los concejales
      rechazar la expropiación. Aun así, la interestatal 91 se llevó unos diez
      acres.

      Un parque no es un accidente natural. Es una decisión que hay que seguir
      tomando.

      ## Qué hay ahora

      Los halcones peregrinos anidan en los acantilados de roca trapeana de las
      crestas de Connecticut, y las corrientes ascendentes de la pared hacen de
      esto buen territorio de rapaces. En el bosque, fíjese en la aliaria y el
      agracejo japonés: ambos introducidos, ambos agresivos y ambos cambiando lo
      que puede crecer debajo.

