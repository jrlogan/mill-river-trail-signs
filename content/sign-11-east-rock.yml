sign:
  lede:
    en: >-
      East Rock is a 365-foot wall of basalt, the edge of a lava sheet that
      cooled underground and was later exposed by ice. For most of the 1800s it
      was not a park. It was cut into private parcels and quarried for stone, and
      the top of it belonged to Milton J. Stewart, an old sailor who lived up
      there and built ocean-going oyster boats on the summit — then waited for
      snow and dragged them down the rock on an ox-sled.
    es: >-
      East Rock es un muro de basalto de 365 pies, el borde de una capa de lava
      que se enfrió bajo tierra y que el hielo dejó luego al descubierto. Durante
      casi todo el siglo XIX no fue un parque. Estaba dividido en parcelas
      privadas y se explotaba como cantera, y la cima pertenecía a Milton J.
      Stewart, un viejo marino que vivía allí arriba y construía en la cumbre
      barcos ostreros de altura; luego esperaba a que nevara y los bajaba por la
      roca en un trineo de bueyes.

  section:
    heading:
      en: Making It a Park
      es: Convertirlo en parque
    body:
      en: >-
        The city began buying up parcels and in 1880 created a parks commission
        to manage the land. The park grew to about 427 acres across New Haven and
        Hamden. Its principal designer was Donald Grant Mitchell, a New Havener
        who also laid out Edgewood Park; the Olmsted Brothers firm designed the
        portion along the Mill River, including Rice Field. The Soldiers and
        Sailors Monument went up on the summit in 1887. Every part of that took
        deliberate public effort — a rock nobody protects becomes a quarry.
      es: >-
        La ciudad empezó a comprar parcelas y en 1880 creó una comisión de
        parques para gestionar el terreno. El parque creció hasta unos 427 acres
        entre New Haven y Hamden. Su diseñador principal fue Donald Grant
        Mitchell, natural de New Haven, que también trazó Edgewood Park; la firma
        Olmsted Brothers diseñó la parte junto al río Mill, incluido Rice Field.
        El Monumento a los Soldados y Marineros se levantó en la cima en 1887.
        Todo eso exigió un esfuerzo público deliberado: una roca que nadie
        protege acaba siendo una cantera.

