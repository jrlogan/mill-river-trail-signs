          Nobody should swim here after rain. Runoff carries road grit, lawn
          chemicals and overflow into the river, and bacteria counts spike for
          days afterwards.
        es: >-
          Nadie debería nadar aquí después de la lluvia. La escorrentía arrastra
          al río la suciedad de las calles, los químicos de los jardines y los
          desbordes, y los niveles de bacterias se disparan durante días.

web:
  subtitle:
    en: Before plumbing reached the tenements, washing was a public question — and the river was the answer
    es: Antes de que las cañerías llegaran a las viviendas obreras, lavarse era una cuestión pública, y el río era la respuesta

  body:
    en: |
      It is easy to forget how recently a bath became a private thing. In the New
      Haven of the 1880s, a tenement flat had no tub, no hot water and often no
      water at all above the ground floor. Washing meant a basin, a kettle and a
      good deal of carrying — or it meant the river.

      ## The bathing city

      Through the summer the Mill River filled with people. Boys swam off the
      banks and the bridge abutments; families came down in the evening when the
      factories had stopped. This was normal in every American industrial city,
      and so was the fact that the water they were swimming in also carried the
      discharge of every works upstream.

      ## A public health argument

      Beginning in the 1880s, reformers across the country made a new case: that
      cleanliness was not a moral failing of the poor but a service a city owed
      its residents, and that a city which provided nowhere to wash had no
      standing to blame its people for the diseases that followed. New York,
      Boston, Chicago and Philadelphia built free public baths on this argument.

      New Haven had the same debate, and its newspapers ran it through 1880 and
      1881. Bath houses went up at the water's edge — plain wooden buildings with
      changing rooms, floats and an attendant, free to use, separated by sex and
      by hour, and busy enough to need the schedule.

      ## The contradiction

      What the city could not do was make the water clean. The same decades that
      produced the bath house produced the factories whose outfalls ran straight
      into the river, and the argument about which mattered more went on for
      close to a century. Public baths eventually moved indoors and away from the
      river; plumbing reached the tenements; and by 1970 the Mill River tested at
      four times the legal limit for swimming.

      Water quality here has improved a great deal since the industry left. It
      still drops sharply after rain, when runoff from streets and lawns and
      overflow from ageing sewers reaches the river, and bacteria counts stay
      high for days.

    es: |
      Es fácil olvidar lo reciente que es que bañarse sea algo privado. En el New
      Haven de la década de 1880, un piso obrero no tenía bañera, ni agua
      caliente, y a menudo no tenía agua por encima de la planta baja. Lavarse
      significaba una palangana, una olla y mucho acarreo, o significaba el río.

      ## La ciudad que se bañaba

      Durante el verano el río Mill se llenaba de gente. Los muchachos se
      lanzaban desde las orillas y los estribos de los puentes; las familias
      bajaban al atardecer, cuando las fábricas paraban. Esto era normal en
      cualquier ciudad industrial estadounidense, y también lo era el hecho de
      que el agua en la que se bañaban arrastraba los vertidos de todas las
      fábricas de aguas arriba.

      ## Un argumento de salud pública

      A partir de 1880, reformadores de todo el país plantearon un argumento
      nuevo: que la limpieza no era un defecto moral de los pobres, sino un
      servicio que la ciudad debía a sus habitantes, y que una ciudad que no
      ofrecía dónde lavarse no tenía autoridad para culpar a su gente de las
      enfermedades que venían después. Nueva York, Boston, Chicago y Filadelfia
      construyeron baños públicos gratuitos con ese razonamiento.

      New Haven tuvo el mismo debate, y sus periódicos lo recogieron en 1880 y
      1881. Se levantaron casetas de baño a la orilla del agua: edificios
      sencillos de madera con vestuarios, plataformas y un encargado, de uso
      gratuito, separados por sexo y por horario, y con bastante afluencia como
      para necesitar ese horario.

      ## La contradicción

      Lo que la ciudad no podía hacer era limpiar el agua. Las mismas décadas que
      produjeron la caseta de baños produjeron las fábricas cuyos desagües iban a
      dar directamente al río, y la discusión sobre qué importaba más duró casi
      un siglo. Los baños públicos acabaron trasladándose a locales cerrados y
      lejos del río; las cañerías llegaron a las viviendas obreras; y en 1970 el
      río Mill superaba en cuatro veces el límite legal para poder nadar.

      La calidad del agua ha mejorado mucho desde que se fue la industria. Aun
      así cae bruscamente después de la lluvia, cuando llega al río la
      escorrentía de calles y jardines y el desborde de alcantarillas viejas, y
      los niveles de bacterias siguen altos durante días.

