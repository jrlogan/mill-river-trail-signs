          Nobody should swim here after rain. Runoff carries road grit, lawn
          chemicals and overflow into the river, and bacteria counts spike for
          days afterwards.
        es: >-
          Nadie debería nadar aquí después de la lluvia. La escorrentía arrastra
          al río la suciedad de las calles, los químicos de los jardines y los
          desbordes, y los niveles de bacterias se disparan durante días.

web:
  subtitle:
    en: Before plumbing reached the tenements, washing was a public question — and the river was the answer
    es: Antes de que las cañerías llegaran a las viviendas obreras, lavarse era una cuestión pública, y el río era la respuesta

  body:
    en: |
      It is easy to forget how recently a bath became a private thing. In the New
      Haven of the 1880s a tenement flat had no tub, no hot water and often no
      water at all above the ground floor. Washing meant a basin, a kettle and a
      good deal of carrying — or it meant the river.

      ## The bathing city

      Through the summer the Mill River filled with people. Boys swam off the
      banks and the bridge abutments; families came down in the evening when the
      factories had stopped. This was ordinary in every American industrial city,
      and so was the fact that the water they were swimming in carried the
      discharge of every works upstream.

      It was also, by the standards of the time, a public order problem. Boys
      swimming in a city river were visible from the street, and the argument
      about what to do with them ran alongside the argument about hygiene.

      ## Why cities started building baths

      From the 1880s a new argument spread through American cities: that
      cleanliness was not a moral failing of the poor but a service a city owed
      its residents, and that a city which gave people nowhere to wash had no
      standing to blame them for the diseases that followed.

      It was a public health argument, and it was also a housing argument. The
      tenement was the problem; the bath house was the patch. New York, Boston,
      Chicago and Philadelphia all built free public baths on this reasoning, and
      the movement produced a recognisable building type: plain, functional,
      separated by sex, run to a timetable, and free.

      There were two kinds. The **river bath** was a floating or bankside
      structure — changing rooms, a walkway, an enclosure in the water, an
      attendant — cheap to build and dependent on the river being clean enough to
      swim in. The **indoor bath** came later, with piped water and showers, and
      was what eventually replaced it.

      ## New Haven's

      New Haven had the same debate, and it ran through the city council. The
      Morning Journal and Courier reported it, and those reports survive.

      On 25 May 1880, under the heading "The Bath Houses," the paper recorded
      that the bath house committee had decided a deep water tank at the Beach
      Street bath house was impracticable that season: to build one they would
      have to *"move the present bath house further out into the stream and then
      fill in Beach street out to it,"* and neither the appropriation nor the
      lateness of the season allowed it. A deep water tank at the West bridge
      bath house was still under consideration. The report ends: *"It is thought
      that both bath houses will be opened to the public on the first of June."*

      So by 1880 New Haven had two municipal bath houses, a standing committee
      managing them, an annual appropriation, and an opening day.

      ## The Mill River bath

      The following autumn the committee reported on the season of 1881. It
      recommended that the Beach Street bath house be removed to Neck Bridge —
      the old crossing at State Street — and made a floating tank. And it
      recommended *"that a floating bath be built on the east side of Chapel
      street bridge on Mill river, or at such point thereabouts as will be found
      most suitable."*

      That is the Mill River bath house, in the city's own words: a floating
      bath, on this river, proposed in the autumn of 1881.

      There were more than two. The council record turns up bath houses and bath
      house proposals at **Beach Street**, at the **West bridge** on the West
      River, at the **foot of English Street** in Fair Haven — remonstrated
      against by the neighbours and referred back to committee for three years
      running — at **the Cedars**, and by 1892 at the foot of **Blatchley Avenue**
      and the south end of **Hamilton Street**. By April 1889 the council was
      handling petitions for a "keeper of bath house on Mill river" and a keeper
      "on Beach street" as two separate posts.

      ## The job

      Here is the part nobody expects.

      The keeper of a bath house was not hired by a foreman. He was **elected**,
      by the Court of Common Council, by ballot, with tellers appointed to count.

      On **2 May 1882** Alderman O'Keefe moved to proceed to an election for
      Beach Street bath house keeper. Aldermen Mix and Tiesing were appointed
      tellers. Whole number of votes, 20: **Timothy Crowley 18, Walter Mitchell
      2.** Alderman Benton then moved to elect a keeper for the West bridge:
      **Daniel Lovejoy 12, Patrick McDermott 6, Bernard Oberkehr 2.** That
      clipping is on this sign.

      A year later, on **2 May 1883**, the West bridge went to **ten consecutive
      ballots**, deadlocked four to four between Owen Kelly and Patrick
      McDermott, and had to be reported back to the council unresolved.

      In **May 1887** the thing turned nasty. Members of the committee received
      **anonymous letters**, described in the paper as "disgraceful in the
      extreme," intended to put the candidate Reynolds in an unpleasant light.
      The aldermen appointed him anyway; the council voted to recommit. The
      letter-writer was never discovered.

      The pay was **$2.50 a day**. In June 1881 the committee met to reconsider
      even that, because the whole appropriation was **$500** and at that rate it
      would be exhausted before the hot season closed.

      Petitions to be made keeper run through the minutes for a decade: Lovejoy,
      Crowley, Michael Keys, Stephen Blakeslee, Edward Ward, James Noonan,
      Bernard Oberker, William Cummings, James Tiernan, Peter Sweeney, L. F.
      Cone. It was patronage, and it was a job, and in a city of tenements a
      steady summer wage was worth writing a letter to an alderman for.

      ## The keepers were the lifeguards

      Which is the other half of it, and the reason the job mattered.

      In **May 1883** a boy playing in a lumber yard near the Grand Street bridge
      fell in and was found drowned by **Timothy Crowley, the bath house keeper**.
      In **July 1886** another boy went into the Mill River — slipped, or was
      pushed by playmates — and Crowley recovered his body with grappling hooks
      half an hour later. A doctor worked over him for an hour with a battery.
      He did not come back.

      In **August 1882** two sons of Margaret English, a widow of Wallace Street,
      drowned in the Mill River near the Beach Street bath house. A neighbour
      looking out of a window on Mill River Street saw clothes on the bank and
      sent her daughter down to see whether anyone was in the water.

      In **March 1889** the paper described a "well known Mill river bath house
      keeper" who "has probably saved about fifteen lives during his services as
      bath house keeper."

      Fifteen. For $2.50 a day, on a contested ballot.

      ## What we still do not know

      Whether the floating bath at Chapel Street was ever built. How long any of
      them lasted. And whether they were free — the reports read as though they
      were, and the keepers were paid from a city appropriation rather than out
      of takings, but in **October 1892** the committee was still advertising a
      meeting at which "the matter of establishing **free** public bath houses
      will be considered," so something was changing.

      The 1888 city map shows a building at the corner of Mill River Street and
      Beach Street, which is the picture on this sign. Whether that is the bath
      house, or the site it was moved from, is not yet settled.

      **If you know something about these buildings, the project would like to
      hear it.**

      ## The contradiction

      What the city could not do was make the water clean. The same decades that
      produced the bath house produced the factories whose outfalls ran into the
      river, and the argument about which mattered more went on for close to a
      century. Public baths eventually moved indoors and away from the river,
      plumbing reached the tenements, and by 1970 the Mill River tested at four
      times the legal limit for swimming.

      ## The river was legally allowed to be dirty

      This is the part people find hardest to believe, and it is true.

      For most of the twentieth century American water law did not set one
      standard for all rivers. It **classified** them by the use they were meant
      to serve, and then applied the standard for that class. A river assigned a
      high class had to be clean enough to swim in and take shellfish from. A
      river assigned a low class did not. The dissolved oxygen minimum was a
      different number. The bacteria limit was a different number. Being dirty
      was not a violation if you were dirty in the class you had been given.

      In April 1971 the federal government held a conference in New Haven on the
      pollution of Long Island Sound and its tributaries. The transcript lists
      Connecticut's classes and what each was for. Class SA meant all sea water
      uses, including shellfish for eating and bathing. Class SB meant bathing
      and shellfish after purification.

      **The Mill River was Class SC** — *"suitable fish, shellfish and wildlife
      habitat; suitable for recreational boating and industrial cooling."*

      Read that again. Boating and industrial cooling. **Not bathing.** On the
      river where the city had run a bath house.

      Below SC there was one more step down, and the rule attached to it is
      revealing: Class D "will be assigned only where a higher water use Class
      cannot be attained after all appropriate waste treatment methods are
      utilized." A class for water that had been given up on.

      How far this went is written into federal law by its absence. The rules
      that govern water quality standards today contain this sentence:

      > **In no case shall a State adopt waste transport or waste assimilation as
      > a designated use for any waters of the United States.**

      Nobody writes a rule like that unless it was being done.

      ## What a witness said in 1971

      The same New Haven conference heard this, about this river:

      > The New Haven Harbor is the terminal for three rivers: the West River,
      > the Mill River and the Quinnipiac River. All of these streams are
      > polluted in varying degrees and **the Mill River is the classic example
      > of our stream pollution problem. Its putrid grey green waters can only be
      > appreciated by sight and smell.** … The law is being compromised for
      > jobs and **our public waters have become their private sewer**.

      Ninety years after the bath house committee argued about where to put a
      floating tank, the river it argued over was being described to a federal
      hearing as somebody's private sewer.

      It is not that any more. That took the Connecticut Clean Water Act of 1967,
      the federal Clean Water Act of 1972, and fifty years of work — and the
      switch from asking what a river was *for* to asking what came out of the
      pipe.

      Water quality here has improved a great deal since the industry left. It
      still drops sharply after rain, when runoff from streets and lawns and
      overflow from ageing sewers reaches the river, and bacteria counts stay
      high for days afterwards. The bathing city is not quite as far in the past
      as it looks.

    es: |
      Es fácil olvidar lo reciente que es que bañarse sea algo privado. En el New
      Haven de la década de 1880 un piso obrero no tenía bañera, ni agua
      caliente, y a menudo no tenía agua por encima de la planta baja. Lavarse
      significaba una palangana, una olla y mucho acarreo, o significaba el río.

      ## La ciudad que se bañaba

      Durante el verano el río Mill se llenaba de gente. Los muchachos se
      lanzaban desde las orillas y los estribos de los puentes; las familias
      bajaban al atardecer, cuando paraban las fábricas. Era lo normal en
      cualquier ciudad industrial estadounidense, y también lo era que el agua en
      la que se bañaban arrastrara los vertidos de todas las fábricas de aguas
      arriba.

      Era además, para la época, un problema de orden público. Los muchachos
      bañándose en el río de la ciudad se veían desde la calle, y la discusión
      sobre qué hacer con ellos corrió en paralelo a la discusión sobre higiene.

      ## Por qué las ciudades empezaron a construir baños

      A partir de 1880 se extendió por las ciudades estadounidenses un argumento
      nuevo: que la limpieza no era un defecto moral de los pobres, sino un
      servicio que la ciudad debía a sus habitantes, y que una ciudad que no daba
      dónde lavarse no tenía autoridad para culpar a nadie de las enfermedades
      que venían después.

      Era un argumento de salud pública y también de vivienda. El problema era la
      vivienda obrera; el baño público era el parche. Nueva York, Boston, Chicago
      y Filadelfia construyeron baños gratuitos con ese razonamiento, y el
      movimiento produjo un tipo de edificio reconocible: sencillo, funcional,
      separado por sexos, con horario y gratuito.

      Había dos clases. El **baño de río** era una estructura flotante o de
      orilla — vestuarios, una pasarela, un recinto en el agua, un encargado —,
      barata de construir y dependiente de que el río estuviera lo bastante
      limpio. El **baño cubierto** llegó después, con agua corriente y duchas, y
      fue lo que acabó sustituyéndolo.

      ## El de New Haven

      New Haven tuvo el mismo debate, y se libró en el ayuntamiento. El Morning
      Journal and Courier lo recogió, y esos informes se conservan.

      El 25 de mayo de 1880, bajo el título "The Bath Houses", el periódico
      registró que el comité de casetas de baño había decidido que un tanque de
      agua profunda en la caseta de Beach Street no era viable esa temporada:
      para construirlo habría que *"trasladar la caseta actual más adentro de la
      corriente y luego rellenar Beach Street hasta ella"*, y ni el presupuesto
      ni lo avanzado de la temporada lo permitían. Un tanque profundo en la
      caseta del West bridge seguía en estudio. El informe termina: *"Se cree que
      ambas casetas de baño abrirán al público el primero de junio"*.

      Así que en 1880 New Haven tenía dos casetas de baño municipales, un comité
      permanente que las gestionaba, una partida anual y un día de apertura.

      ## El baño del río Mill

      El otoño siguiente el comité informó sobre la temporada de 1881.
      Recomendaba trasladar la caseta de Beach Street a Neck Bridge — el viejo
      cruce de State Street — y convertirla en un tanque flotante. Y recomendaba
      *"que se construya un baño flotante en el lado este del puente de Chapel
      Street sobre el río Mill, o en el punto cercano que resulte más adecuado"*.

      Ese es el baño del río Mill, en palabras de la propia ciudad: un baño
      flotante, en este río, propuesto en el otoño de 1881.

      ## Lo que aún no sabemos

      Si el baño flotante de Chapel Street llegó a construirse. Cuánto duró
      ninguno de ellos. Y si eran gratuitos: los informes suenan a que sí, y a
      los encargados se les pagaba de una partida municipal y no de la
      recaudación, pero en **octubre de 1892** el comité seguía anunciando una
      reunión en la que se estudiaría "el asunto de establecer casetas de baños
      públicas **gratuitas**", así que algo estaba cambiando.

      El mapa municipal de 1888 muestra un edificio en la esquina de Mill River
      Street con Beach Street, que es la imagen de este letrero. Si ese edificio
      es la caseta de baños, o el solar del que se trasladó, todavía no está
      resuelto.

      **Si usted sabe algo de estos edificios, al proyecto le gustaría oírlo.**

      ## La contradicción

      Lo que la ciudad no podía hacer era limpiar el agua. Las mismas décadas que
      produjeron la caseta de baños produjeron las fábricas cuyos desagües iban al
      río, y la discusión sobre qué importaba más duró casi un siglo. Los baños
      públicos acabaron trasladándose a locales cerrados y lejos del río, las
      cañerías llegaron a las viviendas obreras, y en 1970 el río Mill superaba
      en cuatro veces el límite legal para poder nadar.

      ## El río tenía permiso legal para estar sucio

      Esta es la parte que más cuesta creer, y es cierta.

      Durante casi todo el siglo XX el derecho de aguas estadounidense no fijaba
      un único estándar para todos los ríos. Los **clasificaba** según el uso al
      que debían servir y luego les aplicaba el estándar de esa clase. Un río de
      clase alta tenía que estar lo bastante limpio para bañarse y recoger
      marisco. Uno de clase baja, no. El mínimo de oxígeno disuelto era otra
      cifra. El límite de bacterias era otra cifra. Estar sucio no era una
      infracción si se estaba sucio dentro de la clase asignada.

      En abril de 1971 el gobierno federal celebró en New Haven una conferencia
      sobre la contaminación de Long Island Sound y sus afluentes. La
      transcripción recoge las clases de Connecticut y para qué servía cada una.
      La clase SA significaba todos los usos marinos, incluidos el marisqueo para
      consumo y el baño. La clase SB, baño y marisco tras depuración.

      **El río Mill era clase SC**: *"hábitat adecuado para peces, marisco y
      fauna; adecuado para la navegación recreativa y la refrigeración
      industrial"*.

      Léalo otra vez. Navegación y refrigeración industrial. **No baño.** En el
      río donde la ciudad había tenido una caseta de baños.

      Por debajo de SC quedaba un escalón más, y la regla que lo acompañaba lo
      dice todo: la clase D "se asignará solo cuando no pueda alcanzarse una
      clase de uso superior tras aplicar todos los métodos de tratamiento
      adecuados". Una clase para el agua a la que se había renunciado.

      Hasta dónde llegó esto está escrito en la ley federal por omisión. Las
      normas que hoy rigen los estándares de calidad del agua contienen esta
      frase:

      > **En ningún caso adoptará un estado el transporte de residuos o la
      > asimilación de residuos como uso designado de aguas de los Estados
      > Unidos.**

      Nadie escribe una regla así si no se estaba haciendo.

      ## Lo que declaró un testigo en 1971

      Esa misma conferencia de New Haven escuchó esto, sobre este río:

      > El puerto de New Haven es el desagüe de tres ríos: el West River, el Mill
      > River y el Quinnipiac. Todos están contaminados en distinto grado y **el
      > Mill River es el ejemplo clásico de nuestro problema de contaminación
      > fluvial. Sus aguas pútridas de color gris verdoso solo pueden apreciarse
      > por la vista y el olfato.** … Se está transigiendo con la ley por los
      > puestos de trabajo, y **nuestras aguas públicas se han convertido en su
      > alcantarilla privada**.

      Noventa años después de que el comité de casetas de baño discutiera dónde
      poner un tanque flotante, el río que discutían era descrito en una
      audiencia federal como la alcantarilla privada de alguien.

      Ya no lo es. Hicieron falta la Ley de Aguas Limpias de Connecticut de 1967,
      la Ley federal de Aguas Limpias de 1972 y cincuenta años de trabajo, y el
      cambio de preguntar para qué *servía* un río a preguntar qué salía por la
      tubería.

      La calidad del agua ha mejorado mucho desde que se fue la industria. Aun
      así cae bruscamente después de la lluvia, cuando llega al río la escorrentía
      de calles y jardines y el desborde de alcantarillas viejas, y los niveles de
      bacterias siguen altos durante días. La ciudad que se bañaba no queda tan
      atrás como parece.

