title:
  en: Where the City Bathed
  es: Donde la Ciudad se Bañaba

sign:
  lede:
    en: >-
      For most of the 19th century a bath was a luxury. New Haven's tenements
      were built without plumbing, and families who wanted to wash carried water
      or came to the river. So the city ran bath houses — one of them here, at
      Beach Street on the Mill — and the man who minded it was not hired. He was
      elected, by ballot, in the Court of Common Council, and men campaigned for
      the job.
    es: >-
      Durante casi todo el siglo XIX bañarse era un lujo. Las viviendas obreras
      de New Haven se construyeron sin cañerías, y las familias que querían
      lavarse acarreaban agua o venían al río. Por eso la ciudad tenía casetas de
      baño — una de ellas aquí, en Beach Street sobre el Mill — y al encargado no
      se le contrataba. Se le elegía, por votación, en el Ayuntamiento, y había
      hombres que hacían campaña por el puesto.

  section:
    heading:
      en: The Most Contested Job in New Haven
      es: El puesto más disputado de New Haven
    # The council record is now the spine of this sign. Every figure below is
    # from the Morning Journal and Courier, sourced in docs/DECISIONS.md.
    body:
      en: >-
        A bath house was a plain thing — a walkway, changing rooms, an enclosure
        in the water and a keeper. The keeper was paid $2.50 a day out of an
        appropriation of $500, which in June 1881 the committee had to reconsider
        because it would not last the hot season. And yet men queued to be
        appointed. The council balloted for it, with tellers counting; in May
        1883 the West bridge election deadlocked four to four through ten
        straight ballots and had to be sent back. In May 1887 committee members
        received anonymous letters, "disgraceful in the extreme," smearing a
        candidate. The writer was never found. It was a job minding people in
        the water, and it was fought over like a seat.
      es: >-
        Una caseta de baños era algo sencillo: una pasarela, vestuarios, un
        recinto en el agua y un encargado. Al encargado se le pagaban 2,50
        dólares al día con cargo a una partida de 500, que en junio de 1881 el
        comité tuvo que revisar porque no llegaría al final del calor. Y aun así
        había cola para el puesto. El Ayuntamiento lo votaba, con escrutadores
        contando; en mayo de 1883 la elección del West bridge quedó empatada a
        cuatro durante diez votaciones seguidas y hubo que devolverla. En mayo de
        1887 los miembros del comité recibieron cartas anónimas, "vergonzosas en
        grado extremo", contra un candidato. Nunca se supo quién las escribió.
        Era un empleo cuidando gente en el agua, y se peleaba como un escaño.

