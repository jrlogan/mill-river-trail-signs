title:
  en: Where the City Bathed
  es: Donde la Ciudad se Bañaba

sign:
  lede:
    en: >-
      For most of the 19th century a bath was a luxury. New Haven's tenements
      were built without plumbing, and families who wanted to wash carried water
      or went to the river. So the city ran bath houses. By 1880 there were two,
      at Beach Street and the West bridge, managed by a standing city committee
      and opened to the public each year on the first of June.
    es: >-
      Durante casi todo el siglo XIX bañarse era un lujo. Las viviendas obreras
      de New Haven se construyeron sin cañerías, y las familias que querían
      lavarse acarreaban agua o iban al río. Por eso la ciudad tenía casetas de
      baño. Hacia 1880 había dos, en Beach Street y en el West bridge,
      gestionadas por un comité municipal permanente y abiertas al público cada
      año el primero de junio.

  section:
    heading:
      en: A Floating Bath on the Mill
      es: Un baño flotante en el Mill
    # REVIEW: the national bath movement and the absence of plumbing in New
    # Haven tenements are well documented. The specific opening date, operator
    # and exact site of the Mill River bath house still need confirming from the
    # 1880-81 New Haven newspaper coverage in the research notes.
    body:
      en: >-
        In October 1881 the committee on bath houses made its report for the
        season. It recommended that the Beach Street bath house be removed to
        Neck Bridge and made a floating tank, and "that a floating bath be built
        on the east side of Chapel street bridge on Mill river, or at such point
        thereabouts as will be found most suitable." A bath house was a plain
        thing — a walkway, changing rooms, an enclosure in the water and an
        attendant — free to use and separated by sex and by hour. It also put
        the city in the odd position of inviting people to bathe in a river it
        was steadily poisoning.
      es: >-
        En octubre de 1881 el comité de casetas de baño presentó su informe de
        temporada. Recomendaba trasladar la caseta de Beach Street a Neck Bridge
        y convertirla en un tanque flotante, y "que se construya un baño flotante
        en el lado este del puente de Chapel Street sobre el río Mill, o en el
        punto cercano que resulte más adecuado". Una caseta de baños era algo
        sencillo: una pasarela, vestuarios, un recinto en el agua y un encargado,
        de uso gratuito y separado por sexo y por horario. También dejaba a la
        ciudad en la rara posición de invitar a bañarse en un río que ella misma
        envenenaba.

