title:
  en: Where the City Bathed
  es: Donde la Ciudad se Bañaba

sign:
  lede:
    en: >-
      For most of the 19th century a bath was a luxury. New Haven's tenements
      were built without plumbing, and families who wanted to wash carried water
      or went to the river. So the river is where the city swam — boys off the
      banks all summer, in water that was also carrying the discharge of every
      mill upstream.
    es: >-
      Durante casi todo el siglo XIX bañarse era un lujo. Las viviendas obreras
      de New Haven se construyeron sin cañerías, y las familias que querían
      lavarse acarreaban agua o iban al río. Así que la ciudad se bañaba en el
      río: los muchachos se tiraban desde la orilla todo el verano, en un agua
      que además arrastraba los vertidos de todas las fábricas de aguas arriba.

  section:
    heading:
      en: A Public Bath on the River
      es: Un baño público en el río
    # REVIEW: the national bath movement and the absence of plumbing in New
    # Haven tenements are well documented. The specific opening date, operator
    # and exact site of the Mill River bath house still need confirming from the
    # 1880-81 New Haven newspaper coverage in the research notes.
    body:
      en: >-
        By the 1880s cities across the country were opening free public baths,
        arguing that washing was a matter of public health rather than private
        virtue, and that a city which gave its people nowhere to wash could not
        then blame them for disease. New Haven's newspapers carried the argument
        through 1880 and 1881, and bath houses were built at the water's edge —
        simple wooden structures with changing rooms, floats and an attendant.
        They were free, they were crowded, and they were segregated by sex and
        by hour. They also put the city in the strange position of encouraging
        people to bathe in a river it was steadily poisoning.
      es: >-
        Hacia 1880 ciudades de todo el país abrían baños públicos gratuitos, con
        el argumento de que lavarse era una cuestión de salud pública y no de
        virtud privada, y de que una ciudad que no daba a su gente dónde lavarse
        no podía luego culparla de la enfermedad. Los periódicos de New Haven
        recogieron la discusión en 1880 y 1881, y se construyeron casetas de
        baño a la orilla del agua: estructuras sencillas de madera con
        vestuarios, plataformas y un encargado. Eran gratuitas, estaban llenas y
        se separaban por sexo y por horario. También dejaron a la ciudad en la
        rara posición de animar a la gente a bañarse en un río que ella misma
        envenenaba.

