web:
  subtitle:
    en: Before plumbing reached the tenements, washing was a public question — and the river was the answer
    es: Antes de que las cañerías llegaran a las viviendas obreras, lavarse era una cuestión pública, y el río era la respuesta

  body:
    en: |
      It is easy to forget how recently a bath became a private thing. In the New
      Haven of the 1880s a tenement flat had no tub, no hot water and often no
      water at all above the ground floor. Washing meant a basin, a kettle and a
      good deal of carrying — or it meant the river.

      ## The bathing city

      Through the summer the Mill River filled with people. Boys swam off the
      banks and the bridge abutments; families came down in the evening when the
      factories had stopped. This was ordinary in every American industrial city,
      and so was the fact that the water they were swimming in carried the
      discharge of every works upstream.

      It was also, by the standards of the time, a public order problem. Boys
      swimming in a city river were visible from the street, and the argument
      about what to do with them ran alongside the argument about hygiene.

      ## Why cities started building baths

      From the 1880s a new argument spread through American cities: that
      cleanliness was not a moral failing of the poor but a service a city owed
      its residents, and that a city which gave people nowhere to wash had no
      standing to blame them for the diseases that followed.

      It was a public health argument, and it was also a housing argument. The
      tenement was the problem; the bath house was the patch. New York, Boston,
      Chicago and Philadelphia all built free public baths on this reasoning, and
      the movement produced a recognisable building type: plain, functional,
      separated by sex, run to a timetable, and free.

      There were two kinds. The **river bath** was a floating or bankside
      structure — changing rooms, a walkway, an enclosure in the water, an
      attendant — cheap to build and dependent on the river being clean enough to
      swim in. The **indoor bath** came later, with piped water and showers, and
      was what eventually replaced it.

      ## New Haven's

      New Haven had the same debate and its newspapers ran it. The Morning
      Journal and Courier carried the argument in May 1880 and again in October
      1881, in the years when the city was deciding what to provide and where.

      A bath house stood at the water's edge here, at the corner of Mill River
      Street and Beach Street — the 1888 city map shows the building on its plot,
      which is the picture on this sign.

      ## What we do not yet know

      This is the thinnest-documented sign on the trail, and it is worth being
      straight about it. The date it opened, who ran it, how long it lasted, what
      it cost the city and whether it was free are all still open questions.

      The documents that would answer them exist and are listed below: two
      New Haven newspaper pages from 1880 and 1881, the 1888 map, and the city
      records that mention a Beach Street bath house. They are scans, not
      searchable text, so somebody has to sit and read them.

      **If you know something about this building, the project would like to hear
      it.** Sign 5 will not go to print until its specifics are nailed down.

      ## The contradiction

      What the city could not do was make the water clean. The same decades that
      produced the bath house produced the factories whose outfalls ran into the
      river, and the argument about which mattered more went on for close to a
      century. Public baths eventually moved indoors and away from the river,
      plumbing reached the tenements, and by 1970 the Mill River tested at four
      times the legal limit for swimming.

      Water quality here has improved a great deal since the industry left. It
      still drops sharply after rain, when runoff from streets and lawns and
      overflow from ageing sewers reaches the river, and bacteria counts stay
      high for days afterwards. The bathing city is not quite as far in the past
      as it looks.

    es: |
      Es fácil olvidar lo reciente que es que bañarse sea algo privado. En el New
      Haven de la década de 1880 un piso obrero no tenía bañera, ni agua
      caliente, y a menudo no tenía agua por encima de la planta baja. Lavarse
      significaba una palangana, una olla y mucho acarreo, o significaba el río.

      ## La ciudad que se bañaba

      Durante el verano el río Mill se llenaba de gente. Los muchachos se
      lanzaban desde las orillas y los estribos de los puentes; las familias
      bajaban al atardecer, cuando paraban las fábricas. Era lo normal en
      cualquier ciudad industrial estadounidense, y también lo era que el agua en
      la que se bañaban arrastrara los vertidos de todas las fábricas de aguas
      arriba.

      Era además, para la época, un problema de orden público. Los muchachos
      bañándose en el río de la ciudad se veían desde la calle, y la discusión
      sobre qué hacer con ellos corrió en paralelo a la discusión sobre higiene.

      ## Por qué las ciudades empezaron a construir baños

      A partir de 1880 se extendió por las ciudades estadounidenses un argumento
      nuevo: que la limpieza no era un defecto moral de los pobres, sino un
      servicio que la ciudad debía a sus habitantes, y que una ciudad que no daba
      dónde lavarse no tenía autoridad para culpar a nadie de las enfermedades
      que venían después.

      Era un argumento de salud pública y también de vivienda. El problema era la
      vivienda obrera; el baño público era el parche. Nueva York, Boston, Chicago
      y Filadelfia construyeron baños gratuitos con ese razonamiento, y el
      movimiento produjo un tipo de edificio reconocible: sencillo, funcional,
      separado por sexos, con horario y gratuito.

      Había dos clases. El **baño de río** era una estructura flotante o de
      orilla — vestuarios, una pasarela, un recinto en el agua, un encargado —,
      barata de construir y dependiente de que el río estuviera lo bastante
      limpio. El **baño cubierto** llegó después, con agua corriente y duchas, y
      fue lo que acabó sustituyéndolo.

      ## El de New Haven

      New Haven tuvo el mismo debate y sus periódicos lo recogieron. El Morning
      Journal and Courier lo trató en mayo de 1880 y otra vez en octubre de 1881,
      en los años en que la ciudad decidía qué ofrecer y dónde.

      Aquí, a la orilla del agua, hubo una caseta de baños, en la esquina de Mill
      River Street con Beach Street: el mapa municipal de 1888 muestra el
      edificio en su parcela, y esa es la imagen de este letrero.

      ## Lo que todavía no sabemos

      Este es el letrero peor documentado del sendero, y conviene decirlo con
      claridad. La fecha de apertura, quién lo gestionaba, cuánto duró, cuánto le
      costó a la ciudad y si era gratuito siguen siendo preguntas abiertas.

      Los documentos que las responderían existen y están abajo: dos páginas de
      periódico de New Haven de 1880 y 1881, el mapa de 1888, y los registros
      municipales que mencionan una caseta de baños en Beach Street. Son
      escaneos, no texto buscable, así que alguien tiene que sentarse a leerlos.

      **Si usted sabe algo de este edificio, al proyecto le gustaría oírlo.** El
      letrero 5 no se imprimirá hasta que sus datos concretos estén fijados.

      ## La contradicción

      Lo que la ciudad no podía hacer era limpiar el agua. Las mismas décadas que
      produjeron la caseta de baños produjeron las fábricas cuyos desagües iban al
      río, y la discusión sobre qué importaba más duró casi un siglo. Los baños
      públicos acabaron trasladándose a locales cerrados y lejos del río, las
      cañerías llegaron a las viviendas obreras, y en 1970 el río Mill superaba
      en cuatro veces el límite legal para poder nadar.

      La calidad del agua ha mejorado mucho desde que se fue la industria. Aun
      así cae bruscamente después de la lluvia, cuando llega al río la escorrentía
      de calles y jardines y el desborde de alcantarillas viejas, y los niveles de
      bacterias siguen altos durante días. La ciudad que se bañaba no queda tan
      atrás como parece.

