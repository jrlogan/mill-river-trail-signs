title:
  en: The Sign Not Yet Written
  es: El Letrero Aún No Escrito

sign:
  lede:
    en: >-
      There are thirteen other signs on this trail. They cover a dam, a
      submarine, a bath house, an oyster town, a highway that was never built
      and a man who moved a wharf. Between them they describe about four hundred
      years. People lived on this river for thousands of years before any of
      that, and this project has not yet earned the right to describe it. So
      this panel is empty on purpose, and it is an invitation.
    es: >-
      Hay otros trece letreros en este sendero. Hablan de una presa, un
      submarino, una caseta de baños, un pueblo ostrero, una autopista que nunca
      se construyó y un hombre que movió un muelle. Entre todos cubren unos
      cuatrocientos años. Hubo gente viviendo en este río miles de años antes de
      todo eso, y este proyecto todavía no se ha ganado el derecho a contarlo.
      Por eso este panel está vacío a propósito, y es una invitación.

  section:
    heading:
      en: Why It Is Blank
      es: Por qué está en blanco
    body:
      en: >-
        This is Quinnipiac territory. The river was fished, the meadows were
        burned and hunted, and the tidal flats were worked long before a mill
        was put across the water in 1642. That much the record supports. What it
        does not support is a stranger writing the rest of it from a library and
        a search engine — which is how most interpretive signs about Native
        history in this country got written, and why so many of them are wrong,
        past-tense, or both. And the obvious remedy — ask the tribe — is not
        simple here: the Quinnipiac hold neither federal nor state recognition,
        and Connecticut's five recognised tribes are other peoples. Getting this
        right means doing the work of finding out who should speak, and asking
        them properly. Until that happens this panel stays as it is.
      es: >-
        Este es territorio quinnipiac. Se pescaba en el río, se quemaban y se
        cazaban los prados y se trabajaban las llanuras de marea mucho antes de
        que en 1642 se atravesara el agua con un molino. Hasta ahí llega lo que
        el registro sostiene. Lo que no sostiene es que un forastero escriba el
        resto desde una biblioteca y un buscador, que es como se escribieron la
        mayoría de los letreros sobre historia indígena en este país, y por eso
        tantos están equivocados, en pasado, o las dos cosas. Y el remedio obvio
        — preguntar a la tribu — aquí no es sencillo: los quinnipiac no tienen
        reconocimiento federal ni estatal, y las cinco tribus reconocidas de
        Connecticut son otros pueblos. Hacerlo bien exige averiguar quién debe
        hablar y preguntárselo como es debido. Hasta que eso ocurra, este panel
        se queda como está.

