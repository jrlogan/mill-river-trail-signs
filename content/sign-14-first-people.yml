# Sign 14: First People — PLACEHOLDER. Deliberately unwritten.
#
# This sign exists so that the gap is visible and answerable. Thirteen signs
# cover mills, factories, bridges, plans, a submarine and an oyster town, and
# the first several thousand years appear only as a subordinate clause in the
# project's own overview. A missing sign is easy to postpone. A sign that says
# it is missing is not.
#
# It must not be written from web sources. NOTE for whoever takes this on: the
# project notes name a "Quinnipiac Dawnland Council" as the body to consult. No
# such council appears to exist. There is no state- or federally recognised
# Quinnipiac nation; Connecticut recognises five tribes, none of them Quinnipiac.
# The group that carries the name in public — the Algonquian Confederacy of the
# Quinnipiac Tribal Council — is an unrecognised heritage nonprofit based in
# Indiana whose founder is a convicted rapist serving time in Texas and whose
# registered agent could not establish descent. Do not put that name on a sign.
# The real routes are in `sources` below. Until this is settled the text here is
# the invitation, not the content, and `status` stays `placeholder` so it cannot
# be mistaken for something ready to print.
#
# LOCATION IS PROVISIONAL. The coordinates below put it on the tidal reach below
# East Rock for the sake of the locator map. Where it actually belongs is one of
# the things to be decided by the people who write it.
