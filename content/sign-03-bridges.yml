title:
  en: Three Bridges North
  es: Tres Puentes al Norte

sign:

  lede:
    en: >-
      The land you are standing on was once marshland, mud and meadow, raised
      above the tide line with fill. The Mill River is a tidal stream, draining
      from the uplands of Cheshire south into Long Island Sound. The clay, silt
      and sand around you were once the floor of a shallow sea. Since English
      Puritans settled here in 1638, bridging this river has been how the city
      holds itself together.
    # The draft translation ended with a line of DeepL advertising sitting in
    # the body text. Rewritten.
    es: >-
      La tierra que pisa fue en su día marisma, lodo y pradera, elevada sobre la
      línea de marea con relleno. El río Mill es una corriente de marea que baja
      desde las tierras altas de Cheshire hacia el sur, hasta el estrecho de Long
      Island. La arcilla, el limo y la arena que le rodean fueron el fondo de un
      mar poco profundo. Desde que los puritanos ingleses se asentaron aquí en
      1638, tender puentes sobre este río ha sido la forma de mantener unida la
      ciudad.

  section:
    heading:
      en: Bridging the Mill River
      es: Cruzar el río Mill
    body:
      en: >-
        The first crossing, Neck Bridge, went up in 1641 along what is now State
        Street. Look north from here and you will see three more. Farthest is the
        Humphrey Street Bridge, built in 1952 to replace a 1909 crossing that
        linked State Street to Fair Haven. The middle bridge carries trains, and
        has since 1839, when the New Haven and Hartford Railroad — the city's
        first rail line — laid red sandstone across the river here; its two
        concrete arches went up in 1906-07. Nearest is an abandoned line, part of
        the New Haven, New London and Stonington Railroad of 1852, which ran east
        through Fair Haven and along the shore.
      es: >-
        El primer cruce, el Neck Bridge, se levantó en 1641 en lo que hoy es
        State Street. Mire hacia el norte y verá tres más. El más lejano es el
        puente de Humphrey Street, construido en 1952 para sustituir un cruce de
        1909 que unía State Street con Fair Haven. El puente del medio lleva
        trenes, y lo hace desde 1839, cuando el ferrocarril de New Haven y
        Hartford — la primera línea de la ciudad — tendió piedra arenisca roja
        sobre el río; sus dos arcos de hormigón se levantaron en 1906-07. El más
        cercano es una línea abandonada del ferrocarril de New Haven, New London
        y Stonington, de 1852, que iba al este por Fair Haven y la costa.

