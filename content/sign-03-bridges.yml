web:
  subtitle:
    en: Paper on this river before the rails and after them, and the private track that ran in through a factory wall
    es: Papel en este río antes de los raíles y después, y la vía privada que entraba por la pared de una fábrica

  body:
    en: |
      A river is an obstacle before it is anything else. For two centuries the
      history of the Mill River in New Haven is mostly the history of getting
      across it — and then, once the railroad arrived, of what got built along it
      because the crossing was there.

      ## A tidal stream

      The Mill River rises in the uplands of Cheshire and runs about seventeen
      miles south through Hamden and New Haven into Long Island Sound. The lower
      river, the stretch you are standing on, is tidal: salt water pushes up it
      twice a day as far as the tide gate.

      The ground here is clay, silt and sand — the floor of a shallow sea that
      sat between glacial periods. It is soft, it floods, and before it was
      filled it was marsh. None of that made it good to build on. All of it made
      it cheap.

      ## Neck Bridge, 1641

      English Puritans settled New Haven in 1638. Three years later they built
      the first bridge over the Mill River, called Neck Bridge, along what is now
      State Street. For most of two centuries that was the crossing — anyone
      going to Fair Haven went up to State Street and over.

      In 1819 Eli Barnes helped pay for a bridge at Grand Avenue, privately,
      cutting the trip short. The city spent the next hundred years rebuilding
      both.

      ## The railroad, 1839

      The New Haven and Hartford Railroad opened in 1839, the city's first rail
      line, and carried its track over the Mill River on a bridge of red
      sandstone. That single decision did more to shape this riverbank than any
      other.

      Before the railroad, industry on the Mill River meant water power: a
      gristmill, a carriage factory, a mill making wheels and axles, a paper
      mill, and from 1798 Eli Whitney's armory upstream. Those works had to sit
      where the current was. After the railroad, a factory only needed to sit
      where the freight was — and a site with a rail line on one side and a
      navigable tidal river on the other, minutes from a dense supply of labour,
      was as good as land got.

      So the marshes were filled and the riverbank was taken. By the early 1900s
      the lower Mill River was lined with works making rubber boots, clocks, auto
      parts, cardboard, steam boilers, brass and wire.

      The sandstone bridge was replaced in 1906-07 by the two concrete arches
      standing today. The Engineering and Building Record published the drawings
      in November 1908.

      ## Three bridges, and one that stopped

      Looking north from here you can see the sequence. The nearest bridge
      carried the New Haven, New London and Stonington Railroad, begun in 1852,
      east through Fair Haven and along the Connecticut shoreline; that line is
      abandoned now. The middle bridge is the 1906-07 arch, still carrying
      trains. The farthest is the Humphrey Street Bridge, built in 1952 to
      replace a 1909 crossing between State Street and Fair Haven.

      ## The rails that went indoors

      A main line is the part you notice. It is not the part that made this an
      industrial river.

      What did that was the **private siding** — a spur thrown off the main line,
      across a yard, and in through the wall of a particular building, so that a
      boxcar could be loaded where the goods were made rather than carted to a
      station. Every serious works along this stretch had one or wanted one. It
      is why the factories sit where they sit: not near the river for the water,
      by the 1900s, but near the river because the rails were already there.

      The clearest surviving example is a few hundred yards upstream, and it is
      worth the walk.

      ## Paper, again

      Before the railway, one of the works on this river was a **paper mill**,
      turning by water like everything else. A century later paper came back, and
      this time it came by rail.

      The **National Folding Box Company** was assembled in New York in the early
      1890s out of a group of smaller carton makers. In 1905 it chose New Haven as
      its production centre and bought an entire block at James Street — for the
      barge landing, for the spurs alongside, and for a workforce living within
      walking distance in Fair Haven, Cedar Hill and Barnesville. The four-storey
      plant went up in 1914.

      By 1927 it was **the largest and most prestigious folding box company in the
      world.**

      That is easy to underrate, because a box is not a glamorous object. But the
      whole twentieth-century idea of a branded product — something you recognise
      on a shelf, sealed, printed, identical every time — depends on somebody
      making the container. National printed for **Budweiser**, for **Hershey's**,
      for **General Electric**, for the cigarette companies. And for Peter Paul:
      it made the boxes for **Mounds and Almond Joy**, having helped start the
      company in the first place, as an outside investment.

      A private siding ran off the main line, across the yard and in through the
      wall, so a boxcar could be filled where the boxes were made. **The largest
      folding box plant in the world was fed by a track off the railway whose
      bridge you are looking at.**

      ## And then the jacket

      Southern paperboard mills, sitting next to the timber, undercut New England
      on price. Federal Paper Board bought National in 1953 and kept the plant
      going until 1974, when it closed.

      In 1976 a coach from Hamden Hall named **David Beckerman** moved his young
      sportswear company into the empty box factory and, that same year, took a
      licence from Major League Baseball. Before it, a replica team jacket was not
      really a product you could buy. Afterwards it was an industry. By the late
      1980s the satin jacket with the **S-and-star** on the sleeve was one of the
      most recognisable objects in American popular culture — and it was designed
      and shipped from a building on the Mill River.

      Starter went public in 1993, was winded by the 1994 baseball strike, and
      declared bankruptcy in 1999. The building still works: it houses ACES, the
      United Way of Greater New Haven and Workforce Alliance, and ACES bought it
      outright in May 2026.

      A daylight factory built for folding cardboard in 1914 is now full of people
      helping other people find work. That is a better ending than most New
      England mill buildings get.

      Look at the near bridge again with that in mind. It is not a bridge that
      took people anywhere. It is a bridge that took freight to a door.

      ## A note on what is standing

      **The abandoned crossing has been coming apart for years, and the project
      records it as having recently come down into the river.** If you are
      reading this on the trail and it looks different from what the sign shows,
      the sign is older than the river.

      ## What it cost

      This was before the Clean Water Act, and the river was treated as part of
      the plant. Owners put into it whatever they wanted to be rid of. The
      discharge ran downstream into the oyster beds that ringed the industrial
      area, and the oystermen and the factories fought over it for decades — an
      argument the factories won.

      By 1970 the Mill River tested at four times the legal limit for swimming,
      and there was serious talk of paving it over.

      The industry left instead. The river has been recovering since, and river
      herring still run up it each spring to spawn, the way they did before Neck
      Bridge.

    es: |
      Un río es un obstáculo antes que cualquier otra cosa. Durante dos siglos,
      la historia del río Mill en New Haven es sobre todo la historia de cómo
      cruzarlo, y después, una vez llegó el ferrocarril, de lo que se construyó a
      su orilla porque el cruce ya existía.

      ## Una corriente de marea

      El río Mill nace en las tierras altas de Cheshire y corre unas diecisiete
      millas hacia el sur, por Hamden y New Haven, hasta el estrecho de Long
      Island. El tramo bajo, donde usted está, es de marea: el agua salada sube
      dos veces al día hasta la compuerta.

      El terreno aquí es arcilla, limo y arena: el fondo de un mar poco profundo
      que existió entre periodos glaciares. Es blando, se inunda y, antes de
      rellenarse, era marisma. Nada de eso lo hacía bueno para construir. Todo
      eso lo hacía barato.

      ## Neck Bridge, 1641

      Los puritanos ingleses fundaron New Haven en 1638. Tres años después
      construyeron el primer puente sobre el río Mill, llamado Neck Bridge, en lo
      que hoy es State Street. Durante casi dos siglos ese fue el cruce: quien
      iba a Fair Haven subía hasta State Street y pasaba por allí.

      En 1819 Eli Barnes ayudó a pagar, de forma privada, un puente en Grand
      Avenue, y acortó el trayecto. La ciudad pasó el siglo siguiente
      reconstruyendo ambos.

      ## El ferrocarril, 1839

      El ferrocarril de New Haven y Hartford se abrió en 1839, la primera línea
      de la ciudad, y cruzó el río Mill sobre un puente de piedra arenisca roja.
      Esa sola decisión moldeó esta ribera más que ninguna otra.

      Antes del ferrocarril, la industria del río Mill era fuerza hidráulica: un
      molino de grano, una fábrica de carruajes, un taller de ruedas y ejes, un
      molino de papel y, desde 1798, la armería de Eli Whitney río arriba. Esas
      fábricas tenían que estar donde estaba la corriente. Después del
      ferrocarril, a una fábrica le bastaba con estar donde estaba la carga, y un
      solar con una vía a un lado y un río de marea navegable al otro, a minutos
      de una densa reserva de mano de obra, era lo mejor que podía ofrecer el
      suelo.

      Así que se rellenaron las marismas y se ocupó la ribera. A principios del
      siglo XX el bajo Mill River estaba flanqueado de fábricas de botas de
      goma, relojes, piezas de automóvil, cartón, calderas de vapor, latón y
      alambre.

      El puente de arenisca fue sustituido en 1906-07 por los dos arcos de
      hormigón que siguen en pie. El Engineering and Building Record publicó los
      planos en noviembre de 1908.

      ## Tres puentes, y uno que se detuvo

      Mirando al norte desde aquí se ve la secuencia. El puente más cercano
      llevaba el ferrocarril de New Haven, New London y Stonington, iniciado en
      1852, hacia el este por Fair Haven y la costa de Connecticut; esa línea
      está hoy abandonada. El del medio es el arco de 1906-07, que sigue llevando
      trenes. El más lejano es el puente de Humphrey Street, construido en 1952
      para sustituir un cruce de 1909 entre State Street y Fair Haven.

      ## Los raíles que entraban dentro

      Una línea principal es la parte que se ve. No es la que convirtió esto en
      un río industrial.

      Eso lo hizo el **apartadero privado**: un ramal que salía de la vía
      principal, cruzaba un patio y entraba por la pared de un edificio concreto,
      para que un vagón se cargara donde se fabricaba la mercancía en lugar de
      acarrearla hasta una estación. Toda fábrica seria de este tramo tenía uno o
      quería tenerlo. Por eso las fábricas están donde están: ya en el siglo XX
      no junto al río por el agua, sino junto al río porque los raíles ya estaban
      allí.

      El ejemplo más claro que se conserva queda unos cientos de metros aguas
      arriba, y merece el paseo.

      ## Papel, otra vez

      Antes del ferrocarril, uno de los talleres de este río era un **molino de
      papel**, movido por agua como todo lo demás. Un siglo después el papel
      volvió, y esta vez llegó por raíl.

      La **National Folding Box Company** se formó en Nueva York a principios de
      la década de 1890 con la unión de varios fabricantes de cartón. En 1905
      eligió New Haven como centro de producción y compró una manzana entera en
      James Street: por el atraque de barcazas, por los apartaderos de al lado y
      por una mano de obra que vivía a pie de fábrica en Fair Haven, Cedar Hill y
      Barnesville. La planta de cuatro pisos se levantó en 1914.

      En 1927 era **la fábrica de cajas plegables más grande y prestigiosa del
      mundo.**

      Es fácil restarle importancia, porque una caja no es un objeto glamuroso.
      Pero toda la idea del producto de marca del siglo XX — algo que se reconoce
      en un estante, sellado, impreso, idéntico siempre — depende de que alguien
      fabrique el envase. National imprimía para **Budweiser**, **Hershey's**,
      **General Electric** y las tabacaleras. Y para Peter Paul: hacía las cajas
      de **Mounds y Almond Joy**, después de haber ayudado a poner en marcha la
      empresa como inversión externa.

      Un apartadero privado salía de la vía principal, cruzaba el patio y entraba
      por la pared, para que un vagón se llenara donde se hacían las cajas. **La
      mayor fábrica de cajas plegables del mundo se alimentaba por una vía del
      ferrocarril cuyo puente está usted mirando.**

      ## Y después, la chaqueta

      Las fábricas de cartón del sur, junto a la madera, bajaron los precios por
      debajo de lo que Nueva Inglaterra podía igualar. Federal Paper Board compró
      National en 1953 y mantuvo la planta hasta 1974, cuando cerró.

      En 1976 un entrenador del Hamden Hall llamado **David Beckerman** trasladó
      su joven empresa de ropa deportiva a la fábrica de cajas vacía y, ese mismo
      año, obtuvo una licencia de las Grandes Ligas de béisbol. Antes de eso, una
      chaqueta de equipo no era realmente un producto que se pudiera comprar.
      Después, era una industria. A finales de los ochenta, la chaqueta satinada
      con la **S y la estrella** en la manga era uno de los objetos más
      reconocibles de la cultura popular estadounidense, y se diseñaba y se
      enviaba desde un edificio junto al río Mill.

      Starter salió a bolsa en 1993, quedó sin aire con la huelga de béisbol de
      1994 y se declaró en quiebra en 1999. El edificio sigue trabajando: alberga
      ACES, United Way of Greater New Haven y Workforce Alliance, y ACES lo compró
      en propiedad en mayo de 2026.

      Una fábrica de luz natural construida en 1914 para plegar cartón está hoy
      llena de gente que ayuda a otra gente a encontrar trabajo. Es mejor final
      del que tienen la mayoría de las fábricas de Nueva Inglaterra.

      Vuelva a mirar el puente cercano con eso en la cabeza. No es un puente que
      llevara gente a ninguna parte. Es un puente que llevaba carga hasta una
      puerta.

      ## Una nota sobre lo que sigue en pie

      **El cruce abandonado lleva años deshaciéndose, y el proyecto lo registra
      como recientemente caído al río.** Si está leyendo esto en el sendero y lo
      que ve no coincide con lo que muestra el letrero, el letrero es más viejo
      que el río.

      ## Lo que costó

      Esto ocurrió antes de la Ley de Agua Limpia, y el río se trataba como parte
      de la fábrica. Los dueños echaban en él lo que querían quitarse de encima.
      El vertido bajaba hasta los bancos de ostras que rodeaban la zona
      industrial, y ostricultores y fábricas pelearon por ello durante décadas:
      una discusión que ganaron las fábricas.

      En 1970 el río Mill superaba en cuatro veces el límite legal para poder
      nadar, y se llegó a hablar en serio de cubrirlo con pavimento.

      Se marchó la industria en su lugar. El río lleva recuperándose desde
      entonces, y los arenques de río todavía lo remontan cada primavera para
      desovar, como lo hacían antes del Neck Bridge.

