title:
  en: The Box Factory and the Bridge
  es: La Fábrica de Cajas y el Puente

sign:

  lede:
    en: >-
      The land you are standing on was once marshland, mud and meadow, raised
      above the tide line with fill. The Mill River is a tidal stream, draining
      from the uplands of Cheshire south into Long Island Sound. The clay, silt
      and sand around you were once the floor of a shallow sea. Since English
      Puritans settled here in 1638, bridging this river has been how the city
      holds itself together.
    # The draft translation ended with a line of DeepL advertising sitting in
    # the body text. Rewritten.
    es: >-
      La tierra que pisa fue en su día marisma, lodo y pradera, elevada sobre la
      línea de marea con relleno. El río Mill es una corriente de marea que baja
      desde las tierras altas de Cheshire hacia el sur, hasta el estrecho de Long
      Island. La arcilla, el limo y la arena que le rodean fueron el fondo de un
      mar poco profundo. Desde que los puritanos ingleses se asentaron aquí en
      1638, tender puentes sobre este río ha sido la forma de mantener unida la
      ciudad.

  section:
    heading:
      en: The Rails That Went Indoors
      es: Los raíles que entraban dentro
    body:
      en: >-
        Look north and count the crossings: Humphrey Street, 1952; the working
        rail arch of 1906-07, on a line laid in 1839; and nearest, an abandoned
        shoreline railway of 1852. That nearest one is the interesting one. Before
        the rails, industry here had to sit where the current was — a grist mill,
        a wheel and axle shop, a **paper mill**. After them, a factory only had to
        sit where the freight was, and the rails obliged by going indoors: a
        **private siding** off the main line, across a yard, in through the wall.
        Which is how, in 1905, the National Folding Box Company came to buy the
        whole block upstream and build **the largest folding box plant in the
        world** — paper again, on the same river, a century on.
      es: >-
        Mire al norte y cuente los cruces: Humphrey Street, de 1952; el arco
        ferroviario en servicio de 1906-07, sobre una línea tendida en 1839; y el
        más cercano, un ferrocarril de costa abandonado de 1852. Ese último es el
        interesante. Antes de los raíles, la industria tenía que estar donde
        estaba la corriente: un molino de grano, un taller de ruedas y ejes, un
        **molino de papel**. Después, a una fábrica le bastaba con estar donde
        estaba la carga, y los raíles se ocuparon de entrar dentro: un
        **apartadero privado** desde la vía principal, cruzando el patio, por la
        pared. Así fue como en 1905 la National Folding Box Company compró la
        manzana entera río arriba y levantó **la mayor fábrica de cajas plegables
        del mundo**: papel otra vez, en el mismo río, un siglo después.
        y Stonington, de 1852, que iba al este por Fair Haven y la costa.

