      text:
        en: >-
          Lake Whitney supplied New Haven's drinking water from 1862 until 1991.
          The dam still blocks the river: fish that once ran its whole length to
          spawn now stop here, at the foot of the wall that made the lake.
        es: >-
          El lago Whitney abasteció de agua potable a New Haven desde 1862 hasta
          1991. La presa sigue cortando el río: los peces que antes remontaban el
          Mill entero para desovar se detienen aquí, al pie del muro que formó el
          lago.


web:
  subtitle:
    en: How a corn mill became an armory, and why New Haven's fires ended up raising the dam
    es: Cómo un molino de maíz se convirtió en armería, y por qué los incendios de New Haven acabaron elevando la presa

  body:
    en: |
      Everything about the Mill River starts here. The river takes its name from
      the mills built on its banks to use the current, and the first of them —
      Christopher Todd's gristmill, grinding corn for the colony — stood on this
      spot from 1642. By 1780 there were eight mills on the river. Farmers rented
      time at them to grind their grain.

      ## The mill that named the river

      Before any of this there was one mill, and it is the reason the water has
      the name it has.

      Around 1640 the New Haven Colony put up a communal, water-powered corn mill
      at the lower falls, on the ground where the armory and then the dam would
      later stand. In the colony's records it is not given a name. It is just
      "the mill" — and the water running past it became the Mill River, which is
      what everyone has called it for nearly four hundred years.

      We also know it was badly built, because somebody was taken to court over
      it. From the General Court of New Haven in 1642:

      > **Richard Beach** for nott performing covenant in the worke w[hi]ch he
      > undertooke to doe att the mill, w[hi]ch he was to doe strongly and
      > substantially, butt did itt **weakely and sleightly** as was proved by the
      > testimony of **John Wakefield the miller**, himselfe allso nott denying
      > itt; Itt was ordered that he should make good the damage, butt because
      > the damage is not justly known what itt is, Mr. Goodyeare and Mr. Gregson
      > are to [v]eiw the worke, and consider off and sett downe the damage by
      > his [defec]tive workmanship.

      A contractor who cut corners, a miller who testified against him, a
      contractor who did not even bother to deny it, and two men sent out to
      price the damage. That is the earliest human voice we have from this spot,
      and it is a building dispute.

      ## 1798

      In 1798 Eli Whitney bought Todd's mill and the ground around it, and built
      an armory.

      Whitney is remembered for the cotton gin, which he patented in 1794 and
      made almost nothing from, because it was too easy to copy. The armory was
      the second act. He took a contract to supply muskets to the United States
      Army — a large order, on a short deadline, with no workforce of trained
      gunsmiths to draw on.

      His answer was to change what a worker had to be able to do. Instead of one
      craftsman filing a whole gun to fit itself, machines guided by jigs and
      patterns would cut each part close enough to a standard that any part would
      fit any gun. The skill moved out of the hand and into the machine.

      Whitney did not invent the idea, and historians have spent a long time
      arguing about how completely his own muskets achieved it. But the method
      that came out of this riverbank — interchangeable parts, machine tools,
      division of labour — is the one that made American mass production
      possible. The water turned the machinery.

      ## The fires

      By the middle of the 19th century New Haven had a serious fire problem.
      The population was growing, houses stood close together, and light and heat
      came from oil lamps and open flames. Fires started often and ran through
      whole blocks.

      The water to fight them came from the Mill River and from the Farmington
      Canal. When the canal was drained and converted into a railway, that second
      source disappeared, and the city was left short.

      Eli Whitney Jr. — the inventor's son, running the family works upstream in
      Whitneyville — led the effort to found the New Haven Water Company and to
      dam the river properly. He had his own reason as well: a higher dam meant
      more head, and more head meant more power for his mills.

      ## The dam

      The original dam was wooden. Whitney and his son rebuilt it in masonry and
      raised it repeatedly: from roughly six feet to about twenty-seven in 1860,
      to thirty-one in 1866, and by another nineteen inches in 1916, which is
      close to its height today.

      The reservoir it created was named Lake Whitney, and for about a hundred
      and thirty years it was a major part of the public water supply for New
      Haven County. It served in that role until 1991. The upper Mill River is
      still strictly regulated because of it — industry was removed from the
      river above the reservoir, and the water quality upstream has stayed good.

      ## What a dam costs

      A dam is a wall across a migration route. River herring — alewives and
      blueback herring — spend their lives at sea and return to fresh water each
      spring to spawn, and before 1860 they could run the length of the Mill
      River. After 1860 they could run as far as this wall.

      That is the trade the city made, and it is one the region has been slowly
      revisiting: fish passage, fishways and dam removals across Connecticut have
      been reopening rivers to the spring run.

      ## The site today

      The armory site is now the Eli Whitney Museum, and the barn, the dam and
      the water works are the most legible industrial landscape on the river.
      Downstream from here the Mill River becomes something else entirely —
      tidal, filled, bridged, and built over — but this is where it began.

    es: |
      Todo lo del río Mill empieza aquí. El río debe su nombre a los molinos
      construidos en sus orillas para aprovechar la corriente, y el primero de
      ellos — el molino de grano de Christopher Todd, que molía el maíz de la
      colonia — estuvo en este punto desde 1642. Hacia 1780 había ocho molinos en
      el río. Los agricultores alquilaban tiempo en ellos para moler su grano.

      ## The mill that named the river

      Before any of this there was one mill, and it is the reason the water has
      the name it has.

      Around 1640 the New Haven Colony put up a communal, water-powered corn mill
      at the lower falls, on the ground where the armory and then the dam would
      later stand. In the colony's records it is not given a name. It is just
      "the mill" — and the water running past it became the Mill River, which is
      what everyone has called it for nearly four hundred years.

      We also know it was badly built, because somebody was taken to court over
      it. From the General Court of New Haven in 1642:

      > **Richard Beach** for nott performing covenant in the worke w[hi]ch he
      > undertooke to doe att the mill, w[hi]ch he was to doe strongly and
      > substantially, butt did itt **weakely and sleightly** as was proved by the
      > testimony of **John Wakefield the miller**, himselfe allso nott denying
      > itt; Itt was ordered that he should make good the damage, butt because
      > the damage is not justly known what itt is, Mr. Goodyeare and Mr. Gregson
      > are to [v]eiw the worke, and consider off and sett downe the damage by
      > his [defec]tive workmanship.

      A contractor who cut corners, a miller who testified against him, a
      contractor who did not even bother to deny it, and two men sent out to
      price the damage. That is the earliest human voice we have from this spot,
      and it is a building dispute.

      ## El molino que dio nombre al río

      Antes de todo esto hubo un molino, y es la razón de que el agua se llame
      como se llama.

      Hacia 1640 la Colonia de New Haven levantó un molino comunal de maíz
      movido por agua en los saltos de abajo, en el terreno donde después
      estarían la armería y luego la presa. En las actas de la colonia no se le
      da nombre: es simplemente "el molino" — y el agua que pasaba a su lado
      pasó a ser el río del Molino, el Mill River, que es como se ha llamado
      desde hace casi cuatrocientos años.

      También sabemos que estuvo mal construido, porque alguien acabó en el
      tribunal por ello. Del Tribunal General de New Haven, 1642:

      > **Richard Beach**, por no cumplir lo pactado en la obra que se
      > comprometió a hacer en el molino, que debía ejecutar con solidez y
      > firmeza, y la hizo **floja y descuidadamente**, según probó el testimonio
      > de **John Wakefield, el molinero**, sin negarlo él mismo tampoco; se
      > ordenó que reparara el daño, pero como no se sabe con exactitud cuál es,
      > el señor Goodyeare y el señor Gregson han de examinar la obra y fijar el
      > perjuicio causado por su trabajo defectuoso.

      Un contratista que escatimó, un molinero que declaró contra él, un
      contratista que ni se molestó en negarlo y dos hombres enviados a tasar el
      destrozo. Es la voz humana más antigua que tenemos de este lugar, y es una
      disputa de obras.

      ## 1798

      En 1798 Eli Whitney compró el molino de Todd y el terreno de alrededor, y
      construyó una armería.

      A Whitney se le recuerda por la desmotadora de algodón, que patentó en 1794
      y de la que apenas sacó dinero, porque era demasiado fácil de copiar. La
      armería fue el segundo acto. Aceptó un contrato para suministrar mosquetes
      al Ejército de Estados Unidos: un pedido grande, con poco plazo y sin una
      plantilla de armeros formados a la que recurrir.

      Su respuesta fue cambiar lo que un trabajador tenía que saber hacer. En
      lugar de que un artesano limara un fusil entero para que encajara consigo
      mismo, unas máquinas guiadas por plantillas y patrones cortarían cada pieza
      lo bastante cerca de una norma como para que cualquier pieza sirviera en
      cualquier fusil. La destreza pasó de la mano a la máquina.

      Whitney no inventó la idea, y los historiadores llevan mucho tiempo
      discutiendo hasta qué punto sus propios mosquetes la lograron. Pero el
      método que salió de esta ribera — piezas intercambiables, máquinas
      herramienta, división del trabajo — es el que hizo posible la producción en
      serie estadounidense. El agua movía la maquinaria.

      ## Los incendios

      A mediados del siglo XIX New Haven tenía un grave problema de incendios. La
      población crecía, las casas estaban pegadas unas a otras, y la luz y el
      calor venían de lámparas de aceite y fuegos abiertos. Los incendios
      empezaban a menudo y arrasaban manzanas enteras.

      El agua para apagarlos venía del río Mill y del canal de Farmington. Cuando
      el canal se vació y se convirtió en ferrocarril, esa segunda fuente
      desapareció y la ciudad se quedó corta.

      Eli Whitney hijo — el hijo del inventor, que dirigía las fábricas
      familiares río arriba, en Whitneyville — impulsó la fundación de la New
      Haven Water Company y la construcción de una presa en condiciones. También
      tenía su propio motivo: una presa más alta daba más salto, y más salto daba
      más fuerza a sus fábricas.

      ## La presa

      La presa original era de madera. Whitney y su hijo la reconstruyeron en
      mampostería y la elevaron varias veces: de unos seis pies a unos
      veintisiete en 1860, a treinta y uno en 1866, y diecinueve pulgadas más en
      1916, cerca de su altura actual.

      El embalse que formó se llamó lago Whitney, y durante unos ciento treinta
      años fue una parte importante del abastecimiento público de agua del
      condado de New Haven. Cumplió esa función hasta 1991. El alto Mill River
      sigue estando muy regulado por ello: se retiró la industria del río por
      encima del embalse, y la calidad del agua aguas arriba se ha mantenido
      buena.

      ## Lo que cuesta una presa

      Una presa es un muro atravesado en una ruta migratoria. Los arenques de río
      — alosas y arenques de lomo azul — pasan la vida en el mar y vuelven al
      agua dulce cada primavera para desovar, y antes de 1860 podían remontar el
      río Mill entero. Después de 1860 podían llegar hasta este muro.

      Ese es el trato que hizo la ciudad, y es uno que la región lleva tiempo
      revisando poco a poco: pasos para peces, escalas y demoliciones de presas
      por todo Connecticut han ido reabriendo ríos a la subida de primavera.

      ## El lugar hoy

      El solar de la armería es hoy el Museo Eli Whitney, y el granero, la presa
      y las obras hidráulicas forman el paisaje industrial más legible del río.
      Aguas abajo el Mill River se convierte en otra cosa — de marea, rellenado,
      cruzado por puentes y edificado encima — pero aquí es donde empezó.

