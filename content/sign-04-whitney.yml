# The dam is the thing in front of the reader, and the reason for it is the
# surprise: not the factory, but the fires.
title:
  en: The Dam That Fought Fires
  es: La Presa Contra Incendios

sign:

  lede:
    en: >-
      A gristmill stood on this spot from 1642, grinding the colony's corn. In
      1798 Eli Whitney bought it and built an armory here to make muskets for the
      United States Army. What he worked out on this riverbank — machining parts
      to a pattern, so any part would fit any gun — became the method that made
      mass production possible. The river turned the machines.
    es: >-
      Desde 1642 hubo aquí un molino que molía el maíz de la colonia. En 1798 Eli
      Whitney lo compró y levantó una armería para fabricar mosquetes para el
      Ejército de Estados Unidos. Lo que ideó en esta ribera — mecanizar piezas
      según un patrón, de modo que cualquier pieza sirviera para cualquier fusil
      — se convirtió en el método que hizo posible la producción en serie. El río
      movía las máquinas.

  section:
    heading:
      en: Why the Dam Got Taller
      es: Por qué creció la presa
    body:
      en: >-
        By the mid-1800s New Haven was burning. Houses stood close together and
        were lit and heated by oil lamps and open fires, so blazes ran through
        whole blocks. Water for fighting them came from the Mill River and the
        Farmington Canal — and when the canal became a railway, the city needed
        another source. Eli Whitney Jr. led the founding of the New Haven Water
        Company and raised his father's dam, which also gave his mills more
        power. The wooden dam became masonry and grew from about six feet to
        twenty-seven in 1860, thirty-one in 1866, and higher again in 1916. The
        lake behind it supplied the city's water until 1991.
      es: >-
        A mediados del siglo XIX New Haven ardía. Las casas estaban pegadas unas
        a otras y se alumbraban y calentaban con lámparas de aceite y fuegos
        abiertos, así que los incendios arrasaban manzanas enteras. El agua para
        apagarlos venía del río Mill y del canal de Farmington; cuando el canal
        se convirtió en ferrocarril, la ciudad necesitó otra fuente. Eli Whitney
        hijo impulsó la fundación de la New Haven Water Company y elevó la presa
        de su padre, lo que además dio más fuerza a sus fábricas. La presa de
        madera pasó a ser de mampostería y creció de unos seis pies a veintisiete
        en 1860, treinta y uno en 1866, y más aún en 1916. El lago que formó
        abasteció de agua a la ciudad hasta 1991.

