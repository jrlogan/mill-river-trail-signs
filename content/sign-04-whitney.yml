# The dam is the thing in front of the reader, and the reason for it is the
# surprise: not the factory, but the fires.
title:
  en: The Dam That Fought Fires
  es: La Presa Contra Incendios

sign:

  lede:
    en: >-
      A gristmill stood on this spot from 1642, grinding the colony's corn. In
      1798 Eli Whitney bought it and built an armory here to make muskets for the
      United States Army. What he worked out on this riverbank — machining parts
      to a pattern, so any part would fit any gun — became the method that made
      mass production possible. The river turned the machines.
    es: >-
      Desde 1642 hubo aquí un molino que molía el maíz de la colonia. En 1798 Eli
      Whitney lo compró y levantó una armería para fabricar mosquetes para el
      Ejército de Estados Unidos. Lo que ideó en esta ribera — mecanizar piezas
      según un patrón, de modo que cualquier pieza sirviera para cualquier fusil
      — se convirtió en el método que hizo posible la producción en serie. El río
      movía las máquinas.

  section:
    # The old conflict is probably not a conflict. The museum's 38 ft x 500 ft
    # describes the masonry structure; millrivertrail.com's 27 / 31 / +19 inches
    # tracks the spillway weir crest, which was raised repeatedly. Both can be
    # true of the same dam. That reconciliation is reported, not proven — HAER
    # CT-186-C is the survey that would settle it. See docs/DECISIONS.md.
    # The copy below states the structure and describes the raisings without
    # attaching contested numbers to them.
    heading:
      en: One Dam, Two Problems
      es: Una presa, dos problemas
    body:
      en: >-
        New Haven was burning and thirsty at once. Houses stood close together,
        lit and heated by open flame, and fires ran through whole blocks; the
        city nearly doubled in size between 1850 and 1860 and its wells became
        unusable. Eli Whitney Jr. answered both with one stone dam — 38 feet tall
        and 500 feet long, opened in 1862 — and eighteen miles of pipe. Its stone
        was quarried in place, from Mill Rock and the northern ridge of East
        Rock. The reservoir stretched two miles north. Three mills were
        submerged, and oxen dragged the Town Bridge north to the crossing we now
        call Davis Street. The spillway was raised more than once afterwards, the
        last time in 1916, because a growing city always wants a little more
        water than it has.
      es: >-
        New Haven ardía y tenía sed a la vez. Las casas estaban pegadas unas a
        otras, se alumbraban y calentaban con fuego abierto y los incendios
        arrasaban manzanas enteras; la ciudad casi duplicó su tamaño entre 1850 y
        1860 y sus pozos quedaron inservibles. Eli Whitney hijo respondió a las
        dos cosas con una sola presa de piedra — 38 pies de alto y 500 de largo,
        inaugurada en 1862 — y dieciocho millas de tubería. La piedra se extrajo
        allí mismo, de Mill Rock y de la cresta norte de East Rock. El embalse se
        extendía dos millas al norte. Tres molinos quedaron sumergidos, y unos
        bueyes arrastraron el Town Bridge hasta el cruce que hoy llamamos Davis
        Street. El aliviadero se recreció más de una vez después, la última en
        1916, porque una ciudad que crece siempre quiere un poco más de agua de
        la que tiene.

