    river_fact:
      text:
        en: >-
          A loaded scow could only go up on the flood tide and come down on the
          ebb. Lanson's working day was set by the moon, not the clock — and he
          ran the river at night, alone, on a job reckoned to need three men.
        es: >-
          Una chalana cargada solo podía subir con la marea entrante y bajar con
          la saliente. La jornada de Lanson la fijaba la luna, no el reloj, y
          remontaba el río de noche, solo, en un trabajo que se daba por hecho
          que requería tres hombres.

web:
  subtitle:
    en: The Black engineer who built the longest wharf in America, the neighbourhood he made on the far bank, and what the city did to both
    es: El ingeniero negro que construyó el muelle más largo de América, el barrio que levantó en la otra orilla, y lo que la ciudad hizo con ambos

  body:
    en: |
      Stand on this bank and try to widen the river in your head. Before the
      filling, both sides were marsh and open water, and the far bank was a good
      way further off than it looks now. The solid ground over there, and much of
      the ground under you, is made land.

      On the far side, in the corner of the old New Township nearest this river,
      was a neighbourhood its own residents named New Liberia.

      ## The names of this ground

      The area between Olive Street and the Mill River — taking in Chapel,
      Academy, East, Franklin, Greene and Grand — was New Township, added to New
      Haven in 1784. Inside it, people named their own smaller places. There was
      **New Guinea**, east of Wooster Square, where William Lanson held land
      before selling it. There was **New Liberia**, at the end of Greene Street,
      which he built. Next to it was **Slineyville**, the Irish district. North,
      at Grand Avenue and East Street running down to the water, was
      **Barnesville**, named for the innkeeper Eli Barnes.

      Only Barnesville and Fair Haven made it onto maps that lasted. The others
      were named by the people who lived in them, and left the record when those
      people were pushed out of it.

      ## Twenty-five tons at a time

      New Haven harbour is shallow. A loaded ship could not reach the town and
      had to anchor offshore and be unloaded by lighters — slow, expensive, and a
      permanent drag on the port. The wharf had to be pushed out to deep water,
      and the ordinary method of driving wooden piles would not hold in the soft
      harbour floor.

      Two contractors had already tried and given up. Lanson took it on, he
      said, to "show what a black man was capable of doing."

      His answer was stone. He owned a quarry in **East Haven**, on Blue
      Mountain, and had flat-bottomed scows built that could carry
      twenty-five-ton stones — loading them at a wharf he designed for the
      purpose and taking them across the harbour to the pier head. He described
      the work himself:

      > "The tide in this river rises about six feet, and it is considered very
      > dangerous going under the bridge. A scow must go up on the flood tide and
      > come down on the ebb tide, and it was always considered to want three men
      > to manage a scow, and get one load, in the day time. But I have performed
      > the same thing myself, many a time, alone, at the night tide … and got my
      > load, the darkest night that had ever been."

      Read that with the tide in mind. A loaded scow moves one direction per
      tide. He was riding the flood up and the ebb down, in the dark, alone, on a
      job that was reckoned to need three men and daylight.

      **A note on which river.** Lanson says "this river" and does not name it,
      and this project used to assume he meant the Mill. He probably did not. The
      2024 National Register nomination for Long Wharf Pier places his quarry in
      East Haven and has the stone crossing the harbour, which puts the dangerous
      bridge on the Quinnipiac side rather than here.

      It is fair to say his scows and this river shared water. The Mill joins the
      Quinnipiac at Grapevine Point, a mile downstream of where you are standing,
      and both empty into the same harbour he worked across. But a boat that
      passes the mouth of a river has not worked its way up one, and we would
      rather say so than stretch a connection. His link to *this* water is not
      the stone. It is the land.

      By 1812 Long Wharf reached 3,480 feet into the harbour: the longest wharf
      in the United States. He went on to build Steamboat Wharf, Basin Wharf and
      the Tomlinson Bridge; his son Isaiah also credited him with the East Haven
      bridge. In 1827 James Hillhouse hired him to build the Farmington Canal
      basin, and he used the same Blue Mountain stone and the same methods.

      ## What he did on this river

      On **2 March 1807**, three or four years after arriving in New Haven,
      Lanson bought land on the **west bank of the Mill River**, on the far edge
      of what was then called the New Township and is now Wooster Square. It had
      belonged to Mary Wooster, and had been used for ploughing contests.

      That purchase mattered twice over. It was the ground on which he later
      built **New Guinea** and then **New Liberia** — the Black neighbourhood
      across the water from where you are standing, with his boarding house in
      it, sheltering Black workers and people making their way north out of
      slavery.

      And it made him a property owner, which under Connecticut law of the time
      meant he could vote.

      **Then the law changed.** In 1814 Connecticut disenfranchised Black voters.
      Lanson and another Black landowner, **Bias Stanley**, petitioned the
      General Assembly: restore our vote, or stop taxing us. The Assembly granted
      neither.

      He had built the longest wharf in the United States, and he could not vote
      in the town it served.

      ## The Liberian Hotel

      In July 1830 Lanson opened what he advertised as a boarding house for
      people of colour, in a then-isolated corner of northeastern New Township.
      He had converted Ebenezer Peck's old slaughterhouse — a building put up for
      processing beef cattle for export — into lodgings, and he furnished them
      well; the furniture alone was reckoned at a thousand dollars. He called it
      the Liberian Hotel.

      Around it he turned old barns into housing for Black and Irish families.
      That was New Liberia. He also ran a livery stable, a clothing store and a
      rooming house down at Long Wharf. At his height he held something like
      $40,000 in property, and people called him King Lanson — admiringly by some
      and mockingly by others.

      ## What happened to it

      In 1831 the hotel was raided. By one account the white patrons present were
      arrested while the Black residents "were allowed to run" — which tells you
      what the raid was actually for.

      That set the pattern. Municipal authorities pursued Lanson for years,
      looking for a connection to illegal activity. In the mid-1840s he was held
      under a newly passed law on adultery, on a $500 bond. Across roughly six
      years he was imprisoned repeatedly, something on the order of 450 days in
      total, and he maintained his innocence throughout. In 1845 a pamphlet was
      printed in New Haven carrying his own statement about the trial — the
      source of the passage above, and one of very few first-person accounts of
      this river by anyone who worked it.

      He had defenders, including Yale's president Timothy Dwight and US Senator
      James Hillhouse. It did not save the property. Lanson lost it, fell into
      poverty, and died in 1851.

      ## What is left

      New Liberia is gone — filled over, built on, and renamed. The Liberian
      Hotel is gone. What is not gone is the harbour edge: the stone Lanson
      quarried in East Haven and floated across the harbour is still out there,
      holding up Long Wharf. What he made on *this* water was a neighbourhood,
      and the city took that from him.

      A statue of him was raised on the Farmington Canal Trail in 2020, a hundred
      and sixty-nine years after he died.

    es: |
      Párese en esta orilla e intente ensanchar el río mentalmente. Antes del
      relleno, ambos lados eran marisma y agua abierta, y la orilla de enfrente
      quedaba bastante más lejos de lo que parece ahora. El suelo firme de allí, y
      buena parte del que usted pisa, es tierra ganada.

      En la otra orilla, en el rincón del antiguo New Township más cercano a este
      río, había un barrio al que sus propios vecinos llamaron New Liberia.

      ## Los nombres de este suelo

      La zona entre Olive Street y el río Mill — que abarcaba Chapel, Academy,
      East, Franklin, Greene y Grand — era New Township, incorporada a New Haven
      en 1784. Dentro de ella, la gente nombraba sus propios lugares. Estaba
      **New Guinea**, al este de Wooster Square, donde William Lanson tuvo tierras
      antes de venderlas. Estaba **New Liberia**, al final de Greene Street, que
      él construyó. Al lado estaba **Slineyville**, el barrio irlandés. Al norte,
      en Grand Avenue con East Street bajando hacia el agua, estaba
      **Barnesville**, por el posadero Eli Barnes.

      Solo Barnesville y Fair Haven llegaron a mapas que perduraron. Los demás
      los nombró la gente que vivía en ellos, y salieron del registro cuando esa
      gente fue expulsada de él.

      ## Veinticinco toneladas por viaje

      El puerto de New Haven es poco profundo. Un barco cargado no podía llegar a
      la ciudad: fondeaba mar adentro y se descargaba con gabarras, lo que era
      lento, caro y un lastre permanente para el puerto. Había que empujar el
      muelle hasta aguas hondas, y el método habitual de clavar pilotes de madera
      no aguantaba en el fondo blando del puerto.

      Dos contratistas ya lo habían intentado y se habían rendido. Lanson aceptó
      el encargo, dijo, para "demostrar de lo que era capaz un hombre negro".

      Su respuesta fue la piedra. Tenía una cantera en **East Haven**, en Blue
      Mountain, y mandó construir chalanas de fondo plano capaces de cargar
      piedras de veinticinco toneladas, que embarcaba en un muelle diseñado por
      él y llevaba por el puerto hasta la cabeza del espigón. Él mismo describió
      el trabajo:

      > "La marea en este río sube unos seis pies, y se considera muy peligroso
      > pasar bajo el puente. Una chalana debe subir con la marea entrante y bajar
      > con la saliente, y siempre se consideró que hacían falta tres hombres para
      > manejarla y traer una carga, de día. Pero yo he hecho lo mismo, muchas
      > veces, solo, con la marea de la noche … y he traído mi carga, en la noche
      > más oscura que jamás hubo."

      Léalo pensando en la marea. Una chalana cargada se mueve en una sola
      dirección por marea. Él subía con la entrante y bajaba con la saliente, a
      oscuras, solo, en un trabajo que se daba por hecho que requería tres
      hombres y luz de día, y así sacaba cuatro cargas más por semana.

      **Una nota sobre qué río.** Lanson dice "este río" y no lo nombra, y este
      proyecto daba por hecho que se refería al Mill. Probablemente no. La
      propuesta de 2024 al Registro Nacional para Long Wharf Pier sitúa su
      cantera en East Haven y lleva la piedra cruzando el puerto, lo que coloca
      el puente peligroso del lado del Quinnipiac y no aquí.

      Es justo decir que sus chalanas y este río compartían agua. El Mill se une
      al Quinnipiac en Grapevine Point, una milla aguas abajo de donde está
      usted, y ambos desembocan en el mismo puerto que él cruzaba. Pero una
      embarcación que pasa por la desembocadura de un río no lo ha remontado, y
      preferimos decirlo a estirar una conexión. Su vínculo con *estas* aguas no
      es la piedra. Es la tierra.

      Para 1812 Long Wharf se adentraba 3.480 pies en el puerto: el muelle más
      largo de Estados Unidos. Después construyó Steamboat Wharf, Basin Wharf y
      el puente Tomlinson, y ayudó a desarrollar Wooster Square.

      ## Lo que hizo en este río

      El **2 de marzo de 1807**, tres o cuatro años después de llegar a New
      Haven, Lanson compró terreno en la **orilla oeste del río Mill**, en el
      extremo de lo que entonces se llamaba New Township y hoy es Wooster Square.
      Había sido de Mary Wooster y se usaba para concursos de arado.

      Aquella compra pesó por partida doble. Fue el suelo sobre el que después
      levantó **New Guinea** y luego **New Liberia**, el barrio negro que queda
      enfrente de donde está usted, con su casa de huéspedes dentro, que acogía a
      trabajadores negros y a quienes subían hacia el norte huyendo de la
      esclavitud.

      Y lo convirtió en propietario, lo que según la ley de Connecticut de
      entonces significaba que podía votar.

      **Luego cambió la ley.** En 1814 Connecticut privó del voto a los
      ciudadanos negros. Lanson y otro propietario negro, **Bias Stanley**,
      pidieron a la Asamblea General que les devolviera el voto o dejara de
      cobrarles impuestos. La Asamblea no concedió ninguna de las dos cosas.

      Había construido el muelle más largo de Estados Unidos y no podía votar en
      la ciudad a la que servía.

      ## El Liberian Hotel

      En julio de 1830 Lanson abrió lo que anunció como una casa de huéspedes para
      personas de color, en un rincón entonces aislado del noreste de New
      Township. Había convertido el viejo matadero de Ebenezer Peck — un edificio
      levantado para faenar ganado vacuno de exportación — en alojamiento, y lo
      amuebló bien: solo el mobiliario se tasó en mil dólares. Lo llamó el
      Liberian Hotel.

      A su alrededor transformó viejos graneros en viviendas para familias negras
      e irlandesas. Eso era New Liberia. También llevaba unas caballerizas, una
      tienda de ropa y una pensión en Long Wharf. En su mejor momento tenía unos
      40.000 dólares en propiedades, y la gente lo llamaba el Rey Lanson: unos con
      admiración y otros con burla.

      ## Lo que le pasó

      En 1831 el hotel sufrió una redada. Según un relato, los clientes blancos
      presentes fueron detenidos mientras que a los residentes negros "se les dejó
      huir", lo que dice bastante sobre para qué era realmente la redada.

      Eso marcó la pauta. Las autoridades municipales persiguieron a Lanson
      durante años, buscando alguna relación con actividades ilegales. A mediados
      de la década de 1840 fue retenido bajo una ley recién aprobada sobre
      adulterio, con una fianza de 500 dólares. A lo largo de unos seis años fue
      encarcelado repetidamente, del orden de 450 días en total, y mantuvo siempre
      su inocencia. En 1845 se imprimió en New Haven un panfleto con su propia
      declaración sobre el juicio: la fuente del pasaje anterior, y uno de los
      poquísimos relatos en primera persona de este río escritos por alguien que
      trabajó en él.

      Tuvo defensores, entre ellos el presidente de Yale, Timothy Dwight, y el
      senador James Hillhouse. No bastó para salvar sus propiedades. Lanson las
      perdió, cayó en la pobreza y murió en 1851.

      ## Lo que queda

      New Liberia ya no existe: rellenada, edificada y rebautizada. El Liberian
      Hotel tampoco. Lo que sí queda es el borde del puerto: la piedra que Lanson
      extrajo en East Haven y cruzó el puerto sigue ahí fuera, sosteniendo
      Long Wharf.

      En 2020 se levantó una estatua suya en el Farmington Canal Trail, ciento
      sesenta y nueve años después de su muerte.

