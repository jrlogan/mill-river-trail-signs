        LAST IMAGE NEEDED ON THIS SIGN. In priority order, and both are
        identified precisely so this is one phone call, not a search.
        (1) BEST: the photograph captioned "Long Wharf Pier structure, showing
        stone walls laid by Lanson" — Figure 11 of the 2024 National Register
