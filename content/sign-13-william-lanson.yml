# ---------------------------------------------------------------------------
# Sign 13: William Lanson — DRAFT FOR REVIEW
#
# Not in the original KMZ. Added because the research notes explicitly ask
# "what stories are we systematically overlooking because of culture and
# records?" — and then answer their own question with Lanson, in his own words,
# describing this river. The walk-images folder has the pictures for it.
#
# LOCATION: trail-side south of Grand Avenue, sighted across the filled ground
# toward where Greene Street once ran down to the river and the Liberian Hotel
# stood. CONFIRM ON THE GROUND — the sightline is the whole point of the sign,
# and it needs someone standing there to check that it works.
# ---------------------------------------------------------------------------

