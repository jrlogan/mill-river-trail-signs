title:
  en: King Lanson's River
  es: El Río del Rey Lanson

sign:
  lede:
    en: >-
      The river in front of you used to be much wider. Both banks were marsh,
      and the ground you are standing on is fill. Look across and a little
      south: over there, at the end of Greene Street, was a neighbourhood its
      residents called New Liberia, and in it stood the Liberian Hotel — a
      boarding house for people of colour, opened in 1830 by the man who built
      the longest wharf in the United States.
    es: >-
      El río que tiene delante era mucho más ancho. Ambas orillas eran marisma, y
      el suelo que usted pisa es relleno. Mire enfrente y un poco al sur: allí,
      al final de Greene Street, había un barrio que sus vecinos llamaban New
      Liberia, y en él estaba el Liberian Hotel, una casa de huéspedes para
      personas de color abierta en 1830 por el hombre que construyó el muelle más
      largo de Estados Unidos.

  section:
    heading:
      en: What He Built, and What It Cost Him
      es: Lo que construyó, y lo que le costó
    # CORRECTED Aug 2026. This sign used to say Lanson quarried at East Rock and
    # floated the stone down the Mill River. The 2024 National Register
    # nomination for Long Wharf Pier says he owned a quarry in EAST HAVEN and
    # the stone crossed the harbour by scow. His real Mill River connection is
    # land and neighbourhood, not stone. See docs/DECISIONS.md.
    # The quotation on the web page is from Lanson's own statement and should
    # still be checked against the printed source before this goes to print.
    body:
      en: >-
        New Haven harbour was too shallow for loaded ships, and two contractors
        had already failed at the job. William Lanson owned a quarry in East
        Haven, had scows built that could carry twenty-five tons of stone, and
        pushed Long Wharf out to deep water — 3,480 feet by 1812, the longest in
        the country. He came to this river for a different reason: in 1807 he
        bought land on its west bank, and owning land is what briefly gave him
        the vote. He built Steamboat
        Wharf, Basin Wharf and the Tomlinson Bridge, and turned an old
        slaughterhouse into the Liberian Hotel. In 1831 it was raided: the white
        patrons were arrested, and the Black residents, one account says, "were
        allowed to run." Prosecutions followed for years. Lanson lost his
        property and spent some 450 days in jail, insisting he was innocent.
      es: >-
        El puerto de New Haven era demasiado poco profundo para los barcos
        cargados, y dos contratistas ya habían fracasado en el intento. William
        Lanson tenía una cantera en East Haven, mandó construir chalanas capaces
        de cargar veinticinco toneladas de piedra y empujó Long Wharf hasta aguas
        hondas: 3.480 pies en 1812, el más largo del país. A este río vino por
        otra razón: en 1807 compró terreno en su orilla oeste, y ser propietario
        es lo que por un tiempo le dio el voto. Construyó
        Steamboat Wharf, Basin Wharf y el puente Tomlinson, y convirtió un
        antiguo matadero en el Liberian Hotel. En 1831 hubo una redada: los
        clientes blancos fueron detenidos y a los residentes negros, según un
        relato, "se les dejó huir". Siguieron años de procesos. Lanson perdió sus
        propiedades y pasó unos 450 días en la cárcel, insistiendo en que era
        inocente.

