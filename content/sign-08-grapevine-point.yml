sign:
  lede:
    en: >-
      This park was once called Grapevine Point, a spit of land where the Mill
      River runs into the Quinnipiac. In 1862 the Army pitched a training camp
      on it. Two years later it was where Connecticut's Black regiments formed —
      men who had been refused enlistment for three years, drilling on this
      ground before shipping south.
    es: >-
      Este parque se llamaba antes Grapevine Point, una lengua de tierra donde el
      río Mill desemboca en el Quinnipiac. En 1862 el Ejército instaló aquí un
      campamento de instrucción. Dos años después fue donde se formaron los
      regimientos negros de Connecticut: hombres a quienes se les había negado el
      alistamiento durante tres años, entrenando en este suelo antes de embarcar
      hacia el sur.

  section:
    heading:
      en: The 29th Connecticut
      es: El 29.º de Connecticut
    # REVIEW with the project: this is the most consequential story on the trail
    # and deserves a careful read for tone and for local detail.
    body:
      en: >-
        The Union refused Black volunteers until 1863. When Connecticut finally
        authorised a regiment, the 29th Connecticut Volunteer Infantry (Colored)
        filled quickly, and a second, the 30th, began forming behind it. They
        trained here and mustered in March 1864. The 29th fought through the
        Virginia campaigns and was among the first Union units to enter Richmond
        when it fell. They came home to a state that had made them wait, and
        their monument stands in this park.
      es: >-
        La Unión rechazó a los voluntarios negros hasta 1863. Cuando Connecticut
        autorizó por fin un regimiento, el 29.º de Infantería de Voluntarios de
        Connecticut (de Color) se completó enseguida, y detrás empezó a formarse
        un segundo, el 30.º. Se entrenaron aquí y entraron en servicio en marzo
        de 1864. El 29.º combatió en las campañas de Virginia y estuvo entre las
        primeras unidades de la Unión en entrar en Richmond cuando cayó.
        Volvieron a un estado que los había hecho esperar, y su monumento está en
        este parque.

