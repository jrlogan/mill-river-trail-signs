# ---------------------------------------------------------------------------
# Defaults merged into every sign. A sign's own file wins on any key it sets.
#
# The donor list and the dedication live here so they exist once. Change a
# funder's name and all twelve signs change together, which is the whole reason
# "Doug Houslauden" survived onto a print-ready comp in the first place.
# ---------------------------------------------------------------------------

# Public feedback. Set `url` to a Google Form (or anything that accepts a link)
# and every web page grows a "Know more about this?" invitation. Leave it blank
# and the invitation does not appear — nothing breaks.
#
# If the form has a prefilled field for the sign, put its entry id in
# `sign_param` and the link arrives with the sign already filled in, so replying
# is one box and a Send.
feedback:
  url: ""
  sign_param: ""
  prompt:
    en: >-
      Know something about this place? A photograph, a family story, a
      correction — the trail is still collecting them, and this page can change.
    es: >-
      ¿Sabe algo de este lugar? Una fotografía, una historia familiar, una
      corrección: el sendero sigue recogiéndolas, y esta página puede cambiar.
  cta:
    en: Tell us
    es: Cuéntenos

# A small line at the foot of every page, so somebody who wants to take this on
# can find everything without knowing who to ask. A link with a blank url is
# simply left out.
project:
  note:
    en: This project is open — anyone can pick it up.
    es: "Este proyecto es abierto: cualquiera puede continuarlo."
  links:
    - label: { en: Source and content, es: Código y contenido }
      url: https://github.com/jrlogan/mill-river-trail-signs
    - label: { en: Image archive, es: Archivo de imágenes }
      url: ""
    - label: { en: How to take it on, es: Cómo hacerse cargo }
      url: https://github.com/jrlogan/mill-river-trail-signs/blob/main/HANDOVER.md

sign:
  panel:
    map: panel-map.svg
    you_are_here:
      en: You Are Here
      es: Usted está aquí
    river_fact:
      label:
        en: River Fact
        es: Hecho del Río

  dedication:
    en: In honor of trail blazer Tom Holahan
    es: En honor al pionero del sendero Tom Holahan

  credits:
    label:
      en: Made Possible by
      es: Hecho posible por
    funders: >-
      Mill River Watershed Association, Sustainable CT, Susan B. Holahan and
      Family, City of New Haven, District New Haven, Bear's BBQ, Community
      Foundation for Greater New Haven, Chatham Square Neighborhood Association,
      Industrial Flow Solutions, Doug Hausladen, and other individual donors.
    produced_label:
      en: Produced by
      es: Producido por
    produced: >-
      Colin M. Caplan, Design Monsters, Joe Kolodej, Nick McGhee, and J.R. Logan.

  learn_more:
    en: Learn More
    es: Más en línea

# Rendered at the foot of every web page. The research behind these signs is
# other people's work and should say so on the page, not only in a repo file.
web:
  acknowledgements:
    en: >-
      Historical research for the Mill River Trail signage was carried out by
      Colin M. Caplan of Magrisso Forte and John R. Logan, with contributions
      from Jason Bischoff-Wurstle of the New Haven Museum and walk notes by
      Steve Hamm.
      Images are credited individually. Locator maps are drawn from
      OpenStreetMap, © OpenStreetMap contributors, ODbL.
    es: >-
      La investigación histórica para la señalización del Mill River Trail fue
      realizada por Colin M. Caplan, de Magrisso Forte, y John R. Logan, con
      aportaciones de Jason Bischoff-Wurstle del Museo de New Haven y notas de
      recorrido de Steve Hamm.
      Las imágenes se acreditan individualmente. Los mapas de localización
      proceden de OpenStreetMap, © OpenStreetMap contributors, ODbL.
