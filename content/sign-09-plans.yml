title:
  en: A Century of Plans
  es: Un Siglo de Planes

sign:
  lede:
    en: >-
      New Haven has been planning this river for more than a hundred years. In
      1910 Cass Gilbert and Frederick Law Olmsted delivered the city's first
      modern plan and told it to leave a green buffer along the Mill River rather
      than wall the water in. The city built the walls. Almost every plan since
      has been an attempt to undo something the last one allowed.
    es: >-
      New Haven lleva más de cien años planificando este río. En 1910 Cass
      Gilbert y Frederick Law Olmsted entregaron el primer plan moderno de la
      ciudad y le dijeron que dejara una franja verde a lo largo del río Mill en
      lugar de encerrar el agua entre muros. La ciudad construyó los muros. Casi
      todos los planes posteriores han intentado deshacer algo que permitió el
      anterior.

  section:
    heading:
      en: What Each Plan Wanted
      es: Qué quería cada plan
    body:
      en: >-
        The 1910 report asked for an inner circuit of parks and parkways linked
        by paths that never crossed a highway, and warned that pollution was
        already bad at low tide. In 1942 Maurice Rotival's plan reimagined the
        city around the motor car, and by the 1950s an arterial road along the
        Mill River and through East Rock was on the table. Residents formed a
        Save Our Park Committee and stopped it, though Interstate 91 still took
        ten acres. The 1987 Mill River Municipal Development Plan and the 2013
        Mill River District Plan both turned back toward the water. This trail is
        the current answer.
      es: >-
        El informe de 1910 pedía un circuito interior de parques y avenidas
        unidos por senderos que nunca cruzaran una carretera, y advertía de que
        la contaminación ya era grave con la marea baja. En 1942 el plan de
        Maurice Rotival reimaginó la ciudad en torno al automóvil, y hacia 1950
        se planteó una vía arterial junto al río Mill y a través de East Rock.
        Los vecinos formaron un comité, Save Our Park, y lo detuvieron, aunque la
        interestatal 91 se llevó igualmente diez acres. El Plan Municipal de
        Desarrollo del Mill River de 1987 y el Plan del Distrito Mill River de
        2013 volvieron a mirar hacia el agua. Este sendero es la respuesta
        actual.

