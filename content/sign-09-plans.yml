    river_fact:
      text:
        en: >-
          The 1910 plan warned that the river already smelled at low tide. It
          took until the 1970s for anyone to be required to stop putting waste
          in it.
        es: >-
          El plan de 1910 ya advertía de que el río olía mal con la marea baja.
          Hubo que esperar a los años setenta para que se obligara a alguien a
          dejar de verter en él.

web:
  subtitle:
    en: Six plans in a hundred years, and the one thing every one of them agreed about
    es: Seis planes en cien años, y lo único en lo que todos coincidieron

  body:
    en: |
      There is a particular kind of document that New Haven has produced roughly
      every twenty-five years since 1910: the plan for the Mill River. Reading
      them in order is a good way to understand how the city has thought about
      water, industry and its own future — and how consistently it has known what
      it ought to do.

      ## 1910: Gilbert and Olmsted

      Cass Gilbert and Frederick Law Olmsted prepared the city's first modern
      plan, presented to the Civic Improvement Committee in 1910. It proposed an
      inner circuit of parks, parkways and reservations linked by paths that
      would never have to cross a highway.

      On the Mill River specifically it asked for a buffer of open land along the
      water, instead of the artificial vertical walls the city was already
      starting to build to control the river's course. It warned that the buffer
      would also hold back the coming density of double-decker housing. And it
      noted, in 1910, that pollution was already a problem at low tide.

      The city built the walls.

      ## 1941: Rotival reads the same valley backwards

      **Maurice E. H. Rotival** was a French planner teaching at the Yale School
      of Architecture when the City Plan Commission hired him in 1941. He thought
      about cities as organisms — flows of freight, industry and traffic — and
      when he looked at the Mill River he saw the exact inverse of what Gilbert
      and Olmsted had seen.

      Where they had wanted a green buffer between the neighbourhoods and the
      factories, Rotival zoned the river lowlands, Cedar Hill and the harbour
      shore **for heavy industry, freight rail and limited-access highways**. He
      was the first to identify the valley as a natural north-south transit
      spine, and the first to propose a high-speed road running down it at the
      foot of East Rock.

      He came back in 1951 with an "Equilibrium Plan" that said it again:
      residential on the high ground to the west, logistics and motor traffic in
      the river valley.

      Nothing about the river had changed. The way of looking at it had.

      ## 1954: the plan becomes bulldozers

      Under **Mayor Richard C. Lee** and redevelopment director **Edward Logue**,
      New Haven became the country's most famous test case for federal urban
      renewal money — and Rotival's diagrams became contracts. The Mill River
      Redevelopment Area cleared blocks of nineteenth-century housing, shops and
      small works in the Wooster Square and Fair Haven borderlands, and replaced
      them with single-storey plants and truck distribution yards.

      ## The road that wasn't built

      The arterial down the valley was the last piece, and the one that failed.

      By 1959 and 1960 the city, the state and the highway engineers broadly
      agreed on the route. Then the drawings circulated, and people saw that the
      Mill River itself was to be straightened into a concrete channel and used
      as the median between the two carriageways.

      The fight ran from 1961 to 1965 and ended in the statute book: a state law
      that stopped the highway department taking municipal parkland without the
      city's own aldermen approving it by majority vote. New Haven's aldermen
      refused. The East Rock Connector was never built.

      Interstate 91 still went through, and took about ten acres. **Sign 10, at
      the foot of the rock, tells that story properly.**

      ## 1987 and 2013

      The Mill River Municipal Development Plan of 1987 and the Mill River
      District Plan of 2013 both start from the opposite premise to Rotival's:
      that the river is an asset rather than an obstacle, that industrial land
      near water is worth reclaiming rather than expanding, and that people
      should be able to get to the water's edge.

      ## One of them got built

      Almost everything on this page is a plan that did not happen. Gilbert and
      Olmsted's parkway was shelved. Rotival's arterial was stopped. The
      connector died in the statute book.

      So it is worth pointing at the drawing in the corner of this sign, because
      that one is real now.

      It is a 2018 proposal by Save the Sound and the City for the John S.
      Martinez School grounds at Exchange Street — a plan to pull up a dead
      stretch of roadway and let the ground absorb its own rainwater instead of
      flushing it into the river. In 2022 it was built. Nearly twelve thousand
      square feet of asphalt came out. Three hundred native plants went in, with
      bioretention gardens and swales to catch the runoff, a walkway that joins
      the trail, and a mural called *Born to Explore*.

      A hundred and twelve years after Gilbert and Olmsted told the city to leave
      the river some ground, somebody left it some ground.

      ## The thing they all agreed about

      Every one of these plans, across a century of otherwise incompatible
      assumptions, says some version of the same sentence: people should be able
      to walk along this river.

      It took until now to build it.

    es: |
      Hay un tipo de documento que New Haven ha producido más o menos cada
      veinticinco años desde 1910: el plan para el río Mill. Leerlos en orden es
      una buena forma de entender cómo ha pensado la ciudad sobre el agua, la
      industria y su propio futuro, y con qué constancia ha sabido lo que debía
      hacer.

      ## 1910: Gilbert y Olmsted

      Cass Gilbert y Frederick Law Olmsted prepararon el primer plan moderno de
      la ciudad, presentado al Comité de Mejora Cívica en 1910. Proponía un
      circuito interior de parques, avenidas y reservas unidos por senderos que
      nunca tuvieran que cruzar una carretera.

      Sobre el río Mill en concreto pedía una franja de terreno abierto junto al
      agua, en lugar de los muros verticales artificiales que la ciudad ya
      empezaba a construir para controlar el curso del río. Advertía de que esa
      franja también contendría la densidad que venía, con sus casas de dos
      pisos. Y señalaba, en 1910, que la contaminación ya era un problema con la
      marea baja.

      La ciudad construyó los muros.

      ## 1941: Rotival lee el mismo valle al revés

      **Maurice E. H. Rotival** era un planificador francés que enseñaba en la
      Escuela de Arquitectura de Yale cuando la Comisión de Planeamiento lo
      contrató en 1941. Pensaba las ciudades como organismos — flujos de
      mercancías, industria y tráfico — y cuando miró el río Mill vio justo lo
      contrario que Gilbert y Olmsted.

      Donde ellos habían querido una franja verde entre los barrios y las
      fábricas, Rotival calificó las tierras bajas del río, Cedar Hill y la
      orilla del puerto **para industria pesada, ferrocarril de mercancías y
      autopistas de acceso limitado**. Fue el primero en ver el valle como un eje
      natural de transporte norte-sur y el primero en proponer una vía rápida por
      él, al pie de East Rock.

      Volvió en 1951 con un "Plan de Equilibrio" que lo repetía: residencial en
      las tierras altas del oeste, logística y automóvil en el valle del río.

      Nada del río había cambiado. Había cambiado la manera de mirarlo.

      ## 1954: el plan se convierte en excavadoras

      Con el alcalde **Richard C. Lee** y el director de renovación urbana
      **Edward Logue**, New Haven se convirtió en el caso de prueba más famoso del
      país para el dinero federal de renovación urbana, y los diagramas de
      Rotival se convirtieron en contratos. El Área de Renovación del Río Mill
      arrasó manzanas de viviendas, comercios y talleres del siglo XIX en la
      frontera entre Wooster Square y Fair Haven, y las sustituyó por naves de una
      planta y patios de distribución por camión.

      ## La carretera que no se construyó

      La vía arterial del valle era la última pieza, y la que falló.

      Hacia 1959 y 1960 la ciudad, el estado y los ingenieros coincidían a
      grandes rasgos en el trazado. Entonces circularon los planos y la gente vio
      que el propio río Mill iba a ser enderezado en un canal de hormigón y usado
      como mediana entre las dos calzadas.

      La pelea duró de 1961 a 1965 y acabó en el código legal: una ley estatal que
      impedía al departamento de carreteras tomar terreno municipal de parque sin
      que los concejales de la propia ciudad lo aprobaran por mayoría. Los de New
      Haven se negaron. El East Rock Connector nunca se construyó.

      La interestatal 91 se hizo igualmente y se llevó unos diez acres. **El
      letrero 10, al pie de la roca, cuenta esa historia como es debido.**

      ## 1987 y 2013

      El Plan Municipal de Desarrollo del Mill River de 1987 y el Plan del
      Distrito Mill River de 2013 parten de la premisa contraria a la de Rotival:
      que el río es un activo y no un obstáculo, que el suelo industrial junto al
      agua merece recuperarse en vez de ampliarse, y que la gente debería poder
      llegar a la orilla.

      ## Uno de ellos sí se construyó

      Casi todo lo que hay en esta página es un plan que no ocurrió. La avenida
      de Gilbert y Olmsted se archivó. La vía arterial de Rotival se detuvo. La
      conexión murió en el código legal.

      Por eso vale la pena señalar el plano de la esquina de este letrero, porque
      ese sí es real.

      Es una propuesta de 2018 de Save the Sound y la ciudad para el recinto de
      la escuela John S. Martinez, en Exchange Street: levantar un tramo muerto
      de calzada y dejar que el suelo absorba su propia lluvia en lugar de
      lanzarla al río. En 2022 se construyó. Salieron casi doce mil pies
      cuadrados de asfalto. Entraron trescientas plantas nativas, con jardines de
      biorretención y cunetas para recoger la escorrentía, un paseo que enlaza
      con el sendero y un mural titulado *Born to Explore*.

      Ciento doce años después de que Gilbert y Olmsted le dijeran a la ciudad
      que dejara algo de terreno al río, alguien le dejó algo de terreno.

      ## Aquello en lo que todos coincidieron

      Todos estos planes, a lo largo de un siglo de supuestos por lo demás
      incompatibles, dicen alguna versión de la misma frase: la gente debería
      poder caminar junto a este río.

      Se ha tardado hasta ahora en construirlo.

