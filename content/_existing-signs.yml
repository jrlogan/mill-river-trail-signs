# ---------------------------------------------------------------------------
# Signage already standing on the trail, catalogued from 39 photographs taken
# 1 and 15 April 2021. 34 of them carried GPS, so the positions below are the
# camera's, not an estimate.
#
# This exists for two reasons. It tells a visitor what is already out there, and
# it tells us what NOT to repeat: there is already a salt marsh sign, a
# watershed sign and a songbird sign on this river.
#
# `extends` names the new sign that carries the story further, if any.
# ---------------------------------------------------------------------------

title:
  en: Already on the Trail
  es: Ya en el Sendero

intro:
  en: >-
    These signs were here before this project started. Some are decades old.
    They are listed so you can find them, and so the new signs add to them
    rather than repeat them.
  es: >-
    Estos letreros ya estaban aquí antes de que empezara este proyecto. Algunos
    tienen décadas. Se listan para que pueda encontrarlos, y para que los nuevos
    letreros los complementen en lugar de repetirlos.

groups:
  - name:
      en: Eli Whitney Museum and the dam
      es: El Museo Eli Whitney y la presa
    note:
      en: >-
        The richest cluster on the river — a full interpretive series on the
        armory, run by the museum.
      es: >-
        El grupo más rico del río: una serie interpretativa completa sobre la
        armería, gestionada por el museo.
    signs:
      - title: The Coal Shed
        photo: coal-shed.jpg
        lat: 41.33594
        lon: -72.91044
        note: >-
          Charcoal for the armory forges came up the Mill River on a
          flat-bottomed scow and was carried up the hill to the shed. Whitney's
          1823 inventory recorded 5,075 bushels.
        extends: sign-04-whitney
      - title: The Barn
        photo: the-barn.jpg
        lat: 41.33595
        lon: -72.91166
        note: >-
          Square rule construction as an early application of precision and
          interchangeable practice. It also records that while Whitney was
          quarrying the stone for this barn's foundation, he supplied Ithiel
          Town with the stone for Trinity Church on the Green.
        extends: sign-04-whitney
      - title: The Dam
        photo: the-dam.jpg
        lat: 41.33649
        lon: -72.91061
        note: >-
          The most useful sign on the river, and the one that corrects our own
          numbers. See the transcript.
        extends: sign-04-whitney
        transcript: >-
          New Haven was thirsty. Between 1850 and 1860, New Haven had nearly
          doubled in size. With no sanitation system, its public wells became
          unusable. Proliferating factories increased the danger of fire.
          Efforts to establish a modern water system had languished, deadlocked
          by politics for a decade. Whitney solved the two challenges with one
          stone dam. He marshalled public investment to finance the 38 foot
          tall, 500 foot long dam that still supplies a portion of New Haven's
          water. The dam's construction was just half the problem. Its stone was
          quarried in place from Mill Rock to your left and from the northern
          ridge of East Rock to your right. Eighteen miles of pipe distributed
          water to New Haven. Lake Whitney, the new dam's reservoir, stretched
          two miles to the north. Three mills were submerged. Three bridges and
          20 other buildings had to be relocated. Oxen dragged the Town Bridge
          north to the crossing we now call Davis Street. The original dam and
          reservoir have been expanded twice since it opened in 1862.
      - title: The Turbine
        photo: the-turbine.jpg
        lat: 41.33654
        lon: -72.91056
        note: Water power at the armory, and the vertical wheel that replaced it.
        extends: sign-04-whitney
      - title: The Second Armory
        photo: second-armory.jpg
        lat: 41.33648
        lon: -72.91064
        note: Whitney's Improved Fire-Arms, and the armory's Civil War peak.
        extends: sign-04-whitney
      - title: The Boarding House
        photo: boarding-house.jpg
        lat: 41.33595
        lon: -72.91166
        note: >-
          Whitney had no trained gunsmiths, so he built housing and brought
          workers to the site. The boarding house is where they lived.
        extends: sign-04-whitney
      - title: Transition
        photo: transition.jpg
        lat: 41.33594
        lon: -72.91044
        note: >-
          What came after the armory — the Acme Wire Company and the Sentinel
          Stove Company, and the industrial archaeology still in the ground.
      - title: The Town Bridge
        photo: town-bridge.jpg
        lat: 41.33594
        lon: -72.91044
        note: >-
          Ithiel Town patented this truss in 1820. Whitney endorsed it for its
          simplicity, lightness, strength, cheapness and durability. Students
          from Eli Whitney Technical School built the replica in 1979.
        extends: sign-03-bridges
      - title: Historical Artifact — the pipe
        photo: historical-artifact-pipe.jpg
        lat: 41.33596
        lon: -72.91183
        note: A section of the water main that carried Lake Whitney into the city.
        extends: sign-04-whitney
      - title: Eli Whitney 1765-1825 — bronze plaque
        photo: eli-whitney-plaque.jpg
        lat: 41.33832
        lon: -72.91117
        note: >-
          "Inventor of the Cotton Gin." Erected by the Hamden Historical
          Society in 1939.
        extends: sign-04-whitney

  - name:
      en: East Rock Park
      es: El parque de East Rock
    note:
      en: >-
        Mostly natural history, and good. The new signs deliberately do not
        duplicate these.
      es: >-
        Sobre todo historia natural, y buena. Los letreros nuevos evitan
        deliberadamente duplicarlos.
    signs:
      - title: Geology of East Rock
        photo: geology-of-east-rock.jpg
        lat: 41.32696
        lon: -72.91062
        note: >-
          Yale Peabody Museum. The breakup of Pangaea, the trap rock, and a
          geologic map of the ridge.
        extends: sign-11-east-rock
      - title: Mill River Watershed
        photo: mill-river-watershed.jpg
        lat: 41.33510
        lon: -72.90992
        note: >-
          The value of wetlands, with the birds and fish of the river. Covers
          much of what a nature sign would otherwise say.
        extends: sign-07-tides
      - title: "Songbirds: Neotropical Migrants"
        photo: songbirds.jpg
        lat: 41.33832
        lon: -72.91117
        note: >-
          Migration routes between here and South America. Worth knowing about
          before commissioning any more bird illustrations.
      - title: East Rock Park map
        photo: east-rock-park-map.jpg
        lat: 41.33033
        lon: -72.90894
        note: Orientation map for the park and its trails.

  - name:
      en: Criscuolo Park and Fair Haven
      es: El parque Criscuolo y Fair Haven
    signs:
      - title: 29th Connecticut Volunteer Infantry (Colored) monument
        photo: 29th-connecticut-monument.jpg
        lat: 41.30333
        lon: -72.90399
        note: >-
          Black granite monoliths carrying the roster and the regiment's
          history, with a Freedom Trail marker. The narrative records that
          after the Colored Ladies of New Haven presented the regiment its
          flag, it marched aboard the transport Warrior on 19 March 1864 and
          sailed for Annapolis.
        extends: sign-08-grapevine-point
      - title: The Salt Marsh Wall
        photo: salt-marsh-wall.jpg
        lat: 41.30410
        lon: -72.90247
        note: >-
          A field guide to salt marsh plants in Connecticut. Directly overlaps
          the species panels, and is the reason those pick different plants.
        extends: sign-07-tides
      - title: Fair Haven Walking Trails
        photo: fair-haven-walking-trails.jpg
        lat: 41.30358
        lon: -72.90281
        note: >-
          The Mill River-Ferry Street Loop and the Quinnipiac River Trail Loop.
          Chatham Square Neighborhood Association, CARE at the Yale School of
          Public Health, and the City of New Haven.
      - title: Lea's Place
        photo: leas-place.jpg
        lat: 41.30369
        lon: -72.90407
        note: >-
          A memorial playground, with owl artwork by Lea Doran on the flags
          above it.
