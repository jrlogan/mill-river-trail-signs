title:
  en: Twice a Day, the Sea
  es: Dos Veces al Día, el Mar

sign:
  lede:
    en: >-
      This is not really a river here. It is the sea, reaching six feet up into
      the middle of a city and then withdrawing, twice every day. Come back in
      six hours and the water you are looking at will be somewhere else, the mud
      will be showing, and a different set of animals will be feeding on it.
    es: >-
      Esto aquí no es realmente un río. Es el mar, que sube seis pies hasta el
      centro de una ciudad y se retira, dos veces al día. Vuelva dentro de seis
      horas y el agua que está mirando estará en otra parte, el lodo quedará al
      descubierto, y habrá otro grupo de animales alimentándose de él.

  section:
    heading:
      en: Living on the Swing
      es: Vivir en el vaivén
    body:
      en: >-
        Nothing here can afford to specialise. A ribbed mussel is underwater for
        half the day and baking in the air for the other half. Fiddler crabs dig
        burrows that hold water while the tide is out, and the males wave one
        oversized claw at the entrance. Mummichogs — small, tough, everywhere —
        ride the flood tide up over the mud to feed and drop back with the ebb.
        Egrets and herons work the edge of the falling water because that is when
        everything is trapped and visible. It is a demanding place to live, and
        that is exactly why it is so productive.
      es: >-
        Aquí nada puede permitirse especializarse. Un mejillón de marisma pasa
        medio día bajo el agua y el otro medio al sol. Los cangrejos violinistas
        cavan madrigueras que retienen agua durante la bajamar, y los machos
        agitan una pinza descomunal en la entrada. Los fúndulos — pequeños, duros
        y por todas partes — suben con la marea sobre el lodo para alimentarse y
        bajan con el reflujo. Garcetas y garzas trabajan el borde del agua que se
        retira, porque es cuando todo queda atrapado y a la vista. Es un sitio
        exigente para vivir, y por eso es tan productivo.

