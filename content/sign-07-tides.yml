web:
  subtitle:
    en: A tidal estuary in the middle of New Haven, and the animals that make a living on six hours' notice
    es: Un estuario de marea en pleno New Haven, y los animales que se ganan la vida con seis horas de aviso

  body:
    en: |
      The tide reaches about six feet here. Twice a day salt water comes up the
      Mill River from New Haven Harbor, floods the channel and the mud either
      side of it, and then drains back out. Everything that lives in this stretch
      organises its life around that.

      ## Why estuaries are worth so much

      An estuary — where a river meets the sea — is among the most productive
      habitat on earth, more productive per acre than farmland. Fresh water
      arrives carrying nutrients from upstream, the tide stirs and redistributes
      them, and the shallow water lets sunlight reach the bottom. Marsh grass
      grows in it faster than almost anything else, dies back, and feeds
      everything.

      It is also a nursery. A great many fish that spend adult life offshore
      spawn or grow up in estuaries, because the shallows are warm and the
      predators are big enough to be excluded.

      ## Making a living on the swing

      The catch is that conditions here change completely every six hours. Salt,
      temperature and whether you are underwater at all — all of it swings.
      Nothing here can afford to be a specialist.

      **Ribbed mussels** sit half-buried among the cordgrass roots, filtering
      when the tide covers them and clamped shut when it does not. Their byssal
      threads bind the mud together; a bank with mussels erodes far more slowly
      than a bank without.

      **Fiddler crabs** dig burrows that trap water at low tide. The males have
      one hugely enlarged claw, useless for feeding and used for waving at
      females and threatening other males.

      **Mummichogs** are the small tough killifish of every Atlantic marsh. They
      ride the flood up over the mud to feed and drop back on the ebb, and they
      tolerate temperature, salinity and oxygen swings that would kill almost
      anything else.

      **Egrets, herons and osprey** show up because the falling tide concentrates
      prey into shrinking pools. Low tide is feeding time.

      ## What to watch for

      Low tide is the interesting one — mud flats exposed, crab burrows visible,
      birds working the edges. The tall feathery reed spreading along the banks
      is Phragmites, and the very large white swans are mute swans: both
      introduced, both aggressive, and both a problem for the native marsh.

      Check a New Haven Harbor tide table before you come. The river is a
      different place at each end of the cycle.

    es: |
      La marea sube aquí unos seis pies. Dos veces al día el agua salada entra
      por el río Mill desde el puerto de New Haven, inunda el canal y el lodo a
      ambos lados, y vuelve a salir. Todo lo que vive en este tramo organiza su
      vida alrededor de eso.

      ## Por qué valen tanto los estuarios

      Un estuario — donde el río se encuentra con el mar — está entre los
      hábitats más productivos de la Tierra, más que las tierras de cultivo. El
      agua dulce llega cargada de nutrientes de aguas arriba, la marea los
      remueve y los reparte, y el agua poco profunda deja que la luz llegue al
      fondo. La hierba de marisma crece ahí más rápido que casi cualquier cosa,
      muere y alimenta a todo lo demás.

      También es una guardería. Muchísimos peces que pasan su vida adulta mar
      adentro desovan o crecen en estuarios, porque las aguas someras son cálidas
      y dejan fuera a los depredadores grandes.

      ## Ganarse la vida en el vaivén

      El problema es que aquí las condiciones cambian por completo cada seis
      horas. La sal, la temperatura y hasta si uno está bajo el agua: todo oscila.
      Nada aquí puede permitirse ser especialista.

      Los **mejillones de marisma** viven medio enterrados entre las raíces de la
      espartina, filtrando cuando la marea los cubre y cerrados cuando no. Sus
      filamentos atan el lodo; una orilla con mejillones se erosiona mucho más
      despacio que una sin ellos.

      Los **cangrejos violinistas** cavan madrigueras que retienen agua en la
      bajamar. Los machos tienen una pinza enormemente agrandada, inútil para
      comer y usada para hacer señales a las hembras y amenazar a otros machos.

      Los **fúndulos** son los pequeños y resistentes peces de toda marisma
      atlántica. Suben con la marea sobre el lodo para alimentarse y bajan con el
      reflujo, y toleran cambios de temperatura, salinidad y oxígeno que matarían
      a casi cualquier otra cosa.

      **Garcetas, garzas y águilas pescadoras** aparecen porque la marea que baja
      concentra las presas en charcos cada vez menores. La bajamar es la hora de
      comer.

      ## Qué observar

      La bajamar es la interesante: lodo al descubierto, madrigueras de cangrejo
      a la vista, aves trabajando los bordes. El carrizo alto y plumoso que se
      extiende por las orillas es Phragmites, y los cisnes blancos muy grandes
      son cisnes vulgares: ambos introducidos, ambos agresivos y ambos un
      problema para la marisma nativa.

      Consulte una tabla de mareas del puerto de New Haven antes de venir. El río
      es un lugar distinto en cada extremo del ciclo.

