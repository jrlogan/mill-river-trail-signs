  panel:

    # No species boxes on this sign yet. The three illustrations drawn for the
    # submarine sign are upland species and would be wrong here; a marsh sign
    # wants salt marsh cordgrass, ribbed mussel, fiddler crab, great egret.
    # Omitting them gives the locator map the full panel until that art exists.
    # species: []

    river_fact:
      # Ties the filled ground under the reader's feet to something they can act
      # on now, rather than leaving the marsh purely in the past tense.
      text:
        en: >-
          A salt marsh soaks up storm surge and slows it down before it reaches
          the street. The marshes that were filled here used to do that work for
          New Haven.
        es: >-
          Una marisma salada absorbe la marejada y la frena antes de que llegue a
          la calle. Las marismas que se rellenaron aquí hacían ese trabajo para
          New Haven.


web:
  subtitle:
    en: How a tidal marsh became an industrial riverbank, and what New Haven gave up when it did
    es: Cómo una marisma de marea se convirtió en una ribera industrial, y qué perdió New Haven al hacerlo

  body:
    en: |
      Stand on the Grand Avenue bridge and look down. Almost none of the ground
      around you is original. The Mill River here ran through a wide tidal marsh
      — mud, grass and shifting channels, flooded twice a day — and the solid
      land you are standing on is fill, carted in and dumped over the course of a
      century to raise the grade above the high tide mark.

      ## What a marsh was for

      A tidal marsh is not empty ground waiting to be improved, though that is
      exactly how New Haven's English settlers and the developers who followed
      them understood it. Marsh grass anchors sediment. The marsh shelters young
      fish, shellfish and birds. Above all it absorbs water: it takes a storm
      surge coming in off the harbour and slows it down before it reaches the
      street, and it takes fresh water coming down the river in flood and spreads
      it out. Filling a marsh removes that capacity permanently.

      What the marsh did produce, colonists could see: salt hay. By the 1830s
      people were cutting it off Ball Island for animal bedding and fodder.

      ## Allen Ball's bad land

      The river splits here, and the ground between the channels became Ball
      Island. It takes its name from Allen Ball, a farmer working for John
      Davenport, the minister who founded the New Haven Colony. Ball came into
      the land around 1641 through a deed to his brother-in-law.

      The island was considered bad land. It flooded constantly, it was muddy,
      and for two centuries nobody could think of much to do with it. It drifted
      into use as common ground. By the 1860s the lumber yard next door had taken
      it over, and industry had arrived on the river for good.

      ## Barnesville

      The corner of Grand Avenue and East Street, running down to the river, was
      once called Barnesville. It was named for Eli Barnes, a real estate
      developer and oyster farmer who built an inn on Grand Avenue around 1812,
      shortly after his marriage. He called it the Lafayette Hotel and hung a
      swinging portrait of the General on the front.

      There was almost nothing else here at the time. Getting to Fair Haven meant
      going all the way up State Street to cross the Mill River. In 1819 Barnes
      helped pay for a bridge at this spot, privately, and cut the journey short.
      The bridge fell into disrepair quickly and the city spent the following
      century replacing it.

      When the New Haven and Hartford Railroad opened in 1839, the calculation
      changed. Land next to a river and a rail line was worth filling.

      ## The Kickapoo Indian Medicine Company

      In 1887 two businessmen, Charles Bigelow and John E. Healy, moved their
      patent medicine works into a large brick warehouse at 521-525 Grand Avenue,
      across the river from Ball Island. They made and bottled Indian Sagwa,
      Indian Oil, Indian Worm Killer, Kickapoo Salve and Kickapoo Cough Cure.

      The company sold its products as authentic Native remedies, claiming a
      connection to a Texas band of the Kickapoo Nation. That claim was
      marketing. Healy and Bigelow were white promoters who had come out of the
      travelling-show business, and the Kickapoo name and imagery were borrowed
      to sell bottled alcohol and vegetable extract to white customers. The
      company ran large touring troupes that performed staged "Indian medicine
      shows" across the country, and it employed Native performers, a number of
      whom lived in the neighbourhood around this warehouse.

      It was one of the most successful patent medicine operations in the United
      States. It moved to 441 Chapel Street in 1893.

      ## What came next

      In 1890 the New Haven Electric Light Company built a power plant on the
      south side of Grand Avenue on Ball Island — one of the earliest electrical
      generating stations in the country, burning coal delivered by ship. As
      demand grew, the United Illuminating Company began work on its successor,
      English Station, in 1927. That plant ran until 1992.

      Both burned coal and oil beside a river that had already lost its marshes,
      and the site is heavily contaminated with asbestos and PCBs. The 1890 plant
      was demolished in 2021. English Station still stands, empty, in the middle
      of the river, and the cleanup continues.

      By 1970 the Mill River was measured at four times the legal limit for
      swimming. It has been recovering since the industry left.

    es: |
      Párese en el puente de Grand Avenue y mire hacia abajo. Casi nada del
      terreno que le rodea es original. Aquí el río Mill corría por una amplia
      marisma de marea — lodo, hierba y canales cambiantes, inundada dos veces al
      día — y la tierra firme sobre la que usted está es relleno, traído y
      vertido a lo largo de un siglo para elevar el nivel por encima de la marca
      de la marea alta.

      ## Para qué servía una marisma

      Una marisma de marea no es terreno vacío a la espera de mejoras, aunque así
      es exactamente como la entendieron los colonos ingleses de New Haven y los
      urbanizadores que vinieron después. La hierba de marisma fija el sedimento.
      La marisma da refugio a peces jóvenes, mariscos y aves. Sobre todo, absorbe
      agua: recibe la marejada que entra desde el puerto y la frena antes de que
      llegue a la calle, y recibe el agua dulce que baja crecida por el río y la
      reparte. Rellenar una marisma elimina esa capacidad para siempre.

      Lo que la marisma sí producía, los colonos lo veían: heno salado. Hacia
      1830 ya se segaba en la isla Ball para cama y forraje del ganado.

      ## La mala tierra de Allen Ball

      El río se divide aquí, y el terreno entre los canales pasó a ser la isla
      Ball. Debe su nombre a Allen Ball, un agricultor al servicio de John
      Davenport, el pastor que fundó la Colonia de New Haven. Ball adquirió estas
      tierras hacia 1641 mediante una escritura a su cuñado.

      La isla se consideraba mala tierra. Se inundaba constantemente, era
      fangosa, y durante dos siglos nadie supo bien qué hacer con ella. Acabó
      usándose como terreno comunal. Hacia 1860 el aserradero contiguo se había
      apropiado de ella, y la industria había llegado al río para quedarse.

      ## Barnesville

      La esquina de Grand Avenue con East Street, bajando hacia el río, se llamó
      en su día Barnesville. El nombre viene de Eli Barnes, promotor inmobiliario
      y ostricultor que construyó una posada en Grand Avenue hacia 1812, poco
      después de casarse. La llamó Hotel Lafayette y colgó en la fachada un
      retrato basculante del General.

      Por entonces casi no había nada más aquí. Para llegar a Fair Haven había
      que subir hasta State Street y cruzar allí el río Mill. En 1819 Barnes
      ayudó a pagar, de forma privada, un puente en este punto, y acortó el
      trayecto. El puente se deterioró pronto y la ciudad pasó el siglo siguiente
      reemplazándolo.

      Cuando en 1839 se abrió el ferrocarril de New Haven y Hartford, las cuentas
      cambiaron. Un terreno junto a un río y una vía férrea merecía rellenarse.

      ## La Kickapoo Indian Medicine Company

      En 1887 dos empresarios, Charles Bigelow y John E. Healy, trasladaron su
      fábrica de medicinas de patente a un gran almacén de ladrillo en el 521-525
      de Grand Avenue, al otro lado del río desde la isla Ball. Allí fabricaban y
      embotellaban Indian Sagwa, Indian Oil, Indian Worm Killer, Kickapoo Salve y
      Kickapoo Cough Cure.

      La empresa vendía sus productos como remedios indígenas auténticos y
      alegaba un vínculo con una banda de la Nación Kickapoo de Texas. Esa
      afirmación era publicidad. Healy y Bigelow eran promotores blancos venidos
      del mundo del espectáculo ambulante, y tomaron prestados el nombre y la
      imaginería kickapoo para vender alcohol embotellado y extracto vegetal a
      clientes blancos. La compañía mantenía grandes compañías de gira que
      representaban "espectáculos de medicina india" por todo el país, y empleaba
      a artistas indígenas, varios de los cuales vivían en el barrio que rodeaba
      este almacén.

      Fue una de las operaciones de medicina de patente con más éxito de Estados
      Unidos. En 1893 se mudó al 441 de Chapel Street.

      ## Lo que vino después

      En 1890 la New Haven Electric Light Company construyó una central eléctrica
      en el lado sur de Grand Avenue, en la isla Ball: una de las primeras
      centrales generadoras del país, que quemaba carbón traído por barco. Al
      crecer la demanda, la United Illuminating Company empezó en 1927 su
      sucesora, English Station. Esa planta funcionó hasta 1992.

      Ambas quemaron carbón y petróleo junto a un río que ya había perdido sus
      marismas, y el terreno está muy contaminado con amianto y PCB. La planta de
      1890 fue demolida en 2021. English Station sigue en pie, vacía, en medio
      del río, y la limpieza continúa.

      En 1970 se midió que el río Mill superaba en cuatro veces el límite legal
      para poder nadar. Se ha ido recuperando desde que la industria se marchó.

