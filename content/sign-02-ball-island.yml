# Echoes the opening line of the sign, which is also the thing most people
# standing here would never guess about the ground under them.
title:
  en: Marsh, Mud and Meadow
  es: Marisma, Lodo y Pradera

sign:

  lede:
    en: >-
      The land you are standing on was once marshland, mud and meadow. It sits
      above the high tide line only because fill was carted in and dumped here
      over many years. The marshes that covered this area sheltered animals,
      anchored plants, and filtered both the salt tides and the fresh water
      floods. New Haven's English settlers, and the developers who followed
      them, saw no value in keeping them.
    # The draft translation opened "El terrenoLa tierra que pisas" — an
    # un-deleted edit — and closed with a line of DeepL advertising. Rewritten.
    es: >-
      La tierra que pisa fue en su día marisma, lodo y pradera. Está por encima
      de la marea alta solo porque durante muchos años se trajo y se vertió aquí
      relleno. Las marismas que cubrían esta zona daban refugio a los animales,
      sostenían las plantas y filtraban tanto las mareas saladas como las
      crecidas de agua dulce. Los colonos ingleses de New Haven, y los
      urbanizadores que vinieron después, no vieron valor en conservarlas.

  section:
    heading:
      en: Ball Island and Barnesville
      es: La isla Ball y Barnesville
    body:
      en: >-
        The Mill River splits here to form Ball Island, named after 1641 for
        Allen Ball, a farmer working for New Haven's founder John Davenport. The
        land flooded constantly and was long considered worthless; by the 1830s
        people were cutting salt hay from it. Around 1812 Eli Barnes built an inn
        on Grand Avenue, the Lafayette Hotel, and the corner became known as
        Barnesville. Barnes helped pay for the first bridge across the river here
        in 1819. After the New Haven and Hartford Railroad opened in 1839,
        industry took the riverbank.
      es: >-
        El río Mill se divide aquí y forma la isla Ball, llamada así desde 1641
        por Allen Ball, un agricultor al servicio de John Davenport, fundador de
        New Haven. La tierra se inundaba sin parar y durante mucho tiempo se
        consideró inútil; hacia 1830 ya se segaba heno salado en ella. Cerca de
        1812 Eli Barnes construyó una posada en Grand Avenue, el Hotel Lafayette,
        y la esquina pasó a llamarse Barnesville. Barnes ayudó a pagar el primer
        puente sobre el río en 1819. Tras la apertura del ferrocarril de New
        Haven y Hartford en 1839, la industria se apoderó de la ribera.

