web:
  subtitle:
    en: Seals, sharpies and the oyster town at the mouth of two rivers
    es: Focas, sharpies y el pueblo ostrero en la desembocadura de dos ríos

  body:
    en: |
      The first English names for this stretch of water were Dragon Point, Dragon
      River and Dragon Town. The usual explanation is the right one: harbour
      seals hauled out along these banks in numbers when the first European
      sailors came up the river, and "dragon" was near enough.

      Seals are back in Long Island Sound in winter now. They were gone for a
      long time.

      ## A separate place

      Fair Haven sits about two miles from the New Haven Green, and it has spent
      much of its history being deliberately separate from it. The farmers here
      formed their own village in 1679 while still part of the New Haven Colony.
      A wooden bridge across the Quinnipiac in the late 1700s connected the two
      banks. The area between State Street and the Mill River became part of New
      Haven in 1784 and was called New Township. Fair Haven separated again in
      1837, with a population of about a thousand.

      A sea captain who visited in 1747 was struck enough by the place to call it
      Fayre Haven, and the name replaced the dragons.

      ## Clamtown

      What Fair Haven had was oysters, and nearly everyone in it worked them in
      one way or another: building boats, making kegs, cultivating and harvesting
      the beds, buying and selling the catch. By the middle of the 19th century
      New Haven's oyster trade was second only to Baltimore's by volume, and the
      nickname for the village was Clamtown.

      The boat they developed for the work was the sharpie: long, narrow,
      flat-bottomed, shallow enough to work the beds and fast enough to get the
      catch home. It is one of the few American small-craft designs to come out
      of a specific fishery in a specific place, and it came out of this one.

      Bigger vessels worked from here too, trading to the West Indies and
      bringing back sugar, molasses and fruit. The First Church on Grand Avenue
      had forty-eight ship captains in its congregation, and its 237-foot spire
      was the landmark returning sailors looked for, until a storm took a hundred
      feet off it in 1877.

      ## The race at midnight

      The public beds were closed all summer and the law came "off" at midnight
      on the first of November. What happened then was a spectator sport.

      Ernest Ingersoll wrote it down for the 1880 census, and it is worth having
      in his words:

      > On the day preceding, farmers flocked into Fair Haven from all the
      > surrounding country, and brought with them boats and canoes of antique
      > pattern and ruinous aspect. These rustics always met with a riotous
      > welcome from the town-boys, who hated rural competition. They were very
      > likely to find their boats, if not carefully watched, stolen and hidden
      > before they had a chance to launch them, or even temporarily disabled…
      >
      > As midnight approached, men dressed in oilskin, and carrying oars,
      > paddles, rakes, and tongs, collected all along the shore, where a crowd of
      > women and children assembled to see the fun… There were sharpies,
      > square-enders, skiffs, and canoes, and they lined the whole margin of the
      > river and harbor on each side in thick array…
      >
      > No eye could see the great face of the church-clock on the hill, but
      > lanterns glimmered upon a hundred watch-dials, and then were set down, as
      > only a coveted minute remained. There was a hush in the merriment along
      > the shore, an instant's calm, and then the great bell struck a deep-toned
      > peal. **It was like an electric shock.** Backs bent to oars, and paddles
      > churned the water. From opposite banks navies of boats leaped out and
      > advanced toward one another through the darkness, as though bent upon
      > mutual annihilation.

      Ingersoll places this on the Quinnipiac at Fair Haven. He does not mention
      the Mill.

      ## The watch houses

      An oyster bed cannot be fenced. Once the beds stopped being a common and
      became private leaseholds, somebody had to sit out on the water all night
      and watch them, and the harbour grew a scatter of small wooden watch
      houses to sit in.

      They were ordinary enough to turn up in the newspaper as addresses — a
      want-ad in 1881 tells applicants to "apply at the WATCH HOUSE, Long Wharf."
      One watchman on the east side of the harbour was reported in 1885 to have
      taken sixty-five pounds of eels in a day, which tells you something about
      how the nights passed.

      And they were armed. In September 1886 three boys, aged twelve to
      seventeen, stole a rowboat and pulled out to the watch house at Oyster
      Point, where J. B. Ludington was employed as watchman. They took a double
      barrelled shotgun, a revolver and a jack-knife. Ludington was away, and got
      back just as they were rowing off.

      You will read that New Haven's watch houses stood on stilts out in open
      water. That picture belongs to the Chesapeake, where cabins on driven
      pilings stood miles offshore. Here the ice and the sound's wave action
      would have taken them; our watch houses sat on wharf heads, on the low
      barrier spits, and on pilings close in. Close enough that you had to row.

      ## The collapse

      The oyster industry fell apart in the early 20th century. Overfishing did
      part of it; pollution did the rest. The beds sat downstream of an
      industrial river that had been treated as a drain for decades, and the
      oystermen fought the factories over the water for years without winning.

      There was also a single bad autumn that changed everything. In October 1894
      typhoid fever broke out at Wesleyan University in Middletown, and it struck
      only the fraternities that had served raw oysters at their initiation
      banquets. Herbert W. Conn, a Wesleyan biologist, worked back along the
      supply chain to a Fair Haven dealer. The oysters had been dredged from
      clean deep water — but, as the trade routinely did, they had been moved to
      floats in the brackish river to fatten before packing, and the floats were
      sitting downstream of a sewer outlet from a house where somebody was
      recovering from typhoid.

      It was the first clear demonstration in the United States that oysters
      could carry typhoid, and it is a piece of world epidemiology that happened
      to this river. The state began condemning beds near New Haven.

      Thirty years later a much larger typhoid epidemic ran through New York,
      Chicago and Washington — about 1,500 sickened, roughly 150 dead. Those
      oysters were traced to West Sayville on Long Island, not here. It did not
      matter. Demand collapsed by more than half, every grower on the Sound was
      suspect, and the National Shellfish Sanitation Program that followed in
      1925 closed urban estuaries like this one to direct market harvesting for
      good.

      **A word about a story you may hear:** that the government burned New
      Haven's oyster houses down. There is no record of it, and the epidemic that
      is usually attached to the story belongs to Long Island. What City Point
      oystermen remembered burning were *barrels* — condemned shipments pulled
      off freight trains at the rail yards and destroyed on the spot so they
      could not be resold. Burning barrels and closed businesses, told and retold
      for three generations, are the likeliest origin of the burning buildings.

      An adult oyster filters up to fifty gallons of water a day. The beds were
      not only a business, they were the harbour's filtration system, and losing
      them made the water worse in a way that made it harder to bring them back.

      ## Now

      Oystering on the Quinnipiac has been rebuilding, on cleaner water. The
      seals are back each winter. Watch also for the Asian shore crab, a small
      aggressive newcomer that arrived in ships' ballast and is now the most
      common crab on many Long Island Sound shorelines.

    es: |
      Los primeros nombres ingleses de este tramo de agua fueron Dragon Point,
      Dragon River y Dragon Town. La explicación habitual es la correcta: había
      focas comunes tumbadas en estas orillas en gran número cuando los primeros
      marineros europeos remontaron el río, y "dragón" les pareció bastante
      aproximado.

      Las focas han vuelto al estrecho de Long Island en invierno. Estuvieron
      ausentes mucho tiempo.

      ## Un lugar aparte

      Fair Haven está a unas dos millas del Green de New Haven, y ha pasado buena
      parte de su historia siendo deliberadamente distinto. Los agricultores de
      aquí formaron su propia aldea en 1679 siendo aún parte de la Colonia de New
      Haven. Un puente de madera sobre el Quinnipiac a finales del siglo XVIII
      unió las dos orillas. La zona entre State Street y el río Mill pasó a ser
      parte de New Haven en 1784 y se llamó New Township. Fair Haven volvió a
      separarse en 1837, con unos mil habitantes.

      Un capitán de barco que la visitó en 1747 quedó tan impresionado que la
      llamó Fayre Haven, y el nombre sustituyó a los dragones.

      ## Clamtown

      Lo que Fair Haven tenía eran ostras, y casi todo el mundo trabajaba en
      ellas de un modo u otro: construyendo barcas, haciendo barriles, cultivando
      y recogiendo los bancos, comprando y vendiendo la captura. A mediados del
      siglo XIX el comercio ostrero de New Haven solo era superado en volumen por
      el de Baltimore, y el apodo de la aldea era Clamtown.

      La barca que desarrollaron para el oficio fue el sharpie: larga, estrecha,
      de fondo plano, con poco calado para trabajar los bancos y rápida para
      llevar la captura a casa. Es uno de los pocos diseños de embarcación
      pequeña estadounidenses surgidos de una pesquería concreta en un lugar
      concreto, y salió de este.

      También operaban desde aquí barcos mayores, que comerciaban con las Indias
      Occidentales y traían azúcar, melaza y fruta. La First Church de Grand
      Avenue tenía cuarenta y ocho capitanes de barco en su congregación, y su
      aguja de 237 pies era la referencia que buscaban los marineros al volver,
      hasta que una tormenta le quitó cien pies en 1877.

      ## La carrera de medianoche

      Los bancos públicos estaban cerrados todo el verano y la ley se levantaba a
      medianoche del primero de noviembre. Lo que pasaba entonces era un
      espectáculo.

      Ernest Ingersoll lo dejó escrito para el censo de 1880, y vale la pena
      leerlo con sus palabras:

      > El día anterior, los granjeros acudían en tropel a Fair Haven desde todo
      > el campo de alrededor, y traían botes y canoas de hechura antigua y
      > aspecto ruinoso. Aquellos rústicos recibían siempre una bienvenida
      > alborotada de los chicos del pueblo, que detestaban la competencia rural.
      > Era muy probable que encontraran sus botes, si no los vigilaban bien,
      > robados y escondidos antes de poder botarlos, o averiados sin más…
      >
      > Al acercarse la medianoche, hombres vestidos con hule, cargando remos,
      > palas, rastrillos y tenazas, se juntaban por toda la orilla, donde una
      > multitud de mujeres y niños se reunía a ver la fiesta… Había sharpies,
      > botes de popa cuadrada, esquifes y canoas, y cubrían en apretada formación
      > todo el margen del río y del puerto por ambos lados…
      >
      > Nadie alcanzaba a ver la gran esfera del reloj de la iglesia en la
      > colina, pero las linternas brillaban sobre un centenar de esferas de
      > reloj de bolsillo, y luego se dejaban en el suelo cuando solo quedaba un
      > minuto codiciado. Hubo un silencio en el bullicio de la orilla, un
      > instante de calma, y entonces la gran campana dio una campanada grave.
      > **Fue como una descarga eléctrica.** Las espaldas se doblaron sobre los
      > remos y las palas batieron el agua. Desde orillas opuestas, escuadras de
      > botes salieron disparadas y avanzaron unas contra otras en la oscuridad,
      > como si se propusieran aniquilarse mutuamente.

      Ingersoll sitúa esto en el Quinnipiac, en Fair Haven. No menciona el Mill.

      ## Las casetas de vigilancia

      Un banco de ostras no se puede vallar. En cuanto los bancos dejaron de ser
      un bien común y pasaron a ser concesiones privadas, alguien tuvo que
      quedarse toda la noche sobre el agua vigilándolos, y el puerto se llenó de
      pequeñas casetas de madera donde sentarse.

      Eran tan corrientes que aparecían en el periódico como direcciones: un
      anuncio de 1881 pide a los interesados que "se presenten en la CASETA DE
      VIGILANCIA, Long Wharf". De un vigilante del lado este del puerto se contó
      en 1885 que había sacado sesenta y cinco libras de anguilas en un día, lo
      que dice algo sobre cómo pasaban las noches.

      Y estaban armadas. En septiembre de 1886 tres chicos de entre doce y
      diecisiete años robaron un bote de remos y salieron hasta la caseta de
      Oyster Point, donde J. B. Ludington trabajaba de vigilante. Se llevaron una
      escopeta de dos cañones, un revólver y una navaja. Ludington estaba fuera y
      volvió justo cuando se alejaban remando.

      Leerá por ahí que las casetas de New Haven se alzaban sobre pilotes en mar
      abierto. Esa imagen es de la bahía de Chesapeake, donde había cabañas sobre
      pilotes a millas de la costa. Aquí el hielo y el oleaje del estrecho se las
      habrían llevado: las nuestras se apoyaban en cabeceras de muelle, en las
      barras de arena bajas y en pilotes cercanos a tierra. Lo bastante cerca
      como para tener que ir remando.

      ## El derrumbe

      La industria ostrera se vino abajo a principios del siglo XX. La sobrepesca
      hizo una parte; la contaminación, el resto. Los bancos estaban aguas abajo
      de un río industrial tratado como desagüe durante décadas, y los
      ostricultores pelearon durante años con las fábricas por el agua sin ganar.

      Hubo además un otoño malo que lo cambió todo. En octubre de 1894 estalló
      una fiebre tifoidea en la Universidad Wesleyan de Middletown, y afectó solo
      a las fraternidades que habían servido ostras crudas en sus banquetes de
      iniciación. Herbert W. Conn, biólogo de Wesleyan, siguió la cadena de
      suministro hasta un comerciante de Fair Haven. Las ostras se habían dragado
      en agua profunda y limpia, pero, como hacía habitualmente el oficio, se
      habían pasado a flotadores en el agua salobre del río para engordarlas
      antes de empacarlas, y los flotadores estaban aguas abajo del desagüe de
      una casa donde alguien se recuperaba de tifoidea.

      Fue la primera demostración clara en Estados Unidos de que las ostras
      podían transmitir la tifoidea, y es un episodio de la epidemiología mundial
      que le ocurrió a este río. El estado empezó a clausurar bancos cerca de New
      Haven.

      Treinta años después, una epidemia mucho mayor recorrió Nueva York, Chicago
      y Washington: unos 1.500 enfermos y cerca de 150 muertos. Aquellas ostras
      se rastrearon hasta West Sayville, en Long Island, no hasta aquí. Dio igual.
      La demanda cayó más de la mitad, todos los cultivadores del estrecho
      quedaron bajo sospecha, y el National Shellfish Sanitation Program que
      siguió en 1925 cerró para siempre a la venta directa los estuarios urbanos
      como este.

      **Una nota sobre una historia que quizá oiga:** que el gobierno quemó las
      casas ostreras de New Haven. No hay constancia de ello, y la epidemia que
      suele asociarse al relato pertenece a Long Island. Lo que los ostricultores
      de City Point recordaban quemar eran *barriles*: cargamentos clausurados
      que se bajaban de los trenes de mercancías en las estaciones y se destruían
      allí mismo para que no pudieran revenderse. Barriles ardiendo y negocios
      cerrados, contados y recontados durante tres generaciones, son el origen
      más probable de los edificios ardiendo.

      Una ostra adulta filtra hasta cincuenta galones de agua al día. Los bancos
      no eran solo un negocio: eran el sistema de filtración del puerto, y
      perderlos empeoró el agua de una forma que hizo más difícil recuperarlos.

      ## Ahora

      La ostricultura en el Quinnipiac se está recuperando, con agua más limpia.
      Las focas vuelven cada invierno. Fíjese también en el cangrejo costero
      asiático, un recién llegado pequeño y agresivo que llegó en el lastre de
      los barcos y es hoy el cangrejo más común en muchas orillas del estrecho.

