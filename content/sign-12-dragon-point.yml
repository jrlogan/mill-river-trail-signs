    en: >-
      The earliest English names for this place were Dragon Point, Dragon River
      and Dragon Town. There were no dragons. There were harbour seals, hauled
      out on the banks in numbers, and the sailors who first came up this water
      named the place for them.
    es: >-
      Los primeros nombres ingleses de este lugar fueron Dragon Point, Dragon
      River y Dragon Town. No había dragones. Había focas comunes, tumbadas en
      las orillas en gran número, y los marineros que remontaron por primera vez
      estas aguas le pusieron nombre al sitio por ellas.

