sign:
  lede:
    en: >-
      The earliest English names for this place were Dragon Point, Dragon River
      and Dragon Town. There were no dragons. There were harbour seals, hauled
      out on the banks in numbers, and the sailors who first came up this water
      named the place for them.
    es: >-
      Los primeros nombres ingleses de este lugar fueron Dragon Point, Dragon
      River y Dragon Town. No había dragones. Había focas comunes, tumbadas en
      las orillas en gran número, y los marineros que remontaron por primera vez
      estas aguas le pusieron nombre al sitio por ellas.

  section:
    heading:
      en: Clamtown
      es: El pueblo de las almejas
    body:
      en: >-
        Part of the New Haven Colony, the farmers here formed a separate village
        in 1679, and the settlement separated from New Haven again in 1837 with
        about a thousand people. Almost all of them worked oysters — building
        sharpies, making kegs, cultivating and harvesting the beds, or buying and
        selling. By the mid-1800s New Haven's oyster trade was second only to
        Baltimore's in volume, and Fair Haven had earned the nickname Clamtown.
        A sea captain who came here in 1747 thought it beautiful enough to call
        it Fayre Haven, and the name stuck.
      es: >-
        Parte de la Colonia de New Haven, los agricultores de aquí formaron una
        aldea aparte en 1679, y el asentamiento volvió a separarse de New Haven
        en 1837 con unas mil personas. Casi todas trabajaban en la ostra:
        construyendo sharpies, haciendo barriles, cultivando y recogiendo los
        bancos, o comprando y vendiendo. A mediados del siglo XIX el comercio
        ostrero de New Haven solo era superado en volumen por el de Baltimore, y
        Fair Haven se había ganado el apodo de Clamtown. Un capitán de barco que
        llegó aquí en 1747 lo encontró tan bello que lo llamó Fayre Haven, y el
        nombre se quedó.

