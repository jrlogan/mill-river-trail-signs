web:
  subtitle:
    en: New Haven planned a highway along this river for twenty years, and the neighbours stopped it
    es: New Haven planeó durante veinte años una autopista junto a este río, y los vecinos la detuvieron

  body:
    en: |
      Most of what happened to the Mill River happened to it. Marshes were
      filled, banks were walled, factories were built and the water was used as a
      drain, and at no point does the record show much of an argument about it.

      This stretch is the exception. Here, something was proposed, fought over,
      and not built.

      ## The proposal

      In 1942 New Haven's planners first considered running an arterial road over
      the Mill River and through East Rock Park. The idea was reconsidered
      intermittently into the 1950s. By 1959 and 1960, the city, the state and
      the highway engineers were broadly in agreement about the purpose and the
      route.

      From a 1950s traffic-engineering point of view it was obvious. A river
      valley is a natural corridor: flat, continuous, already partly cleared, and
      running in the direction traffic wanted to go. Park land was cheap because
      the city already owned it.

      ## What was actually drawn

      The East Rock Connector was a **four-lane expressway, a little over a mile
      long**, from Interstate 91 at Exit 6 — Willow Street and Blatchley Avenue —
      north to an intersection at Whitney Avenue and Armory Street in Hamden. The
      Connecticut Highway Department was the sponsor, and the federal Bureau of
      Public Roads would have paid half. The estimate was **$5 million in 1964**
      and about **$10 million by 1968**.

      The design is the part worth pausing on. To save land, the two
      carriageways were to run on **opposite banks of the Mill River** — and the
      river between them was to be **straightened, narrowed and encased in a
      concrete channel**, functioning as the highway's median strip. North of
      Orange Street the northbound lanes would cross back over, and the road
      would run along the foot of the rock.

      The river was not an obstacle to be bridged. It was to be the gap between
      the lanes.

      ## The fight

      Opposition built between 1961 and 1965 as the drawings made the scale of
      the taking clear — residents of East Rock, Cedar Hill and Fair Haven, and
      of Spring Glen over the Hamden line, together with the city's own Park
      Commission. The *New Haven Register*, which supported highway building
      generally, came out against this one, arguing that the state was trying to
      steamroll its wishes against those of the people the road would harm.

      In 1964 **State Representative Lawrence O'Brien** led the opposition in the
      legislature, arguing the connector would not relieve congestion at all but
      simply concentrate it at the northern end, dumping traffic onto Whitney
      Avenue.

      ## The law that killed it

      And here is why this fight matters beyond New Haven.

      In 1965 the Connecticut General Assembly passed what is now **section
      7-131j of the General Statutes**. It says that where the state wants to
      take municipal land held for conservation or recreation and use it for a
      highway, it must provide comparable replacement land or pay for it; it must
      hold an extra public hearing, at which it must state its **"reasons for the
      proposed taking of the open space land rather than other land"**; and:

      > the state shall not take, for highway or other purposes, any such land
      > unless the governing body of the municipality in which the land is
      > located has, **by majority vote of all its members, approved the proposed
      > taking**.

      A town could now say no. New Haven's Board of Aldermen withheld approval,
      and the connector became legally untenable. It was formally abandoned
      around 1970.

      **The federal government did not enact equivalent protection for parkland
      until the following year**, in Section 4(f) of the Department of
      Transportation Act of 1966. A neighbourhood argument about this river bank
      helped produce a state law that got there first.

      ## What it cost anyway

      Interstate 91 was built, along the eastern edge, between 1962 and 1966, and
      it took roughly ten acres of park, meadow and tidal marsh with it. The park
      you can walk in today is what survived the compromise, not what was
      defended.

      ## The road that is still half there

      Go and look at Exit 6. The interchange was built to feed a highway that was
      never built, and it shows: oversized ramp structures, viaducts straddling
      the river, and ramp stubs that simply stop. It is the clearest physical
      evidence on this trail of something that did not happen.

      ## Why this matters on a trail sign

      Almost every other sign on this trail describes something the city did to
      the river without much public argument. This one describes the moment the
      argument was had, in public, and the public won part of it.

      The trail you are standing on exists because that stayed true: people who
      use a place turn out to be the ones who defend it.

    es: |
      Casi todo lo que le pasó al río Mill le fue hecho. Se rellenaron marismas,
      se amurallaron orillas, se construyeron fábricas y se usó el agua como
      desagüe, y en ningún momento consta que hubiera mucha discusión al
      respecto.

      Este tramo es la excepción. Aquí algo se propuso, se peleó y no se
      construyó.

      ## La propuesta

      En 1942 los planificadores de New Haven consideraron por primera vez llevar
      una vía arterial sobre el río Mill y a través del parque de East Rock. La
      idea se retomó de forma intermitente hasta los años cincuenta. Hacia 1959 y
      1960, la ciudad, el estado y los ingenieros de carreteras coincidían a
      grandes rasgos en el propósito y el trazado.

      Desde la ingeniería de tráfico de los años cincuenta era evidente. Un valle
      fluvial es un corredor natural: llano, continuo, ya parcialmente despejado
      y en la dirección que el tráfico quería seguir. El suelo del parque salía
      barato porque la ciudad ya era su dueña.

      ## Lo que llegó a dibujarse

      El East Rock Connector era una **autopista de cuatro carriles, de poco más
      de una milla**, desde la interestatal 91 en la salida 6 — Willow Street y
      Blatchley Avenue — hasta un cruce en Whitney Avenue con Armory Street, en
      Hamden. Lo promovía el Departamento de Carreteras de Connecticut y la
      Bureau of Public Roads federal habría pagado la mitad. El presupuesto era de
      **5 millones de dólares en 1964** y de unos **10 millones en 1968**.

      Lo que conviene detenerse a mirar es el diseño. Para ahorrar suelo, las dos
      calzadas iban a discurrir por **orillas opuestas del río Mill**, y el río
      entre ellas iba a ser **enderezado, estrechado y encajonado en un canal de
      hormigón**, haciendo de mediana de la autopista. Al norte de Orange Street
      los carriles en sentido norte volverían a cruzar y la vía seguiría al pie de
      la roca.

      El río no era un obstáculo que salvar. Era el hueco entre los carriles.

      ## La pelea

      La oposición creció entre 1961 y 1965, según los planos dejaban claro el
      alcance de la expropiación: vecinos de East Rock, Cedar Hill y Fair Haven, y
      de Spring Glen al otro lado del límite con Hamden, junto con la propia
      comisión de parques de la ciudad. El *New Haven Register*, que en general
      apoyaba la construcción de autopistas, se puso en contra de esta,
      argumentando que el estado intentaba imponer su voluntad por encima de la
      de la gente a la que la carretera perjudicaría.

      En 1964 el **diputado estatal Lawrence O'Brien** encabezó la oposición en la
      legislatura, sosteniendo que la conexión no aliviaría la congestión sino que
      la concentraría en el extremo norte, descargando el tráfico en Whitney
      Avenue.

      ## La ley que la mató

      Y aquí está lo que hace que esta pelea importe más allá de New Haven.

      En 1965 la Asamblea General de Connecticut aprobó lo que hoy es la
      **sección 7-131j de los Estatutos Generales**. Establece que, cuando el
      estado quiera tomar suelo municipal destinado a conservación o recreo para
      hacer una carretera, debe aportar terreno equivalente o pagarlo; debe
      celebrar una audiencia pública adicional en la que ha de exponer sus
      **"razones para tomar el suelo de espacio abierto en lugar de otro suelo"**;
      y:

      > el estado no tomará, para carreteras u otros fines, ninguno de esos
      > terrenos salvo que el órgano de gobierno del municipio donde se
      > encuentran lo haya **aprobado por mayoría de todos sus miembros**.

      Un municipio ya podía decir que no. La Junta de Concejales de New Haven no
      dio su aprobación y la conexión quedó jurídicamente inviable. Se abandonó
      formalmente hacia 1970.

      **El gobierno federal no aprobó una protección equivalente para los parques
      hasta el año siguiente**, en la sección 4(f) de la Ley del Departamento de
      Transporte de 1966. Una discusión vecinal sobre esta orilla ayudó a producir
      una ley estatal que llegó antes.

      ## Lo que costó de todos modos

      La interestatal 91 sí se construyó, por el borde este, entre 1962 y 1966, y
      se llevó unos diez acres de parque, prado y marisma de marea. El parque por
      el que se puede caminar hoy es lo que sobrevivió al acuerdo, no lo que se
      defendió.

      ## La carretera que sigue medio ahí

      Vaya a ver la salida 6. El enlace se construyó para alimentar una autopista
      que nunca se hizo, y se nota: estructuras de rampa sobredimensionadas,
      viaductos a caballo del río y muñones de rampa que sencillamente se acaban.
      Es la prueba física más clara de todo el sendero de algo que no ocurrió.

      ## Por qué esto está en un letrero

      Casi todos los demás letreros de este sendero describen algo que la ciudad
      le hizo al río sin mucha discusión pública. Este describe el momento en que
      sí hubo discusión, en público, y el público ganó una parte.

      El sendero en el que usted está existe porque eso siguió siendo cierto: los
      que usan un lugar acaban siendo los que lo defienden.

