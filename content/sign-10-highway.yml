title:
  en: The Highway That Wasn't
  es: La Autopista que No Fue

sign:
  lede:
    en: >-
      There was supposed to be a road here. From 1942 into the 1960s, New Haven
      and the state planned an arterial connector running along the Mill River
      and cutting through East Rock Park. By 1960 the route was broadly agreed.
      It was never built, because the people who used the park organised and
      stopped it.
    es: >-
      Aquí iba a haber una carretera. Desde 1942 hasta los años sesenta, New
      Haven y el estado planearon una vía de conexión que discurriría junto al
      río Mill y atravesaría el parque de East Rock. Hacia 1960 el trazado estaba
      acordado a grandes rasgos. Nunca se construyó, porque quienes usaban el
      parque se organizaron y lo impidieron.

  section:
    heading:
      en: Save Our Park
      es: Salvemos Nuestro Parque
    body:
      en: >-
        The East Rock Connector was to be four lanes, a mile and a bit, running
        from Interstate 91 to Whitney Avenue — with the two carriageways on
        opposite banks and the Mill River straightened into a concrete channel
        between them, serving as the median. Residents in East Rock, Cedar Hill,
        Fair Haven and Hamden fought it for four years. In 1965 the General
        Assembly passed a law saying the state could not take municipal park land
        for a highway unless the town's own governing body approved it by
        majority vote. New Haven's aldermen declined. The road was dead. The
        federal government would not protect parkland from highways until the
        following year.
      es: >-
        El East Rock Connector iba a tener cuatro carriles y algo más de una
        milla, de la interestatal 91 hasta Whitney Avenue, con las dos calzadas en
        orillas opuestas y el río Mill enderezado en un canal de hormigón entre
        ellas, haciendo de mediana. Los vecinos de East Rock, Cedar Hill, Fair
        Haven y Hamden lucharon contra él durante cuatro años. En 1965 la
        Asamblea General aprobó una ley que impedía al estado tomar terreno
        municipal de parque para una carretera sin la aprobación por mayoría del
        órgano de gobierno del propio municipio. Los concejales de New Haven se
        negaron. La carretera estaba muerta. El gobierno federal no protegería
        los parques frente a las autopistas hasta el año siguiente.

