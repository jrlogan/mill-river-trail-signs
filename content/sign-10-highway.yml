sign:
  lede:
    en: >-
      There was supposed to be a road here. From 1942 into the 1960s, New Haven
      and the state planned an arterial connector running along the Mill River
      and cutting through East Rock Park. By 1960 the route was broadly agreed.
      It was never built, because the people who used the park organised and
      stopped it.
    es: >-
      Aquí iba a haber una carretera. Desde 1942 hasta los años sesenta, New
      Haven y el estado planearon una vía de conexión que discurriría junto al
      río Mill y atravesaría el parque de East Rock. Hacia 1960 el trazado estaba
      acordado a grandes rasgos. Nunca se construyó, porque quienes usaban el
      parque se organizaron y lo impidieron.

  section:
    heading:
      en: Save Our Park
      es: Salvemos Nuestro Parque
    body:
      en: >-
        The East Rock Connector became a flashpoint. City officials and the state
        highway department called it an integral part of the highway system.
        Residents and park groups called it a waste of good parkland and formed a
        Save Our Park Committee. They won: the connector was never built. They
        did not win everything — Interstate 91 went through anyway and took about
        ten acres of the park. This is one of the few places in New Haven where
        you can stand in something that exists because people refused to let it
        be paved.
      es: >-
        El East Rock Connector se convirtió en un punto de conflicto. Los cargos
        municipales y el departamento estatal de carreteras lo llamaban parte
        integral del sistema viario. Los vecinos y los grupos de parques lo
        llamaban un desperdicio de buen terreno de parque y formaron el comité
        Save Our Park. Ganaron: la conexión nunca se construyó. No ganaron del
        todo: la interestatal 91 se hizo igualmente y se llevó unos diez acres
        del parque. Este es uno de los pocos lugares de New Haven donde uno puede
        estar dentro de algo que existe porque la gente se negó a que lo
        asfaltaran.

