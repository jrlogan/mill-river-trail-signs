name: Build and deploy the sign pages

# The QR codes on the printed signs point at this site, so the deploy has to
# stay boring and reliable: any push to main rebuilds the pages from the sign
# content files and publishes them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The print renderer needs Chromium; the web build does not. Skipping the
      # download keeps CI from pulling ~150 MB on every run.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # sharp is only needed to regenerate web images, which are committed.
      - run: npm ci --omit=dev

      - name: Build the site
        run: node build/render-site.mjs

      - name: Check the QR destinations resolve to real pages
        run: node build/check-links.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
